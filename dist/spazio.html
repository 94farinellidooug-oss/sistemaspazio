// Pontos e barras levam data-tip, que mostra o valor ao passar o mouse.

// Linhas de 0 a 10 (intensidade da queixa). series: [{vals, cor, nome}], vals pode ter null; o.mini desenha sem eixos.
function linhas(series, labels, o={}){
  const W=o.w||640, H=o.h||220, [L,R,T,B]=o.mini?[6,8,6,6]:[28,14,12,26], n=Math.max(2,...series.map(s=>s.vals.length));
  const x=i=>L+i*(W-L-R)/(n-1), y=v=>T+(1-v/10)*(H-T-B);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Gráfico de evolução')}">`;
  if(!o.mini) [0,5,10].forEach(v=>s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
  labels.forEach((l,i)=>s+=`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`);
  series.forEach((se,k)=>{ if(!se.vals.some(v=>v!=null)) return;
    // Valores ausentes (null) ficam sem ponto e interrompem a linha (queixa não medida naquele atendimento).
    const ult=se.vals.reduce((u,v,i)=>v!=null?i:u,-1);
    const d=se.vals.map((v,i)=>v==null?'':`${i&&se.vals[i-1]!=null?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    s+=`<g class="se" data-s="${k}"><path d="${d}" fill="none" stroke="${se.cor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    s+=se.vals.map((v,i)=>{ if(v==null) return ''; const tip=o.mini?'':(o.tips?.[i]||`${se.nome?se.nome+' · ':''}${labels[i]||''}: ${String(v).replace('.',',')}`);
      return `<circle class="${tip?'pt-i':''}" cx="${x(i)}" cy="${y(v)}" r="${i===ult?5:3.5}" fill="${i===ult?se.cor:'var(--surface)'}" stroke="${se.cor}" stroke-width="2" ${tip?`data-tip="${esc(tip)}"`:''}/>`; }).join('')+'</g>';
  });
  return s+'</svg>';
}
// Barras verticais; a última fica destacada (período atual).
function barrasV(vals, labels, o={}){
  const W=o.w||560, H=o.h||190, B=24, T=18, max=Math.max(1,...vals), bw=W/vals.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'')}">`;
  [0,.5,1].forEach(f=>s+=`<line class="gl" x1="0" x2="${W}" y1="${H-B-f*(H-B-T)}" y2="${H-B-f*(H-B-T)}"/>`);
  vals.forEach((v,i)=>{ const h=v/max*(H-B-T), x=i*bw+bw*.22, w=bw*.56, ult=i===vals.length-1;
    s+=`<rect class="br-i" x="${x}" y="${H-B-h}" width="${w}" height="${Math.max(h,2)}" rx="6" fill="${ult?'var(--brand)':'var(--sage)'}" data-tip="${esc(o.tips?o.tips[i]:`${labels[i]}: ${v}`)}"/><text class="ax" x="${x+w/2}" y="${H-B-h-6}" text-anchor="middle">${v}</text><text class="ax" x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`; });
  return s+'</svg>';
}
// Anel de progresso (0 a 1) com texto no centro.
function anel(pct, txt, cor='var(--brand)'){
  const r=24, c=2*Math.PI*r;
  return `<svg class="anel" viewBox="0 0 60 60" width="60" height="60" aria-hidden="true"><circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="30" cy="30" r="${r}" fill="none" stroke="${cor}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(Math.max(0,Math.min(1,pct))*c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 30 30)"/><text x="30" y="34.5" text-anchor="middle">${txt}</text></svg>`;
}
// Barras dos cinco elementos a partir do estado calculado pela avaliação (elemState), sem recalcular nada.
// base: estado da avaliação basal, mostrado como marca vertical.
const ORDEM_EL = ['madeira','fogo','terra','metal','agua'];
const tipoEl = s => s.exc>s.def&&s.exc>0?'exc':s.def>0?'def':'';
function barrasEl(st, base){
  const pct = s => Math.min(100,Math.round(Math.max(s.def,s.exc)/1.6*100));
  return `<div class="elbars">${ORDEM_EL.map(e=>{ const s=st[e], k=tipoEl(s), E=EL[e], b=base?pct(base[e]):null;
    return `<div class="elb"><span class="han" style="color:${E.cor}">${E.han}</span><span class="nm">${E.nome}</span>
      <div class="trk">${b!==null?`<i class="base" style="left:${b}%" title="Basal"></i>`:''}<i class="fill ${k}" style="width:${Math.max(k?6:0,pct(s))}%;background:${E.cor}"></i></div>
      <span class="st ${k}">${k==='exc'?'Excesso':k==='def'?'Deficiência':'Equilíbrio'}</span></div>`;}).join('')}</div>`;
}
// Variação entre dois valores de intensidade (queda é melhora).
const delta = (a,b) => { if(a==null||b==null) return ''; const d=b-a; return `<span class="delta ${d<0?'bom':d>0?'ruim':''}">${d<0?'▼':d>0?'▲':'='} ${Math.abs(d)}</span>`; };
function vPacientes(){
  const n=db.patients.length;
  return `<div class="head"><div><h1>Pacientes</h1><p>${n} cadastrado${n===1?'':'s'}</p></div>
    <div class="quick">${n?`<label class="busca">${ic('busca')}<input id="pq" placeholder="Nome, queixa ou telefone" aria-label="Buscar paciente por nome, queixa ou telefone" value="${esc(ui.pq)}"></label>`:''}<button class="btn pri" data-act="novo-paciente">${ic('novo')}Novo paciente</button></div></div>
  ${n?`<div class="pgrid" id="plist">${patientRows()}</div>`:vazio('pacientes','Nenhum paciente cadastrado','Cadastre o primeiro paciente para começar os atendimentos.',`<button class="btn pri sm" data-act="novo-paciente">${ic('novo')}Cadastrar paciente</button>`)}`;
}
const outras = p => { const n=p.queixas.filter(x=>x.ativa&&x.id!=='q1').length; return n?` <span class="muted sm">+${n} queixa${n===1?'':'s'}</span>`:''; };
function patientRows(){
  const q=ui.pq.toLowerCase();
  const list=db.patients.filter(p=>!q || [p.name,p.phone,...p.queixas.map(x=>x.descricao)].join(' ').toLowerCase().includes(q));
  if(!list.length) return vazio('busca','Nenhum paciente encontrado','Confira a grafia ou cadastre um novo paciente.',`<button class="btn sm" data-act="novo-paciente">${ic('novo')}Novo paciente</button>`);
  return list.map(p=>{ const s=p.sessions.map(x=>x.eva), m=melhoraPct(s), al=alertasDe(p);
    const prox=db.appts.filter(a=>a.pid===p.id&&a.date>=TODAY&&!a.done).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
    return `<button class="pc" data-act="open" data-pid="${p.id}"><div class="pc-h"><span class="avatar lg">${initials(p.name)}</span><span class="grow"><b>${esc(p.name)}</b><small>${age(p.birth)} anos · ${p.sessions.length} sess${p.sessions.length===1?'ão':'ões'}</small></span>${p.exemplo?'<span class="pill ex">exemplo</span>':''}${al.length?`<span class="pill crit" data-tip="${al.join(', ')}">${ic('escudo')}</span>`:''}</div>
      <div class="pc-q"><span class="trunc">${esc(p.queixa)}${outras(p)}</span>${s.length>1?linhas([{cor:'var(--brand)',vals:s}],[],{w:110,h:36,mini:1}):''}</div>
      <div class="pc-f">${m!==null?`<span class="pill ${m>0?'ok':'warn'}">${m>0?'▼ '+m+'%':'sem melhora'}</span>`:!p.assess.length?'<span class="pill acc">sem avaliação</span>':'<span class="pill">em início</span>'}<span class="muted">${prox?`${ic('agenda')} ${fmt(prox.date)} ${prox.time}`:'sem agendamento'}</span></div></button>`; }).join('');
}
// gráficos e acompanhamento. Todos os números vêm dos dados gravados (sessões, avaliações e agenda).

function calMini(){
  const base=new Date(TODAY+'T12:00'), ano=base.getFullYear(), mes=base.getMonth(), ini=(new Date(ano,mes,1).getDay()+6)%7, nd=new Date(ano,mes+1,0).getDate();
  const dia=d=>`${ano}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`, sel=ui.dia||TODAY;
  const cel=[...Array(ini)].map(()=>'<span></span>').join('')+[...Array(nd)].map((_,i)=>{ const d=dia(i+1), n=db.appts.filter(a=>a.date===d).length;
    return `<button class="cm-d ${d===TODAY?'hoje':''} ${d===sel?'sel':''} ${d<TODAY?'pass':''}" data-act="dia" data-d="${d}" aria-label="${fmt(d)}: ${n} agendamento${n===1?'':'s'}" ${n?`data-tip="${n} agendamento${n===1?'':'s'}"`:''}>${i+1}${n?`<i>${'<b></b>'.repeat(Math.min(n,3))}</i>`:''}</button>`; }).join('');
  const L=db.appts.filter(a=>a.date===sel).sort((a,b)=>a.time.localeCompare(b.time));
  return `<div class="card cm"><div class="card-h"><h3>${base.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h3><a class="btn ghost sm" href="#agenda">Agenda ${ic('dir')}</a></div>
    <div class="cm-g">${['S','T','Q','Q','S','S','D'].map(x=>`<small>${x}</small>`).join('')}${cel}</div>
    <div class="cm-l"><div class="lbl">${sel===TODAY?'Hoje':fmt(sel)}</div>${L.length?L.map(a=>{const p=patient(a.pid);return `<button class="cm-i ${a.done?'feito':''}" data-act="open" data-pid="${a.pid}"><span class="mono">${a.time}</span><span class="trunc">${esc(p?.name||'')}</span>${a.done?ic('okc'):''}</button>`;}).join(''):'<p class="muted sm">Nenhum agendamento neste dia.</p>'}</div></div>`;
}

function vPainel(){
  const agora=new Date(), h=agora.getHours(), hhmm=`${String(h).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}`;
  const hoje=db.appts.filter(a=>a.date===TODAY).sort((a,b)=>a.time.localeCompare(b.time)), feitos=hoje.filter(a=>a.done).length;
  const prox=hoje.find(a=>!a.done && a.time>=hhmm) || hoje.find(a=>!a.done), pp=prox&&patient(prox.pid);
  const al=[...new Set(hoje.map(a=>a.pid))].map(patient).filter(p=>p && alertasDe(p).length);
  const ac=acompanhamento(), atrasados=db.appts.filter(a=>a.date<TODAY && !a.done);
  const comS=db.patients.filter(p=>p.sessions.length>1), melh=comS.filter(p=>melhoraPct(p.sessions.map(s=>s.eva))>0);
  // Sessões registradas por semana, nas últimas 8 semanas.
  const sem=[...Array(8)].map((_,i)=>{ const ini=weekStart(i-7), fim=addDays(6,ini);
    return [db.patients.reduce((t,p)=>t+p.sessions.filter(s=>s.date>=ini&&s.date<=fim).length,0), fmt(ini).slice(0,5)]; });
  // Intensidade média da queixa principal (EVA) por número da sessão, entre os pacientes que chegaram até ela.
  const maxN=Math.max(0,...db.patients.map(p=>p.sessions.length));
  const med=[...Array(maxN)].map((_,k)=>{ const v=db.patients.map(p=>p.sessions[k]?.eva).filter(x=>x!=null); return [Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10, v.length]; });
  // Financeiro da semana a partir dos agendamentos e seus valores.
  const ws=weekStart(0), we=addDays(6,ws), ag=db.appts.filter(a=>a.date>=ws&&a.date<=we);
  const prev=ag.reduce((n,a)=>n+a.valor,0), real=ag.filter(a=>a.done).reduce((n,a)=>n+a.valor,0), pr=prev?Math.round(real/prev*100):0;
  const atv=[...db.patients.flatMap(p=>[...p.sessions.map((s,i)=>({d:s.date,i:'estet',t:i===0?'Primeira sessão':`${i+1}ª sessão`,p,x:s.tec.join(', ')||'sessão registrada'})),
      ...p.assess.map((a,i)=>({d:a.date,i:'yin',t:i===0?'Avaliação energética':'Reavaliação energética',p,x:`${a.signs.length} sinais`}))]),
    ...db.appts.filter(a=>a.done&&a.date<=TODAY).map(a=>({d:a.date,i:'okc',t:'Agendamento concluído',p:patient(a.pid),x:a.tipo}))].filter(a=>a.p && a.d<=TODAY).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,6);
  const quando = d => { const n=diasDesde(d); return n===0?'hoje':n===1?'ontem':`há ${n} dias`; };

  return `<div class="head"><div><h1>${h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}, ${PROF.nome.split(' ')[0]}</h1><p>${agora.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})} · ${hoje.length} agendamento${hoje.length===1?'':'s'} hoje</p></div></div>

    <a class="acao" href="#cadastro" data-act="novo-paciente"><span class="tico acc">${ic('novo')}</span><span><b>Novo paciente</b><small>cadastro</small></span></a>

    <button class="acao" data-act="busca"><span class="tico acc">${ic('busca')}</span><span><b>Buscar</b><small><kbd>Ctrl</kbd><kbd>K</kbd></small></span></button>
  </div>

  <div class="tiles">
    <a class="tile lk" href="#agenda">${anel(hoje.length?feitos/hoje.length:0,`${feitos}/${hoje.length}`)}<div><b>Agendamentos hoje</b><small>concluídos / marcados</small></div></a>
    <button class="tile lk ${al.length?'t-crit':''}" data-act="rolar" data-to="${al.length?'alertas':'agenda-dia'}"><span class="tico crit">${ic('escudo')}</span><div><b class="num">${al.length}</b><small>alerta${al.length===1?'':'s'} de segurança em pacientes de hoje</small></div></button>

        <button class="btn sm ${a===prox?'pri':''}" data-act="sessao" data-pid="${p.id}" aria-label="Registrar sessão de ${esc(p.name)}" data-tip="Registrar sessão">${ic('play')}</button></div>`}).join('')}</div>`
      :vazio('agenda','Dia livre','Nenhum agendamento para hoje.',`<a class="btn sm" href="#agenda">${ic('mais')}Agendar</a>`)}</div>

    <div class="card"><div class="card-h"><h3>Evolução média da queixa</h3><span class="muted sm">EVA por sessão</span></div>
      ${med.length?linhas([{cor:'var(--brand)',vals:med.map(x=>x[0]),nome:'Média'}],med.map((_,k)=>`${k+1}ª`),{w:420,h:170,label:'EVA média por número da sessão',tips:med.map(([v,n],k)=>`${k+1}ª sessão: média ${String(v).replace('.',',')} (${n} paciente${n===1?'':'s'})`)})

    <div class="card fin-r"><div class="card-h"><h3>Financeiro da semana</h3><a class="btn ghost sm" href="#agenda" aria-label="Abrir agenda">${ic('dir')}</a></div>

  </div>

  <div class="dash-c">

      ${ac.length||atrasados.length?ac.map(({p,m})=>`<details class="ac"><summary><span class="avatar">${initials(p.name)}</span><span class="grow"><b>${esc(p.name)}</b><span class="chips">${m.map(([i,k,t])=>`<span class="pill ${k}">${ic(i)}${t}</span>`).join('')}</span></span>${ic('baixo')}</summary>
        <div class="ac-b"><div class="ac-s"><div><small>Queixa principal</small><b>${esc(p.queixa)}</b></div><div><small>Última sessão</small><b>${p.sessions.length?fmt(p.sessions.at(-1).date):'—'}</b></div><div><small>Sessões</small><b>${p.sessions.length}</b></div></div>
        <div class="chips"><button class="btn sm" data-act="open" data-pid="${p.id}">${ic('pacientes')}Prontuário</button>${!p.assess.length?`<button class="btn sm pri" data-act="ir" data-to="avaliacao" data-pid="${p.id}">${ic('yin')}Avaliar</button>`:''}<a class="btn sm" href="#agenda" data-act="book" data-pid="${p.id}">${ic('agendado')}Agendar</a></div></div></details>`).join('')
        +atrasados.map(a=>`<div class="ac-r"><span class="tico sm warn">${ic('relogio')}</span><span class="grow"><b>${esc(patient(a.pid)?.name||'')}</b><small class="muted">agendamento de ${fmt(a.date)} às ${a.time} sem conclusão</small></span><a class="btn sm" href="#agenda">Abrir agenda</a></div>`).join('')
      :vazio('okc','Todos acompanhados','Nenhum paciente com retorno atrasado, avaliação pendente ou sem melhora.')}</div>
    <div class="card"><div class="card-h"><h2>Atividades recentes</h2></div>

        :vazio('historico','Sem atividades','As sessões, avaliações e agendamentos concluídos aparecem aqui.')}</div>

}

    <div class="card"><div class="chips" style="margin-bottom:8px">

function vPontos(){

  return l.map(p=>`<div class="pcard"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span class="code">${p.code}</span><span class="muted">${p.pinyin}</span></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="muted" style="font-size:.8rem">${MER[p.mer][0]}</span>${elTag(MER[p.mer][1])}</div>
    <div><span class="lbl">Localização</span><br>${p.loc}</div><div><span class="lbl">Ações</span><br>${p.acoes}</div>${p.cautela?`<span class="pill warn" style="justify-self:start">${CAUT[p.cautela]}</span>`:''}</div>`).join('')||'<p class="muted">Nenhum ponto encontrado.</p>';
}
// - Resumo: indicadores, queixas com a evolução de cada uma, atendimentos recentes, mapa dos cinco
//   elementos, padrões validados e dados cadastrais;
// - Prontuário: evolução das queixas, avaliação basal × atual e linha do tempo dos atendimentos e
//   reavaliações;
// - Anamnese e alertas; Registrar sessão (substituído pelo ambiente de atendimento na etapa 2D).
// Nenhum cálculo clínico é feito aqui: os estados vêm de raciocinio/avaliacao.js, como antes.

const QCOR = ['var(--brand)','#b8894a','#5f7f9c','#9a6b8f','#6f8f8a'];
const corQ = (p,q) => QCOR[p.queixas.indexOf(q)%QCOR.length];
const aceitos = a => a?evaluate(a.signs).filter(h=>a.status[h.p.id]==='aceito'):[];
const ordinal = n => `${n}º`;

// Bloco de uma sessão, com o mesmo conteúdo da lista de sessões do protótipo.
const sessHtml = s => `<div class="sess"><div><b class="mono">${fmt(s.date)}</b><div class="eva muted">EVA ${s.eva}/10</div></div><div><div class="chips" style="margin-bottom:6px">${s.tec.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}${s.pontos.map(c=>`<span class="pill acc mono" title="${esc(PT[c]?.pinyin||'')}">${esc(c)}</span>`).join('')}</div>${s.nota?`<p>${esc(s.nota)}</p>`:'<p class="muted">Sem anotações.</p>'}</div></div>`;

// Eventos do prontuário em ordem cronológica: atendimentos finalizados e avaliações sem atendimento no dia.
function eventos(p){
  const fin=p.atendimentos.filter(a=>a.status==='finalizado'), ss=p.sessions;
  const E=fin.map((a,i)=>({tipo:'at',data:a.data,n:i+1,a,s:ss[i],av:p.avaliacoes.find(x=>x.id===a.avaliacaoId)}));
  p.avaliacoes.filter(x=>!x.atendimentoId).forEach(av=>E.push({tipo:'av',data:av.date,av}));
  return E.sort((x,y)=>x.data.localeCompare(y.data));
}
const rotuloAv = (p,av) => av===p.avaliacoes[0]?'avaliação basal':'reavaliação';
function itemTempo(p,e){
  if(e.tipo==='av'){ const h=aceitos(e.av);
    return `<div class="lt-i av"><span class="hi-n">${ic('yin')}</span><div class="grow"><div class="lt-h"><b>${fmt(e.data)}</b><span class="pill acc">${rotuloAv(p,e.av)}</span><span class="muted sm">avaliação energética sem atendimento no dia</span></div>
      <p class="sm">${e.av.signs.length} sina${e.av.signs.length===1?'l':'is'} observado${e.av.signs.length===1?'':'s'}${h.length?` · padrões validados: ${h.map(x=>esc(x.p.nome)).join(', ')}`:''}</p>${e.av.nota?`<p class="muted sm">${esc(e.av.nota)}</p>`:''}</div></div>`; }
  const outras=p.queixas.filter(q=>q.id!==QUEIXA_PRINCIPAL&&e.a.evolucao.intensidades[q.id]!=null), h=aceitos(e.av);
  return `<div class="lt-i"><span class="hi-n">${e.n}</span><div class="grow"><div class="lt-h"><b>${ordinal(e.n)} atendimento</b>${e.av?`<span class="pill acc">${ic('yin')}${rotuloAv(p,e.av)}</span>`:''}${e.a.origem==='v1'?'<span class="pill" data-tip="Registro trazido do protótipo na conversão dos dados">protótipo</span>':''}</div>
    ${sessHtml(e.s)}
    ${outras.length?`<div class="chips">${outras.map(q=>`<span class="pill"><i class="dotq" style="background:${corQ(p,q)}"></i>${esc(q.descricao)}: ${e.a.evolucao.intensidades[q.id]}/10</span>`).join('')}</div>`:''}
    ${h.length?`<p class="muted sm">Padrões validados na avaliação: ${h.map(x=>esc(x.p.nome)).join(', ')}</p>`:''}</div></div>`;
}

function cardQueixas(p){
  const ativas=p.queixas.filter(q=>q.ativa), resolvidas=p.queixas.filter(q=>!q.ativa);
  const cartao = q => { const s=serieQueixa(p,q.id).map(x=>x.valor), m=melhoraPct(s), cor=corQ(p,q);
    return `<div class="qc ${q.ativa?'':'res'}"><div class="qc-h"><i style="background:${cor}"></i><b class="grow">${esc(q.descricao)}</b>${q.id===QUEIXA_PRINCIPAL?'<span class="pill">principal</span>':`<button class="btn ghost sm" data-act="queixa-ativa" data-q="${q.id}">${q.ativa?`${ic('check')}Resolvida`:`${ic('retorno')}Reativar`}</button>`}</div>
      ${s.length?`<div class="qc-v"><span class="big">${s.at(-1)}</span><span class="muted">/10</span>${delta(s[0],s.at(-1))}<span class="muted sm">desde a 1ª medida (${s[0]})</span></div>
        ${s.length>1?linhas([{cor,vals:s}],[],{w:300,h:64,mini:1}):''}${m!==null?`<span class="pill ${m>0?'ok':'warn'}" style="justify-self:start">${m>0?'▼ '+m+'% de melhora':'sem melhora'}</span>`:''}`
      :`<p class="muted sm">${q.id===QUEIXA_PRINCIPAL?'A intensidade aparece com o primeiro atendimento registrado.':'A intensidade passa a ser medida no próximo atendimento.'}</p>`}</div>`; };
  return `<div class="card"><div class="card-h"><h2>Queixas</h2><span class="muted sm">intensidade de 0 a 10</span></div>
    <div class="qgrid">${ativas.map(cartao).join('')}</div>
    <form id="f-queixa" class="nq"><label class="so-leitor" for="nq-desc">Nova queixa</label><input id="nq-desc" placeholder="Adicionar outra queixa (ex.: insônia)" required maxlength="120"><button class="btn sm">${ic('mais')}Adicionar</button></form>
    ${resolvidas.length?`<details class="mais"><summary>${resolvidas.length} queixa${resolvidas.length===1?' resolvida':'s resolvidas'} ${ic('baixo')}</summary><div class="qgrid" style="margin-top:10px">${resolvidas.map(cartao).join('')}</div></details>`:''}</div>`;
}

function cardCadastro(p){
  const c=p.cadastro||{}, v=x=>x?esc(x):'<span class="muted">—</span>';
  const L=[['Telefone',p.phone],['CPF',c.cpf],['E-mail',c.email],['Cidade',c.cidade?`${c.cidade} · hemisfério ${c.hemisferio||'Sul'}`:''],['Endereço',c.endereco],['Contato de emergência',c.contatoEmergencia],['Nascimento',p.birth?fmt(p.birth):''],['Consentimento LGPD',p.consentimento?`registrado em ${fmt(p.consentimento)}`:'']];
  return `<div class="card"><div class="card-h"><h2>Dados cadastrais</h2><button class="btn ghost sm" data-act="editar-paciente" data-pid="${p.id}">${ic('editar')}Editar</button></div>
    <div class="corr-g">${L.map(([l,x])=>`<div><small>${l}</small><b>${v(x)}</b></div>`).join('')}</div></div>`;
}

function abaResumo(p){
  const a=p.assess.at(-1), a0=p.assess[0], st=a?elemState(a.signs,a.status):null, ac=aceitos(a);
  const ss=p.sessions, s=ss.map(x=>x.eva), m=melhoraPct(s);
  const prox=db.appts.filter(x=>x.pid===p.id&&x.date>=TODAY&&!x.done).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time))[0];
  const E=eventos(p);
  return `<div class="tiles">
    <div class="tile"><span class="tico acc">${ic('lista')}</span><div><b class="num">${p.sessions.length}</b><small>atendimento${p.sessions.length===1?'':'s'}${p.sessions[0]?` desde ${fmt(p.sessions[0].date)}`:''}</small></div></div>
    <div class="tile">${m!==null?anel(Math.max(0,m)/100,m+'%','var(--ok)'):`<span class="tico">${ic('evolucao')}</span>`}<div><b>${m!==null?(m>0?'Melhora':'Sem melhora'):'Sem evolução'}</b><small>${m!==null?'queixa principal, desde o 1º atendimento':'registre ao menos dois atendimentos'}</small></div></div>
    <div class="tile"><span class="tico acc">${ic('yin')}</span><div><b>${p.assess.length?p.assess.length+(p.assess.length===1?' avaliação':' avaliações'):'Sem avaliação'}</b><small>${a0?`basal em ${fmt(a0.date)}`:'avaliação energética pendente'}</small></div></div>
    <div class="tile"><span class="tico">${ic('agenda')}</span><div><b>${prox?`${fmt(prox.date)} · ${prox.time}`:'—'}</b><small>${prox?esc(prox.tipo):'sem próximo agendamento'}</small></div></div>
  </div>
  <div class="grid g-side">
    <div class="grid" style="align-content:start">
      ${cardQueixas(p)}
      <div class="card"><div class="card-h"><h2>Atendimentos recentes</h2>${E.length?`<button class="btn ghost sm" data-act="tab" data-t="sessoes">Ver prontuário ${ic('dir')}</button>`:''}</div>
        ${ss.length?`<div class="hist">${ss.map((x,i)=>[x,i+1]).reverse().slice(0,3).map(([x,n])=>`<div class="hi on"><div class="hi-h"><span class="hi-n">${n}</span><span class="grow"><b>${fmt(x.date)}</b><small>${esc(x.tec.join(', '))||'atendimento'}</small></span><span class="pill">EVA ${x.eva}</span></div>${x.nota?`<div class="hi-b"><p>${esc(x.nota)}</p></div>`:''}</div>`).join('')}</div>`
          :vazio('lista','Nenhum atendimento','Use “Novo atendimento” para registrar o primeiro.')}</div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card"><div class="card-h"><h2>Mapa dos cinco elementos</h2>${a?`<span class="pill">${p.assess.length>1?'reavaliação':'basal'} · ${fmt(a.date)}</span>`:''}</div>
        ${st?`${barrasEl(st, p.assess.length>1?elemState(a0.signs,a0.status):null)}${p.assess.length>1?`<p class="muted sm" style="margin-top:6px">Marca vertical: posição na avaliação basal (${fmt(a0.date)}).</p>`:''}
          <details class="mais"><summary>Ver pentagrama ${ic('baixo')}</summary>${pentagram(st,null)}</details>`
        :vazio('yin','Sem avaliação energética','Faça a avaliação para ver o mapa dos cinco elementos.',`<button class="btn sm pri" data-act="ir" data-to="avaliacao" data-pid="${p.id}">${ic('yin')}Avaliar</button>`)}</div>
      <div class="card"><div class="card-h"><h2>Padrões validados</h2><a class="btn sm" href="#avaliacao">Nova avaliação</a></div>
        ${ac.length?ac.map(h=>`<div class="row"><div class="grow"><b>${h.p.nome}</b></div>${elTag(h.p.el)}<span class="pill ${h.p.tipo==='exc'?'crit':'warn'}">${h.p.tipo==='exc'?'excesso':'deficiência'}</span></div>`).join(''):'<p class="muted sm">Nenhum padrão validado.</p>'}
        ${a?.nota?`<p class="muted" style="margin-top:8px">Nota: ${esc(a.nota)}</p>`:''}
      </div>
      ${cardCadastro(p)}
    </div>
  </div>`;
}

function abaProntuario(p){
  const fin=p.atendimentos.filter(a=>a.status==='finalizado'), Q=p.queixas, E=eventos(p);
  const labels=fin.map(a=>fmt(a.data).slice(0,5)), series=Q.map(q=>({cor:corQ(p,q),nome:q.descricao,vals:fin.map(a=>a.evolucao.intensidades[q.id]??null)})).filter(x=>x.vals.some(v=>v!=null));
  const a0=p.avaliacoes[0], a1=p.avaliacoes.at(-1);
  const s0=a0&&new Set(a0.signs), s1=a1&&new Set(a1.signs), dois=p.avaliacoes.length>1;
  const resolv=dois?a0.signs.filter(x=>!s1.has(x)):[], novos=dois?a1.signs.filter(x=>!s0.has(x)):[];
  const qs=Q.filter(q=>serieQueixa(p,q.id).length);
  return `<div class="card"><div class="card-h"><h2>Evolução das queixas</h2>${series.length>1?`<div class="leg">${series.map((s,i)=>`<button class="leg-b" data-act="serie" data-s="${i}" aria-pressed="true" data-tip="Mostrar ou ocultar"><i style="background:${s.cor}"></i>${esc(s.nome)}</button>`).join('')}</div>`:'<span class="muted sm">intensidade de 0 a 10 por atendimento</span>'}</div>
    ${fin.length?`${linhas(series,labels,{label:'Intensidade das queixas por atendimento',w:1000,h:240})}
      <div class="qsum">${qs.map(q=>{ const v=serieQueixa(p,q.id).map(x=>x.valor); return `<div><i style="background:${corQ(p,q)}"></i><span>${esc(q.descricao)}${q.ativa?'':' (resolvida)'}</span><b>${v[0]} → ${v.at(-1)}</b>${delta(v[0],v.at(-1))}</div>`; }).join('')}</div>`
      :vazio('evolucao','Ainda sem atendimentos','A evolução aparece a partir do primeiro atendimento registrado.')}</div>
  ${a0?`<div class="card" style="margin-top:20px"><div class="card-h"><h2>Avaliação basal × atual</h2><span class="muted sm">${fmt(a0.date)}${dois?` → ${fmt(a1.date)}`:''}</span></div>
    ${dois?`<div class="cmp"><div><div class="lbl">Basal · ${fmt(a0.date)}</div>${pentagram(elemState(a0.signs,a0.status),null)}</div><div><div class="lbl">Atual · ${fmt(a1.date)}</div>${pentagram(elemState(a1.signs,a1.status),null)}</div></div>
      <div class="grid g2" style="margin-top:8px"><div>${barrasEl(elemState(a1.signs,a1.status),elemState(a0.signs,a0.status))}<p class="muted sm" style="margin-top:6px">Marca vertical: posição na avaliação basal.</p></div>
        <div class="sinais-cmp"><div><span class="pill ok">${ic('check')}${resolv.length} sina${resolv.length===1?'l':'is'} que não aparece${resolv.length===1?'':'m'} mais</span><p class="muted sm">${resolv.map(x=>esc(SIGN[x]||x)).join(', ')||'—'}</p></div>
        <div><span class="pill warn">${ic('mais')}${novos.length} sina${novos.length===1?'l':'is'} novo${novos.length===1?'':'s'}</span><p class="muted sm">${novos.map(x=>esc(SIGN[x]||x)).join(', ')||'—'}</p></div></div></div>`
    :`<div class="grid g2"><div>${pentagram(elemState(a0.signs,a0.status),null)}</div><div>${barrasEl(elemState(a0.signs,a0.status))}<p class="muted sm" style="margin-top:10px">Só existe a avaliação basal. A comparação aparece depois da primeira reavaliação.</p></div></div>`}</div>`:''}
  <div class="card" style="margin-top:20px"><div class="card-h"><h2>Linha do tempo</h2><span class="muted sm">${fin.length} atendimento${fin.length===1?'':'s'} · ${p.avaliacoes.length} avalia${p.avaliacoes.length===1?'ção':'ções'}</span></div>
    ${E.length?`<div class="lt">${[...E].reverse().map(e=>itemTempo(p,e)).join('')}</div>`:'<p class="muted">Nenhuma sessão registrada.</p>'}</div>`;
}

function abaAnamnese(p){
  const F=[['historia','História da queixa'],['sono','Sono'],['alimentacao','Alimentação e sede'],['evacuacao','Evacuação e micção'],['emocoes','Emoções'],['medicamentos','Medicamentos em uso']];
  return `<div class="grid g-side"><div class="card"><h3>Anamnese integrativa</h3><div class="form">${F.map(([k,l])=>`<div class="field full"><label class="lbl" for="an-${k}">${l}</label><textarea id="an-${k}" data-anam="${k}">${esc(p.anam[k])}</textarea></div>`).join('')}</div><p class="muted" style="font-size:.8rem;margin-top:8px">Salvo automaticamente ao sair do campo.</p></div>
    <div class="card" style="align-self:start"><h3>Alertas de segurança</h3><p class="muted" style="margin-bottom:10px;font-size:.86rem">Usados para avisar sobre pontos e técnicas contraindicados ao registrar a sessão.</p>
    ${[['gestante','Gestante'],['anticoagulante','Uso de anticoagulante'],['marcapasso','Portador de marcapasso']].map(([k,l])=>`<label style="display:flex;gap:8px;padding:6px 0"><input type="checkbox" id="al-${k}" data-alert="${k}" ${p.alerts[k]?'checked':''}> ${l}</label>`).join('')}</div></div>`;
}

function abaNova(p){
  const a=p.assess.at(-1), outras=p.queixas.filter(q=>q.ativa&&q.id!==QUEIXA_PRINCIPAL);
  const TEC=['Acupuntura','Auriculoterapia','Moxabustão','Ventosa','Eletroacupuntura','Massagem Tuiná','Sangria'];
  return `<div class="grid g-side"><div class="card"><h3>Registrar sessão</h3>
    <form id="f-session" class="form">
      <div class="field"><label class="lbl" for="ns-date">Data</label><input id="ns-date" type="date" value="${TODAY}" required></div>
      <div class="field"><label class="lbl" for="ns-eva">${outras.length?`${esc(p.queixa)} (EVA)`:'Intensidade da queixa (EVA)'}: <b id="ns-eva-v">5</b></label><input id="ns-eva" type="range" min="0" max="10" value="5"></div>
      ${outras.map(q=>{ const ult=serieQueixa(p,q.id).at(-1)?.valor??5; return `<div class="field"><label class="lbl" for="ns-q-${q.id}">${esc(q.descricao)}: <b id="ns-q-${q.id}-v">${ult}</b></label><input id="ns-q-${q.id}" data-q="${q.id}" type="range" min="0" max="10" value="${ult}"></div>`; }).join('')}
      <div class="field full"><span class="lbl">Técnicas</span><div class="chips">${TEC.map(t=>`<label class="chip"><input type="checkbox" name="tec" value="${t}" style="margin-right:4px">${t}</label>`).join('')}</div></div>
      <div class="field full"><label class="lbl" for="ns-pts">Pontos utilizados (separe por vírgula)</label><input id="ns-pts" class="mono" placeholder="E36, BP6, F3"></div>
      <div class="full" id="ns-warn"></div>
      <div class="field full"><label class="lbl" for="ns-nota">Evolução e observações</label><textarea id="ns-nota"></textarea></div>
      <div class="full"><button class="btn pri">Salvar no prontuário</button></div>
    </form></div>
    <div class="card" style="align-self:start"><h3>Sugestões da última avaliação</h3><p class="muted" style="font-size:.82rem;margin-bottom:8px">Pontos ligados aos padrões validados. Clique para adicionar.</p>
    ${a?aceitos(a).map(h=>`<div style="margin-bottom:10px"><b>${h.p.nome}</b><div class="chips" style="margin-top:6px">${h.p.pontos.map(([c,j])=>`<button type="button" class="chip mono" data-act="addpt" data-c="${c}" title="${esc(j)}">${c}</button>`).join('')}</div></div>`).join('')||'<p class="muted">Nenhum padrão validado.</p>':'<p class="muted">Sem avaliação.</p>'}</div></div>`;
}

const ABAS = { resumo:abaResumo, sessoes:abaProntuario, anamnese:abaAnamnese, nova:abaNova };
function vProntuario(){
  const p=patient(ui.pid)||db.patients[0];
  if(!p) return `<div class="head"><div><h1>Prontuário</h1></div></div>${vazio('pacientes','Nenhum paciente cadastrado','Cadastre um paciente para abrir o prontuário.',`<button class="btn pri sm" data-act="novo-paciente">${ic('novo')}Cadastrar paciente</button>`)}`;
  ui.pid=p.id; if(!ABAS[ui.tab]) ui.tab='resumo';
  const alerts=alertasDe(p);
  const tabs=[['resumo','Resumo','painel'],['sessoes','Prontuário','historico'],['anamnese','Anamnese e alertas','folha'],['nova','Registrar sessão','mais']];
  ui.crumbs=[['#pacientes','Pacientes'],[null,p.name]];
  return `<div class="perfil-h"><span class="avatar xl">${initials(p.name)}</span><div class="grow"><h1>${esc(p.name)}</h1>
    <div class="meta"><span>${p.birth?age(p.birth)+' anos':'idade não informada'}</span>${p.phone?`<span>${ic('tel')}${esc(p.phone)}</span>`:''}${p.cadastro?.cidade?`<span>${ic('local')}${esc(p.cadastro.cidade)}</span>`:''}${p.exemplo?'<span class="pill ex">exemplo</span>':''}</div>
    ${alerts.length?`<div class="chips" style="margin-top:8px">${alerts.map(x=>`<span class="pill crit">${ic('escudo')}${x}</span>`).join('')}</div>`:''}</div>
    <div class="perfil-a"><button class="btn" data-act="editar-paciente" data-pid="${p.id}">${ic('editar')}Cadastro</button><button class="btn" data-act="ir" data-to="avaliacao" data-pid="${p.id}">${ic('yin')}Avaliação energética</button><button class="btn" data-act="ir" data-to="pentagrama" data-pid="${p.id}">${ic('estrela')}Pentagrama</button><button class="btn pri" data-act="tab" data-t="nova">${ic('play')}Novo atendimento</button></div></div>
    <div class="tabs" role="tablist">${tabs.map(([k,l,i])=>`<button role="tab" data-act="tab" data-t="${k}" class="${ui.tab===k?'on':''}" aria-selected="${ui.tab===k}">${ic(i)}${l}</button>`).join('')}</div>${ABAS[ui.tab](p)}`;
}
const VIEWS={painel:vPainel,agenda:vAgenda,pacientes:vPacientes,prontuario:vProntuario,cadastro:vCadastro,avaliacao:vAvaliacao,pentagrama:vPentagrama,pontos:vPontos,biblioteca:vPontos,administracao:vAdministracao};
EM_BREVE.forEach(k=>VIEWS[k]=()=>vEmBreve(k));
function route(){ const r=location.hash.slice(1); return VIEWS[r]?r:'painel'; }
let ultimaRota='';
function render(keepScroll){
  const r=route(), y=scrollY, v=document.getElementById('view');
  ui.crumbs=[]; const html=VIEWS[r](); renderNav(r);
  v.innerHTML=html;
  // Transição suave só quando a tela muda (não a cada clique dentro dela).
  if(r!==ultimaRota){ v.classList.remove('entra'); void v.offsetWidth; v.classList.add('entra'); ultimaRota=r; }
  if(keepScroll) scrollTo(0,y);
}
function toast(m, tipo='ok'){ const t=document.getElementById('toast'); t.className='toast '+tipo; t.innerHTML=`${ic(tipo==='ok'?'okc':'info')}<span></span>`; t.lastChild.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2600); }
// Camadas sobre a tela: busca global, notificações, perfil e atalhos.
function abrir(ov){ ui.ov=ui.ov===ov?null:ov; if(ov==='busca'){ ui.q=''; ui.bi=0; } render(true); }
// Abre a tela (ou a re-renderiza, se já estiver nela).
function irPara(h){ if(location.hash.slice(1)===h) render(); else location.hash=h; }
// Dica flutuante para elementos com data-tip (botões de ícone, gráficos, calendário).
const tip=document.getElementById('tip');
document.addEventListener('mouseover',ev=>{ const t=ev.target.closest('[data-tip]'); if(!t||!t.dataset.tip){ tip.hidden=true; return; }
  tip.textContent=t.dataset.tip; tip.hidden=false; const b=t.getBoundingClientRect(), w=tip.offsetWidth;
  tip.style.left=Math.max(8,Math.min(innerWidth-w-8,b.left+b.width/2-w/2))+'px'; tip.style.top=(b.top-tip.offsetHeight-8<4?b.bottom+8:b.top-tip.offsetHeight-8)+'px'; });
addEventListener('scroll',()=>{ tip.hidden=true; },{passive:true});
addEventListener('hashchange',()=>{ if(route()!=='cadastro') ui.editPid=null; ui.menuAberto=false; ui.ov=null; tip.hidden=true; render(); scrollTo(0,0); });
addEventListener('keydown',ev=>{
  const emCampo=ev.target.matches('input, textarea, select');
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ ev.preventDefault(); abrir('busca'); return; }
  if(ev.key==='Escape'){ if(ui.ov){ ui.ov=null; render(true); } else if(ui.menuAberto){ ui.menuAberto=false; render(true); } return; }
  if(ui.ov==='busca'&&['ArrowDown','ArrowUp','Enter'].includes(ev.key)){ ev.preventDefault(); const L=document.querySelectorAll('.pal-i');
    if(ev.key==='Enter'){ L[ui.bi]?.click(); return; } ui.bi=(ui.bi+(ev.key==='ArrowDown'?1:-1)+L.length)%Math.max(1,L.length); document.getElementById('pal-l').innerHTML=listaBusca(); return; }
  if(emCampo||ev.ctrlKey||ev.metaKey||ev.altKey) return;
  if(ev.key==='/'){ ev.preventDefault(); abrir('busca'); }
  else if(ev.key==='['){ ui.menuMini=!ui.menuMini; render(true); }
  else if(ev.key==='?'){ abrir('atalhos'); }
});
document.addEventListener('click',ev=>{
  tip.hidden=true;
  // Clique fora de uma camada aberta fecha a camada.
  if(ui.ov && !ev.target.closest('.dd-p, .pal, [data-act="busca"], [data-act="notif"], [data-act="perfil"], [data-act="atalhos"]')){ const fora=!ev.target.closest('[data-act],a'); ui.ov=null; render(true); if(fora) return; }
  // Itens da busca e das notificações: marcam como lida, fecham a camada e abrem o destino.
  const item=ev.target.closest('.pal-i, .dd-p .nt');
  if(item){ if(item.dataset.lida) ui.lidas.add(item.dataset.lida); ui.ov=null;
    if(item.getAttribute('href')==='#cadastro') ui.editPid=null;
    if(item.matches('a[href]')){ ev.preventDefault(); irPara(item.getAttribute('href').slice(1)); return; } }
  const t=ev.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act;
  if(a==='open'){ ui.pid=t.dataset.pid; ui.tab='resumo'; irPara('prontuario'); }
  else if(a==='novo-paciente'){ ui.editPid=null; irPara('cadastro'); }
  else if(a==='editar-paciente'){ ui.editPid=t.dataset.pid; irPara('cadastro'); }
  else if(a==='queixa-ativa'){ const q=alternarQueixa(patient(ui.pid),t.dataset.q,new Date().toISOString()); if(q){ save(); render(true); toast(q.ativa?'Queixa reativada':'Queixa marcada como resolvida'); } }
  else if(a==='sessao'){ ui.pid=t.dataset.pid; ui.tab='nova'; irPara('prontuario'); }
  else if(a==='ver-ponto'){ ui.ptQ=t.dataset.c; ui.ptMer=''; irPara('biblioteca'); }
  else if(a==='busca'||a==='notif'||a==='perfil'||a==='atalhos'){ abrir(a); }
  else if(a==='fechar'){ ui.ov=null; render(true); }
  else if(a==='ler-todas'){ notificacoes().forEach(n=>ui.lidas.add(n.k)); ui.ov=null; render(true); toast('Notificações marcadas como lidas'); }
  else if(a==='aviso'){ ui.ov=null; render(true); toast(t.dataset.m,'info'); }
  else if(a==='dia'){ ui.dia=t.dataset.d; render(true); }
  else if(a==='rolar'){ const d=document.getElementById(t.dataset.to); d?.scrollIntoView({behavior:'smooth',block:'start'}); d?.querySelector('input')?.focus({preventScroll:true}); }
  else if(a==='serie'){ const on=t.getAttribute('aria-pressed')!=='false'; t.setAttribute('aria-pressed',String(!on)); t.closest('.card').querySelectorAll(`.chart .se[data-s="${t.dataset.s}"]`).forEach(g=>g.classList.toggle('oculta',on)); }
  else if(a==='book'){ ui.bookPid=t.dataset.pid; }
  else if(a==='tab'){ ui.tab=t.dataset.t; render(true); }
  else if(a==='sign'){ const s=t.dataset.s, L=ui.assess.signs; const i=L.indexOf(s); i<0?L.push(s):L.splice(i,1); render(true); }
  else if(a==='hyp'){ const id=t.dataset.p; ui.assess.status[id] = ui.assess.status[id]===t.dataset.st ? '' : t.dataset.st; render(true); }
  else if(a==='save-assess'){ const A=ui.assess, p=patient(A.pid); registrarAvaliacao(p,{id:uid(),date:TODAY,signs:[...A.signs],status:{...A.status},nota:A.nota},new Date().toISOString()); save(); ui.pid=p.id; ui.tab='resumo'; ui.assess=null; toast('Avaliação salva no prontuário'); location.hash='prontuario'; }
  else if(a==='el'){ ui.el = t.dataset.e && ui.el!==t.dataset.e ? t.dataset.e : null; render(true); }
  else if(a==='mer'){ ui.ptMer=t.dataset.m; render(true); }
  else if(a==='week'){ ui.week = t.dataset.d==='0'?0:ui.week+Number(t.dataset.d); render(true); }
  else if(a==='appt'){ const x=db.appts.find(z=>z.id===t.dataset.id); x.done=!x.done; save(); render(true); toast(x.done?'Atendimento concluído':'Atendimento reaberto'); }
  else if(a==='addpt'){ const i=document.getElementById('ns-pts'); const L=i.value.split(',').map(s=>s.trim()).filter(Boolean); if(!L.includes(t.dataset.c)) L.push(t.dataset.c); i.value=L.join(', '); i.dispatchEvent(new Event('input',{bubbles:true})); }
  else if(a==='menu-mini'){ ui.menuMini=!ui.menuMini; render(true); }
  else if(a==='menu-abrir'){ ui.menuAberto=!ui.menuAberto; render(true); }
  else if(a==='menu-fechar'){ ui.menuAberto=false; render(true); }
  else if(a==='ir'){ ui.pid=t.dataset.pid; if(t.dataset.to==='avaliacao') ui.assess=null; if(t.dataset.to==='pentagrama') ui.el=null; irPara(t.dataset.to); }
  else if(a==='exportar'){ baixar(t.dataset.f==='v1'?exportarV1():exportarV2(), `${t.dataset.f==='v1'?'spazio-v1':'musubi'}-dados-${TODAY}.json`); toast('Arquivo exportado'); }
  else if(a==='reset'){ restaurarExemplos(); ui.assess=null; ui.pid='p1'; toast('Dados de exemplo restaurados'); render(); }
});
document.addEventListener('keydown',ev=>{ if((ev.key==='Enter'||ev.key===' ') && ev.target.matches('.node')){ ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); }});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='pal-q'){ ui.q=t.value; ui.bi=0; document.getElementById('pal-l').innerHTML=listaBusca(); return; }
  if(t.id==='pq'){ ui.pq=t.value; document.getElementById('plist').innerHTML=patientRows(); }
  else if(t.id==='pt-q'){ ui.ptQ=t.value; document.getElementById('ptlist').innerHTML=pointCards(); }
  else if(t.id==='as-nota'){ ui.assess.nota=t.value; }
  else if(t.id==='ns-eva'){ document.getElementById('ns-eva-v').textContent=t.value; }
  else if(t.dataset.q&&t.type==='range'){ document.getElementById(t.id+'-v').textContent=t.value; }
  else if(t.id==='np-name'||t.id==='np-q'){ previaCadastro(); }
  else if(t.id==='np-cpf'){ t.setCustomValidity(''); }
  if(t.id==='ns-pts'||t.name==='tec') sessionWarn();
});
function sessionWarn(){
  const p=patient(ui.pid), codes=document.getElementById('ns-pts').value.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
  const tec=[...document.querySelectorAll('input[name=tec]:checked')].map(x=>x.value);
  document.getElementById('ns-warn').innerHTML=pointWarnings(codes,p,tec).map(([k,m])=>`<div class="notice ${k==='crit'?'crit':''}" style="margin-bottom:6px"><b>${k==='crit'?'Atenção':'Cautela'}</b> ${esc(m)}</div>`).join('');
}
// Baixa um texto como arquivo (cópia de segurança).
function baixar(texto, nome){ const u=URL.createObjectURL(new Blob([texto],{type:'application/json'})), l=document.createElement('a'); l.href=u; l.download=nome; document.body.append(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); }
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='imp-arq' && t.files[0]){ const f=t.files[0]; t.value='';
    if(!confirm(`Importar “${f.name}”? Os dados atuais deste navegador serão substituídos. Exporte antes se quiser guardá-los.`)) return;
    f.text().then(x=>{ const erro=importar(x); if(erro){ toast(erro,'info'); return; } ui.assess=null; ui.pid=db.patients[0]?.id||''; toast('Dados importados'); render(); }); return; }
  if(t.id==='pr-patient'){ ui.pid=t.value; render(true); }
  else if(t.id==='as-patient'){ ui.pid=t.value; ui.assess={pid:t.value,signs:[],status:{},nota:''}; render(true); }
  else if(t.id==='pt-patient'){ ui.pid=t.value; render(true); }
  else if(t.id==='cb-sheng'){ ui.sheng=t.checked; render(true); }
  else if(t.id==='cb-ke'){ ui.ke=t.checked; render(true); }
  else if(t.dataset.anam){ patient(ui.pid).anam[t.dataset.anam]=t.value; save(); toast('Anamnese salva'); }
  else if(t.dataset.alert){ patient(ui.pid).alerts[t.dataset.alert]=t.checked; save(); render(true); }
  else if(t.name==='tec'){ t.closest('.chip').classList.toggle('on',t.checked); }
});
document.addEventListener('submit',ev=>{
  ev.preventDefault(); const f=ev.target, v=id=>document.getElementById(id).value;
  if(f.id==='f-patient'){
    const cpf=document.getElementById('np-cpf');
    if(!cpfValido(cpf.value)){ cpf.setCustomValidity('CPF inválido: confira os 11 números.'); cpf.reportValidity(); return; }
    const em=new Date().toISOString(), lgpd=document.getElementById('np-lgpd');
    const cadastro={cpf:cpf.value.trim()?cpfFormatado(cpf.value.trim()):'',email:v('np-email').trim(),endereco:v('np-end').trim(),cidade:v('np-cid').trim(),hemisferio:v('np-hem'),contatoEmergencia:v('np-emerg').trim()};
    const alerts=Object.fromEntries(['gestante','anticoagulante','marcapasso'].map(k=>[k,document.getElementById('np-al-'+k).checked]));
    if(ui.editPid){ const p=patient(ui.editPid);
      p.name=v('np-name').trim(); p.birth=v('np-birth'); p.phone=v('np-phone'); p.queixas.find(q=>q.id==='q1').descricao=v('np-q').trim();
      Object.assign(p.alerts,alerts); p.cadastro={...p.cadastro,...cadastro,atualizadoEm:em};
      if(lgpd?.checked) p.consentimento=TODAY;
      save(); ui.pid=p.id; ui.editPid=null; ui.tab='resumo'; toast('Cadastro atualizado'); location.hash='prontuario'; return; }
    const p=hidratarPaciente(novoPaciente({id:uid(),name:v('np-name').trim(),birth:v('np-birth'),phone:v('np-phone'),queixa:v('np-q'),consentimento:TODAY,em}));
    Object.assign(p.alerts,alerts); p.cadastro=cadastro;
    db.patients.push(p); save(); ui.pid=p.id; ui.tab='anamnese'; toast('Paciente cadastrado'); location.hash='prontuario';
  } else if(f.id==='f-queixa'){
    const d=v('nq-desc').trim(); if(!d) return;
    adicionarQueixa(patient(ui.pid),{id:uid(),descricao:d},new Date().toISOString()); save(); render(true); toast('Queixa adicionada');
  } else if(f.id==='f-session'){
    const p=patient(ui.pid);
    registrarSessao(p,{id:uid(),date:v('ns-date'),eva:Number(v('ns-eva')),intensidades:Object.fromEntries([...f.querySelectorAll('input[data-q]')].map(x=>[x.dataset.q,Number(x.value)])),pontos:v('ns-pts').split(',').map(s=>s.trim().toUpperCase()).filter(Boolean),tec:[...document.querySelectorAll('input[name=tec]:checked')].map(x=>x.value),nota:v('ns-nota')},new Date().toISOString());
    save(); ui.tab='sessoes'; toast('Sessão registrada'); render();
  } else if(f.id==='f-appt'){
    db.appts.push({id:uid(),pid:v('na-p'),date:v('na-d'),time:v('na-t'),tipo:v('na-tipo'),valor:Number(v('na-v'))||0,done:false}); save(); ui.bookPid=null; toast('Agendamento criado'); render(true);
  }
});
render();
</script>
