<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musubi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Proposta visual clara (etapa 1B): tema claro sempre como padrão, fundo creme suave, cartões brancos,
   verde institucional #66864b como cor principal e tons complementares de verde e bege.
   #4f6b3a fica para texto e botões por contraste (6:1 sobre branco). O tema escuro só entra se for
   escolhido explicitamente (data-theme="dark"); ele não segue mais o modo escuro do aparelho. */
:root{
  --bg:#f6f3ec; --surface:#ffffff; --surface-2:#faf8f3; --ink:#1f2a1b; --muted:#6b7363; --line:#e9e4d8; --line-2:#ddd6c6;
  --brand:#66864b; --accent:#4f6b3a; --accent-ink:#ffffff; --accent-soft:#eef3e7; --accent-line:#cfdcbf;
  --beige:#efe7d6; --beige-ink:#7a6340; --sage:#dfe8d3;
  --shadow:0 1px 2px rgba(60,52,30,.04),0 2px 8px rgba(60,52,30,.04);
  --shadow-up:0 4px 18px rgba(60,52,30,.08);
  --ok:#2f7a4a; --warn:#a8601a; --crit:#b23a3a; --ok-soft:#e7f2ea; --warn-soft:#fbf1e3; --crit-soft:#fbeaea;
  --wood:#3f8a4e; --fire:#c4473b; --earth:#b88a1f; --metal:#7f8a91; --water:#2d4d73;
  --f-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px; --nav-w:264px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#141712; --surface:#1b1f18; --surface-2:#21261d; --ink:#e8ebe3; --muted:#a0a897; --line:#2e3529; --line-2:#3a4234;
  --brand:#8faa72; --accent:#a6c48b; --accent-ink:#141a10; --accent-soft:#263020; --accent-line:#3d4b31;
  --beige:#2d2a22; --beige-ink:#d6c29c; --sage:#27301f;
  --shadow:none; --shadow-up:none;
  --ok:#6cc48a; --warn:#e2a35c; --crit:#ec7d7d; --ok-soft:#1f3326; --warn-soft:#33281b; --crit-soft:#3a2222;
  --wood:#6dbb7b; --fire:#ea7a6c; --earth:#ddb752; --metal:#b5bfc5; --water:#78a0d0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.018em;color:var(--ink)}
h1{font-size:1.7rem;font-weight:650;letter-spacing:-.025em} h2{font-size:1.02rem} h3{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100%;transition:grid-template-columns .2s}
.app.mini{--nav-w:76px}

/* Menu lateral */
.nav{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 18px;min-height:46px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.12rem;font-weight:700;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:.72rem;line-height:1.3}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-sm);color:#3c4636;text-decoration:none;position:relative;font-weight:500;font-size:.9rem;line-height:1.3}
:root[data-theme="dark"] .nav a{color:var(--ink)}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a.on svg{color:var(--brand)}
.nav a.sub{padding-left:42px;font-size:.84rem;color:var(--muted);font-weight:500}
.nav a.sub::after{content:"";position:absolute;left:21px;top:0;bottom:0;width:1px;background:var(--line)}
.nav a.sub.on{color:var(--accent);background:transparent}
.nav a.sub.on::after{background:var(--brand);width:2px}
.nav a span{min-width:0;flex:1}
.nav a .soon{flex:none;width:6px;height:6px;border-radius:50%;background:var(--line-2);font-size:0}
.nav .grp{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9a9887;padding:18px 12px 6px}
.nav .grp:first-of-type{padding-top:4px}
.nav .foot{margin-top:auto;font-size:.76rem;color:var(--muted);padding:14px 4px 0;display:grid;gap:8px;border-top:1px solid var(--line)}
.nav .foot p{padding:0 8px;line-height:1.4}
.nav svg{width:18px;height:18px;flex:none;color:#7d8673}
.nav a:hover svg{color:var(--accent)}
.nav .toggle{display:flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:7px;cursor:pointer;color:var(--muted);font-size:.8rem;font-weight:500}
.nav .toggle:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.nav .toggle svg{width:16px;height:16px;color:currentColor}
.app.mini .brand div,.app.mini .nav a span,.app.mini .nav .soon,.app.mini .nav .foot p,.app.mini .nav .foot .btn,.app.mini .nav .toggle .tx{display:none}
.app.mini .nav .grp{font-size:0;padding:0;margin:10px 14px 6px;border-top:1px solid var(--line)}
.app.mini .nav a{justify-content:center;padding:10px}
.app.mini .nav a.sub{padding:8px}
.app.mini .nav a.sub::after{display:none}
.app.mini .nav a.sub svg{width:15px;height:15px}
.app.mini .brand{justify-content:center;padding-inline:0}
.app.mini .nav a:hover::after,.app.mini .nav a:focus-visible::after{content:attr(aria-label);position:fixed;left:80px;transform:translateY(-2px);background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:7px;font-size:.8rem;font-weight:500;z-index:30;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-up)}
.topbar{display:none}
.backdrop{display:none}

/* Área de trabalho */
main{min-width:0;max-width:1320px;padding-block:32px 56px;padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
.head p{color:var(--muted);margin-top:4px}
.head p::first-letter{text-transform:uppercase}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g-side{grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;min-width:0;box-shadow:var(--shadow)}
.card>h2,.card>h3{margin-bottom:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2 small,.card-h h3 small{display:block;font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:.78rem;color:var(--muted);font-weight:500}
.kpi b{display:block;font-family:var(--f-display);font-size:1.45rem;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi small{color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.85em}
.lbl{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap;font-weight:500;font-size:.88rem;box-shadow:0 1px 1px rgba(60,52,30,.03)}
.btn:hover{border-color:var(--accent-line);background:var(--surface-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{background:#45602f;border-color:#45602f}
.btn.sm{padding:5px 11px;font-size:.82rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);box-shadow:none}
.btn.ghost:hover{background:var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.crit{color:var(--crit);background:var(--crit-soft);border-color:transparent}
.pill.acc{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.pill.ex{font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--beige-ink);background:var(--beige);border-color:transparent}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 6px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row.click{cursor:pointer;border-radius:var(--r-sm)}
.row.click:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;width:50px;color:var(--muted);font-size:.86rem}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sage);color:var(--accent);font-weight:600;font-size:.78rem;flex:none}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:9px 11px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:72px;resize:vertical}
.form{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.form .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.84rem}
.chip:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.notice{display:flex;gap:10px;padding:11px 14px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--ink);border:1px solid transparent;font-size:.86rem}
.notice b{color:var(--warn)}
.notice.crit{background:var(--crit-soft)}
.notice.crit b{color:var(--crit)}
.bar{height:6px;background:var(--beige);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.hyp{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;background:var(--surface)}
.hyp.descartado{opacity:.5}
.hyp.aceito{border-color:var(--accent-line);background:var(--accent-soft)}
.hyp-h{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pts{display:grid;gap:4px}
.pts div{font-size:.86rem}
.pts .mono{color:var(--accent);font-weight:500}
.axis{display:grid;grid-template-columns:90px 1fr 90px;align-items:center;gap:10px;font-size:.82rem}
.axis .track{position:relative;height:8px;background:var(--beige);border-radius:4px}
.axis .track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.axis .dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--brand);transform:translate(-50%,-50%);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.axis span:last-child{text-align:right}
.penta{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
.penta .node{cursor:pointer}
.penta .node:hover circle.ring{stroke-width:5}
.penta text{font-family:var(--f-body)}
.penta .sheng{stroke:var(--brand);fill:none;stroke-width:2}
.penta .ke{stroke:var(--muted);fill:none;stroke-width:1.5;stroke-dasharray:5 4}
.penta .dim{opacity:.18}
.penta .hi{stroke-width:3.2;opacity:1}
.corr{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.88rem}
.corr dt{color:var(--muted)}
.corr dd{margin:0}
.el-tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem}
.el-tag i{width:9px;height:9px;border-radius:50%;display:inline-block}
.timeline{display:flex;flex-direction:column;gap:0}
.sess{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.eva{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:7px;align-content:start;box-shadow:var(--shadow)}
.pcard .code{font-family:var(--f-mono);font-weight:500;font-size:1.02rem;color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;min-width:940px}
.wscroll{overflow-x:auto;padding-bottom:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:210px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow)}
.day.today{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.day h3{font-family:var(--f-body);font-size:.8rem;font-weight:600;text-transform:capitalize;color:var(--muted)}
.day.today h3{color:var(--accent)}
.appt{border-left:3px solid var(--brand);background:var(--accent-soft);padding:7px 9px;border-radius:7px;font-size:.8rem;cursor:pointer}
.appt.done{border-left-color:var(--ok);background:var(--surface-2);opacity:.75}
.appt b{font-family:var(--f-mono);font-weight:500}
.spark{display:block}
.spark path.l{fill:none;stroke:var(--brand);stroke-width:2}
.spark path.a{fill:var(--accent-soft)}
.spark circle{fill:var(--brand)}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:var(--r-sm);font-size:.86rem;z-index:20;box-shadow:var(--shadow-up)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--brand);font-weight:600}
.sigs{display:grid;gap:16px}
@media (max-width:820px){
  .app,.app.mini{grid-template-columns:1fr;--nav-w:280px}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);border-bottom:1px solid var(--line);padding-block:9px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .topbar b{font-family:var(--f-display);font-size:1.05rem;font-weight:700;letter-spacing:-.02em}
  .topbar .menu-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;color:var(--ink)}
  .topbar .where{margin-left:auto;color:var(--muted);font-size:.85rem}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
  .nav{position:fixed;top:0;bottom:0;left:0;width:min(var(--nav-w),86vw);height:auto;z-index:25;transform:translateX(-105%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));box-shadow:0 0 40px rgba(40,34,20,.18)}
  .app.open .nav{transform:none}
  .app.open .backdrop{display:block;position:fixed;inset:0;background:rgba(30,28,20,.35);z-index:22}
  .nav .toggle{display:none}
  .app.mini .brand div,.app.mini .nav a span,.app.mini .nav .soon,.app.mini .nav .foot p,.app.mini .nav .foot .btn{display:revert}
  .app.mini .nav .grp{font-size:.7rem;padding:18px 12px 6px;margin:0;border:0}
  .app.mini .nav a{justify-content:flex-start;padding:9px 12px}.app.mini .nav a.sub{padding-left:42px}
  .app.mini .nav a.sub::after{display:block}
  .app.mini .brand{justify-content:flex-start;padding:2px 10px 18px}
  .app.mini .nav a:hover::after{display:none}
  .g-side{grid-template-columns:minmax(0,1fr)}
  main{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .card{padding:18px}
  h1{font-size:1.45rem}
  .sess{grid-template-columns:1fr;gap:4px}
}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.hyp,.nav a,.row.click{transition:background .15s,border-color .15s,opacity .15s,color .15s}}

/* Painel: rotina clínica em destaque, gestão discreta abaixo */
.zone{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:32px}
.zone>.lbl{display:flex;align-items:center;gap:10px}
.zone>.lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.next{border:1px solid var(--accent-line);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%);border-radius:var(--r);padding:18px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow)}
.next .grow{flex:1;min-width:0}
.next .hora{font-family:var(--f-display);font-size:1.6rem;font-weight:650;letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums}
.next .avatar{width:44px;height:44px;font-size:.9rem;background:var(--surface);border:1px solid var(--accent-line)}
.next .cap{font-size:.74rem;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.05em}
.clin-side{display:grid;gap:20px;align-content:start;min-width:0}
.todo .row .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.todo .row .ico svg{width:16px;height:16px}
.todo .ico.warn{background:var(--warn-soft);color:var(--warn)}
.todo .ico.crit{background:var(--crit-soft);color:var(--crit)}
.todo .ico.acc{background:var(--accent-soft);color:var(--accent)}
.alertas{border-color:#f0d6d6}
.alertas .card-h h2{display:block}
.alertas .card-h h2 svg{width:17px;height:17px;color:var(--crit);display:inline-block;vertical-align:-3px;margin-right:7px}
.vazio{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.88rem;padding:6px 0}
.vazio svg{width:18px;height:18px;color:var(--ok);flex:none}
.gestao .kpi{box-shadow:none;background:var(--surface-2);padding:14px 16px}
.gestao .kpi b{font-size:1.2rem}
.gestao .card{box-shadow:none}
.kpi em{display:block;font-style:normal;font-size:.76rem;color:var(--muted);margin-top:2px}
.meter{height:5px;border-radius:3px;background:var(--beige);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--brand)}
.agenda-dia .row .t{color:var(--ink);font-weight:500}
.agenda-dia .row.feito{opacity:.6}
/* Telas em breve */
.soon-hero{display:grid;gap:12px;max-width:68ch}
.soon-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.soon-list div{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:14px 16px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.proposta{font-size:.72rem;color:var(--beige-ink);background:var(--beige);border-radius:7px;padding:6px 9px;margin:0 4px;line-height:1.35}
.grow{flex:1;min-width:0}
.ic{width:18px;height:18px;flex:none}
.btn .ic{width:16px;height:16px}
.pill .ic{width:13px;height:13px}
.sm{font-size:.82rem}
small{font-size:.8rem}
.faixa{background:var(--beige);color:var(--beige-ink);font-size:.78rem;font-weight:500;text-align:center;padding:6px 12px}
.nav a .ic{color:#7d8673}.nav a.on .ic{color:var(--brand)}
.avatar.lg{width:42px;height:42px;font-size:.88rem}
.avatar.xl{width:64px;height:64px;font-size:1.25rem}
.migalha{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);margin-bottom:16px;flex-wrap:wrap}
.migalha a{color:var(--muted);text-decoration:none}.migalha a:hover{color:var(--accent)}
.migalha .ic{width:13px;height:13px}
.migalha span{color:var(--ink);font-weight:500}

/* Cartões de indicador */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.tile{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.tile b{display:block;font-size:.95rem}
.tile b.num{font-size:1.6rem;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.tile small{color:var(--muted);display:block;line-height:1.35}
.tile.t-crit{border-color:#f0d6d6}
.tico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.tico .ic{width:21px;height:21px}
.tico.acc{background:var(--accent-soft);color:var(--accent)}
.tico.warn{background:var(--warn-soft);color:var(--warn)}
.tico.crit{background:var(--crit-soft);color:var(--crit)}
.tico.xl{width:72px;height:72px;border-radius:20px}.tico.xl .ic{width:32px;height:32px}
.anel{flex:none}.anel text{font:600 12.5px var(--f-body);fill:var(--ink)}

/* Destaque do próximo atendimento */
.hero{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"t p a" "t g a";gap:6px 22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:18px;padding:20px 24px;margin-bottom:22px;box-shadow:var(--shadow)}
.hero-t{grid-area:t;display:grid;padding-right:22px;border-right:1px solid var(--accent-line)}
.hero .cap{font-size:.72rem;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.05em}
.hero .hora{font-size:2rem;font-weight:650;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
.pessoa{grid-area:p;display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0}
.pessoa b{display:block;font-size:1.08rem}.pessoa small{color:var(--muted)}
.hero-tags{grid-area:g;display:flex;gap:6px;flex-wrap:wrap;padding-left:54px}
.hero-a{grid-area:a;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* Agenda do dia em linha do tempo */
.tl{display:grid}
.tl-i{display:grid;grid-template-columns:48px 14px minmax(0,1fr) auto;align-items:center;gap:10px;position:relative;padding:6px 0}
.tl-i::before{content:"";position:absolute;left:54px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-i:first-child::before{top:50%}.tl-i:last-child::before{bottom:50%}
.tl-h{font-family:var(--f-mono);font-size:.86rem;font-weight:500}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);position:relative;z-index:1}
.tl-i.proximo .tl-dot{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 4px var(--accent-soft)}
.tl-i.feito .tl-dot{background:var(--ok);border-color:var(--ok)}
.tl-i.feito .tl-c{opacity:.6}
.tl-c{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:inherit;text-decoration:none;min-width:0}
.tl-c:hover{border-color:var(--accent-line);background:var(--surface-2)}
.tl-i.proximo .tl-c{border-color:var(--accent-line);background:var(--accent-soft)}
.tl-c .grow{display:grid;min-width:0}.tl-c small{color:var(--muted)}
.mini-ch .chart{width:90px;height:34px}
.mini-ch .gl,.mini-ch .ax{display:none}
.al-i,.pd-i{display:flex;align-items:center;gap:12px;padding:10px 6px;border-top:1px solid var(--line);color:inherit;text-decoration:none;border-radius:8px}
.al-i:first-of-type,.pd-i:first-of-type{border-top:0}
.al-i:hover,.pd-i:hover{background:var(--surface-2)}
.al-i .grow,.pd-i .grow{display:grid;gap:3px;min-width:0}
.pd-i small{color:var(--muted)}
.al-i>.ic,.pd-i>.ic{color:var(--muted);width:16px}
.pd-i .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.pd-i .ico.warn{background:var(--warn-soft);color:var(--warn)}.pd-i .ico.acc{background:var(--accent-soft);color:var(--accent)}
.alertas .card-h h2{display:flex;align-items:center;gap:8px}.alertas .card-h h2 .ic{color:var(--crit)}

/* Gestão recolhível */
.gestao-d{margin-top:26px;border-top:1px solid var(--line);padding-top:6px}
.gestao-d summary{display:flex;align-items:center;gap:14px;cursor:pointer;list-style:none;padding:12px 0;flex-wrap:wrap}
.gestao-d summary::-webkit-details-marker{display:none}
.gestao-d summary .ic{margin-left:auto;color:var(--muted);transition:transform .2s}
.gestao-d[open] summary .ic{transform:rotate(180deg)}
.chart{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax,.mapa .ax{font:500 11px var(--f-body);fill:var(--muted)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.leg i,.qsum i,.qc-h i,.qs-h i,.dotq{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.fin{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.fin small{color:var(--muted);display:block}.fin b{font-size:1.3rem;font-weight:650}

/* Pacientes */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;color:inherit;text-decoration:none;box-shadow:var(--shadow)}
.pc:hover{border-color:var(--accent-line);box-shadow:var(--shadow-up)}
.pc-h{display:flex;gap:12px;align-items:center}.pc-h .grow{display:grid;min-width:0}.pc-h small{color:var(--muted)}
.pc-q{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:.86rem;min-width:0}
.pc-q .chart{width:110px;flex:none}.pc-q .gl,.pc-q .ax{display:none}
.pc-f{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem}
.pc-f .muted{display:flex;align-items:center;gap:5px}.pc-f .ic{width:14px;height:14px}

/* Perfil */
.perfil-h{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.perfil-h .grow{min-width:220px}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);margin-top:4px;align-items:center}
.meta span{display:inline-flex;align-items:center;gap:5px}.meta .ic{width:14px;height:14px}
.perfil-a{display:flex;gap:8px;flex-wrap:wrap}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.qc{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;background:var(--surface-2)}
.qc .chart .ax{display:none}
.qc-v{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.big{font-size:1.8rem;font-weight:650;letter-spacing:-.03em;line-height:1}
.delta{font-size:.8rem;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface-2)}
.delta.bom{color:var(--ok);background:var(--ok-soft)}.delta.ruim{color:var(--crit);background:var(--crit-soft)}
.elbars{display:grid;gap:10px}
.elb{display:grid;grid-template-columns:24px 64px minmax(0,1fr) 84px;align-items:center;gap:8px;font-size:.84rem}
.elb .han{font-size:1.1rem;text-align:center}
.trk{position:relative;height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line)}
.trk .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;opacity:.85}
.trk .fill.def{opacity:.35;background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(255,255,255,.6) 4px 7px)}
.trk .base{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.45;border-radius:1px}
.elb .st{font-size:.76rem;color:var(--muted);text-align:right}
.elb .st.exc{color:var(--crit)}.elb .st.def{color:var(--warn)}
details.mais{margin-top:10px}
details.mais summary,.mais-card summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;color:var(--accent);font-weight:500;font-size:.86rem}
details.mais summary::-webkit-details-marker,.mais-card summary::-webkit-details-marker{display:none}
details[open]>summary>.ic:last-child{transform:rotate(180deg)}
.mais-card summary{color:var(--ink)}.mais-card summary h2,.mais-card summary h3{flex:1}
.hist{display:grid;gap:8px}
.hi{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.hi.on{border-color:var(--accent-line)}
.hi-h{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 12px;cursor:pointer;text-align:left}
.hi-h .grow{display:grid;min-width:0}.hi-h small{color:var(--muted)}
.hi-h>.ic{color:var(--muted)}.hi.on .hi-h>.ic{transform:rotate(180deg)}
.hi-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.82rem;flex:none}
.hi-b{padding:0 14px 14px 54px;display:grid;gap:8px;font-size:.88rem}
.qsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0 6px}
.qsum>div{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.86rem}
.qsum span{flex:1;min-width:0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp .lbl{text-align:center}
.sinais-cmp{display:grid;gap:14px;align-content:start}
.sinais-cmp p{margin-top:6px}

/* Atendimento integrado */
.at-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow)}
.at-h .grow{display:grid;min-width:180px}.at-h small{color:var(--muted)}
.salvo{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;color:var(--ok)}
.salvo .ic{width:14px;height:14px}
.steps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin:16px 0 22px;position:relative}
.steps a{display:grid;justify-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:.76rem;font-weight:500;text-align:center;padding:6px 2px;border-radius:10px;position:relative}
.steps a::after{content:"";position:absolute;top:21px;left:calc(50% + 20px);right:calc(-50% + 20px);height:2px;background:var(--line)}
.steps a:last-child::after{display:none}
.steps a.ok::after{background:var(--accent-line)}
.steps a:hover{background:var(--surface)}
.sn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line-2);font-weight:600;color:var(--muted);font-size:.84rem}
.sn .ic{width:15px;height:15px}
.steps a.ok .sn{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.steps a.on{color:var(--accent);font-weight:600}
.steps a.on .sn{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.sl{line-height:1.2}
.et-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.at-f{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.notice .ic{color:var(--warn);margin-top:1px}.notice.crit .ic{color:var(--crit)}
.qs{padding:12px 0;border-top:1px solid var(--line)}.qs:first-of-type{border-top:0}
.qs-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.qs-h .muted{margin-left:auto}
.qs-r{display:flex;align-items:center;gap:12px;margin-top:8px}
.qs-r input{flex:1;accent-color:var(--brand)}
.qs-v{font-size:1.4rem;font-weight:650;width:30px;text-align:right}
.anam{display:grid;gap:8px}
.anam details{border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.anam summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;font-weight:500;font-size:.9rem}
.anam summary::-webkit-details-marker{display:none}
.anam summary>.ic:first-child{color:var(--brand)}.anam summary>.ic:last-child{color:var(--muted)}
.anam textarea{display:block;width:calc(100% - 24px);margin:0 12px 12px;min-height:70px;border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;background:var(--surface);resize:vertical}
.hp{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px;margin-bottom:10px}
.hp.aceito{border-color:var(--accent-line);background:var(--accent-soft)}
.hp.descartado{opacity:.5}
.hp-h{display:flex;gap:12px;align-items:center}
.hp-a{display:flex;gap:6px}
.sazonal h3{display:flex;align-items:center;gap:8px}.sazonal h3 .ic{color:var(--earth)}
.corr-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.corr-g div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.corr-g small{display:block;color:var(--muted)}.corr-g b{font-size:.86rem;font-weight:500}
.rel{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:.84rem;color:var(--muted)}
.sx{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:12px}
.sx small{display:block;color:var(--muted);margin-bottom:6px}
.sx-p{display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.mapa{width:100%;max-width:440px;display:block;margin:0 auto}
.mapa .corpo *{fill:var(--beige);stroke:var(--line-2);stroke-width:1.2}
.mapa .pt{fill:var(--brand);stroke:#fff;stroke-width:2}
.mapa .ptl{font:600 11px var(--f-mono);fill:var(--accent)}
.seg h3{display:flex;align-items:center;gap:8px}.seg h3 .ic{color:var(--crit)}
.sug{padding:10px 0;border-top:1px solid var(--line)}.sug:first-of-type{border-top:0}
.sug-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.docc{display:grid;justify-items:start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;box-shadow:var(--shadow)}
.docc:hover{border-color:var(--accent-line)}
.docc>.ic{width:26px;height:26px;color:var(--brand)}.docc small{color:var(--muted)}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chk a{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--muted);font-size:.84rem}
.chk a.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.chk .ic{width:15px;height:15px}
.fora{display:grid;justify-items:center;text-align:center;gap:12px;padding:60px 16px;max-width:520px;margin:0 auto}
.vazio .ic{color:var(--ok)}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;grid-template-areas:"t" "p" "g" "a";padding:18px}
  .hero-t{border:0;padding:0;grid-auto-flow:column;justify-content:start;align-items:baseline;gap:10px}
  .hero-tags{padding-left:0}.hero-a{justify-content:stretch}.hero-a .btn{flex:1;justify-content:center}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{flex-direction:column;align-items:flex-start;gap:8px;padding:14px}
  .steps{display:flex;overflow-x:auto;gap:2px;margin-inline:-16px;padding:0 16px 6px;scrollbar-width:none}
  .steps a{flex:0 0 74px}
  .cmp{grid-template-columns:1fr}
  .tl-i{grid-template-columns:42px 12px minmax(0,1fr) auto;gap:8px}
  .tl-i::before{left:48px}
  .mini-ch,.tl-c .pill{display:none}
  .elb{grid-template-columns:22px 58px minmax(0,1fr) 76px}
  .at-f .btn{flex:1;justify-content:center}
  .hi-b{padding-left:14px}
}

/* Componentes das demais telas */
.nav .foot a{font-size:.84rem}
.busca{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:0 12px;min-width:240px;color:var(--muted)}
.busca input{border:0;outline:0;background:none;padding:9px 0;flex:1;min-width:0}
.busca:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-soft)}
.seg-c{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px}
.seg-c button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:.84rem;font-weight:500;color:var(--muted);cursor:pointer}
.seg-c button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(60,52,30,.08)}
.tr{display:inline-flex;align-items:center;gap:3px;font-size:.76rem;color:var(--muted);margin-top:2px}
.tr .ic{width:13px;height:13px}.tr.bom{color:var(--ok)}.tr.ruim{color:var(--crit)}
.tile small+b.num{margin-top:2px}
.rosca{flex:none}.rosca .r1{font:650 18px var(--f-body);fill:var(--ink)}.rosca .r2{font:500 9px var(--f-body);fill:var(--muted)}
.ag-res{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:10px}
.leg.col{flex-direction:column;gap:8px}

/* Agenda */
.ag-l{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}
.cal-w{padding:16px;overflow-x:auto}
.cal-g{display:grid;grid-template-columns:56px repeat(6,minmax(110px,1fr));min-width:720px}
.cal-d{text-align:center;padding:4px 0 12px;display:grid;gap:2px}
.cal-d small{color:var(--muted);text-transform:capitalize}.cal-d b{font-size:1.15rem;font-weight:600;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;margin:0 auto}
.cal-d.hoje b{background:var(--brand);color:#fff}
.cal-hs{display:grid;grid-auto-rows:var(--alt)}
.cal-hs span{font:500 .72rem var(--f-mono);color:var(--muted);transform:translateY(-7px)}
.cal-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--alt));min-height:calc(var(--alt)*11)}
.cal-col.hoje{background-color:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.ev{position:absolute;left:4px;right:4px;border-radius:8px;padding:6px 8px;text-decoration:none;display:grid;align-content:start;gap:1px;overflow:hidden;border-left:3px solid}
.ev b{font-size:.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev small{font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.ev.ag{background:var(--accent-soft);border-color:var(--brand);color:var(--accent)}
.ev.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.ev.nova{background:#f6eedd;border-color:#c9a96b;color:#7a6340}
.cal-col>.cal-agora{position:absolute;left:0;right:0;height:2px;background:var(--crit);z-index:1;pointer-events:none}
.cal-col>.cal-agora::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--crit)}

/* Cadastro */
.cad{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.fs-h{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.fs-h small{display:block}
.field select{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:9px 11px;width:100%}
.tgs{display:grid;gap:10px}
.tg{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg .sw{width:38px;height:22px;border-radius:999px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.tg .sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.tg input:checked+.sw{background:var(--brand)}.tg input:checked+.sw::after{transform:translateX(16px)}
.tg input:focus-visible+.sw{outline:2px solid var(--brand);outline-offset:2px}
.tg small{display:block;color:var(--muted)}
.lgpd{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.lgpd input{accent-color:var(--brand);margin-top:3px}
.cad-p{position:sticky;top:20px}
.cad-pv{display:grid;justify-items:center;text-align:center;gap:6px;padding:20px 0 6px}

/* Biblioteca */
.bib{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.bc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;align-content:start;box-shadow:var(--shadow)}
.bc-h{display:flex;align-items:center;gap:12px}
.bc-c{font:600 .9rem var(--f-mono);padding:8px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);min-width:52px;text-align:center}
.bc-h small{display:block}

/* Tabela */
.tab{display:grid}
.tr-h,.tr-r{display:grid;grid-template-columns:70px minmax(0,1.4fr) minmax(0,1.6fr) 100px 90px;gap:12px;align-items:center;padding:11px 6px}
.tr-h{font-size:.74rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.tr-r{border-bottom:1px solid var(--line);font-size:.88rem}.tr-r:last-child{border-bottom:0}
.tr-r:hover{background:var(--surface-2)}

/* Mapa de calor */
.heat{display:grid;grid-template-columns:40px repeat(6,1fr);gap:6px;align-items:center;margin-top:8px}
.heat small{color:var(--muted);font-size:.74rem;text-align:center}
.heat i{height:30px;border-radius:7px}

/* Guia */
.sw-g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.sw-g div{display:grid;gap:3px}.sw-g i{height:48px;border-radius:10px;border:1px solid var(--line)}
.sw-g b{font-size:.8rem;font-weight:600}.sw-g small{color:var(--muted)}
.ty{display:grid;gap:10px;margin-top:12px}
.ico-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px;margin-top:12px}
.ico-g span{height:40px;display:grid;place-items:center;border-radius:10px;background:var(--surface-2);color:var(--accent)}

@media (max-width:820px){
  .ag-l,.cad{grid-template-columns:1fr}
  .cad-p{position:static}
  .busca{min-width:0;flex:1}
  .tab{overflow-x:auto}.tr-h,.tr-r{min-width:560px}
  .sw-g{grid-template-columns:repeat(2,1fr)}
  .heat{grid-template-columns:32px repeat(6,1fr);gap:4px}
}
.field .lbl{text-transform:none;letter-spacing:0;font-size:.84rem;color:var(--ink);font-weight:500}
/* Telas médias (tablet, notebook pequeno): destaque do próximo atendimento em duas linhas */
@media (max-width:1100px) and (min-width:821px){
  .hero{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"t p" "t g" "a a"}
  .hero-a{justify-content:flex-start;padding-top:6px}
}
@media (max-width:1100px){ .g-side{grid-template-columns:minmax(0,1fr)} }
.tl-c{overflow:hidden}
.tiles{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.tile>div{min-width:0}
.tile b.num{font-size:1.45rem;white-space:nowrap}
@media (max-width:820px){ .tiles{grid-template-columns:1fr 1fr} .tile b.num{font-size:1.25rem} }

/* ===== Camada de refinamento (Musubi) ===== */
:root{--tb-h:60px;--ease:cubic-bezier(.2,.7,.2,1)}
kbd{font:500 .7rem var(--f-mono);background:var(--surface);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted);margin:0 1px}
.brand b,.tb-logo b{letter-spacing:.02em}
/* Barra superior em todas as larguras */
.topbar{display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:15;height:var(--tb-h);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:0 max(36px,env(safe-area-inset-right,0px)) 0 36px}
.topbar .menu-btn,.tb-logo,.so-cel{display:none}
.topbar .migalha{margin:0;flex:1;min-width:0;flex-wrap:nowrap;overflow:hidden}
.topbar .migalha a,.topbar .migalha span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.busca-g{display:flex;align-items:center;gap:10px;width:min(380px,34vw);border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 10px 8px 12px;color:var(--muted);cursor:pointer;font-size:.86rem;transition:border-color .15s,box-shadow .15s}
.busca-g:hover{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.busca-g span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-r{display:flex;align-items:center;gap:6px}
.ib{position:relative;width:38px;height:38px;display:grid;place-items:center;border:1px solid transparent;background:none;border-radius:10px;cursor:pointer;color:var(--muted);transition:background .15s,color .15s}
.ib:hover,.ib[aria-expanded="true"]{background:var(--surface);border-color:var(--line);color:var(--accent)}
.badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--crit);color:#fff;font:600 .66rem/17px var(--f-body);text-align:center;box-shadow:0 0 0 2px var(--bg)}
.dd{position:relative}
.dd-p{position:absolute;right:0;top:calc(100% + 8px);width:360px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(40,34,20,.12);padding:8px;z-index:30;animation:surge .16s var(--ease)}
.dd-h{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 8px}
.dd-f{padding:8px;border-top:1px solid var(--line);margin-top:4px}
.nt{display:flex;gap:12px;align-items:flex-start;padding:10px 8px;border-radius:10px;text-decoration:none;color:inherit;position:relative}
.nt:hover{background:var(--surface-2)}
.nt .grow{display:grid;gap:2px}.nt small{color:var(--muted);line-height:1.35}
.nt.nova::after{content:"";position:absolute;right:10px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.tico.sm{width:32px;height:32px;border-radius:9px}.tico.sm .ic{width:16px;height:16px}
.perfil-b{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;font-weight:500;font-size:.88rem}
.perfil-b:hover,.perfil-b[aria-expanded="true"]{background:var(--surface);border-color:var(--line)}
.perfil-b .avatar{width:32px;height:32px;font-size:.74rem;background:var(--brand);color:#fff}
.perfil-b .ic{width:15px;height:15px;color:var(--muted)}
.pf{width:260px}.pf-h{display:flex;gap:12px;align-items:center;padding:8px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.pf-h small{display:block}
.pf-i{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:9px;cursor:pointer;text-decoration:none;color:var(--ink);font-size:.88rem;text-align:left}
.pf-i:hover{background:var(--surface-2)}.pf-i .ic{color:var(--muted);width:17px}
.pf-i.sair{color:var(--crit);border-top:1px solid var(--line);border-radius:0 0 9px 9px;margin-top:4px}.pf-i.sair .ic{color:var(--crit)}
.nav a .nb{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--crit-soft);color:var(--crit);font-size:.7rem;font-weight:600;display:grid;place-items:center;padding:0 6px}
.app.mini .nav a .nb{display:none}
.nav .toggle kbd{margin-left:auto}
/* Busca global e janelas */
.veu{position:fixed;inset:0;background:rgba(31,42,27,.28);backdrop-filter:blur(2px);z-index:40;animation:aparece .15s}
.pal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(31,42,27,.22);z-index:41;overflow:hidden;animation:surge .18s var(--ease)}
.pal-c{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);color:var(--muted)}
.pal-c input{flex:1;border:0;outline:0;background:none;font-size:1rem;color:var(--ink)}
.pal-l{max-height:min(420px,55vh);overflow:auto;padding:8px}
.pal-g{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 10px 4px}
.pal-i{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;text-decoration:none;color:inherit}
.pal-i .grow{display:grid}.pal-i small{color:var(--muted)}
.pal-i.on,.pal-i:hover{background:var(--accent-soft)}
.pal-r{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--line);font-size:.76rem;color:var(--muted);background:var(--surface-2);flex-wrap:wrap}
.atl{padding:18px 20px}.atl-i{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem;gap:12px}
.tip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);font-size:.76rem;font-weight:500;padding:5px 9px;border-radius:7px;pointer-events:none;max-width:260px;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:aparece .12s}
.toast{display:flex;align-items:center;gap:10px;max-width:min(420px,calc(100vw - 32px));animation:sobe .22s var(--ease)}
.toast .ic{flex:none;color:#cfe0bd}
/* Estados vazios e carregamento */
.empty{display:grid;justify-items:center;text-align:center;gap:6px;padding:26px 16px}
.empty-i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--brand);margin-bottom:6px;box-shadow:0 0 0 8px color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.empty-i .ic{width:24px;height:24px}.empty b{font-size:.95rem}.empty p{color:var(--muted);font-size:.86rem;max-width:300px}
.empty .btn{margin-top:6px}
.sk{border-radius:12px;background:linear-gradient(90deg,var(--line) 0%,var(--surface-2) 50%,var(--line) 100%);background-size:200% 100%;animation:brilho 1.2s infinite linear}
.sk-g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0 20px}.sk-g2{display:grid;grid-template-columns:1.55fr 1fr;gap:20px}
/* Painel */
.acoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.acao{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:14px;text-decoration:none;color:inherit;cursor:pointer;text-align:left;font:inherit;transition:transform .15s var(--ease),box-shadow .15s,border-color .15s}
.acao:hover{transform:translateY(-1px);box-shadow:var(--shadow-up);border-color:var(--accent-line)}
.acao .tico{width:38px;height:38px;border-radius:11px}
.acao b{display:block;font-size:.9rem}.acao small{color:var(--muted);font-size:.78rem}
.acao.pri{background:var(--accent);border-color:var(--accent);color:#fff}.acao.pri small{color:#dfe8d3}.acao.pri .tico{background:rgba(255,255,255,.16);color:#fff}
.tile.lk{text-decoration:none;color:inherit;cursor:pointer;font:inherit;text-align:left;transition:transform .15s var(--ease),box-shadow .15s,border-color .15s}
.tile.lk:hover{transform:translateY(-1px);box-shadow:var(--shadow-up);border-color:var(--accent-line)}
.al-strip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--crit-soft);border:1px solid #f0d6d6;border-radius:14px;padding:10px 14px;margin-bottom:20px;scroll-margin-top:80px}
.al-t{display:flex;align-items:center;gap:8px;color:var(--crit);font-size:.88rem}
.al-c{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:10px;padding:6px 12px 6px 6px;text-decoration:none;color:inherit;border:1px solid #f0d6d6}
.al-c .avatar{width:30px;height:30px;font-size:.7rem}.al-c small{display:block;color:var(--crit);font-size:.76rem}
.al-c:hover{border-color:var(--crit)}
.dash-a{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:20px;margin-bottom:20px}
.dash-b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:20px}
.dash-c{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
#acomp{scroll-margin-top:80px}
.cm-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cm-g small{color:var(--muted);font-size:.7rem;font-weight:600;padding-bottom:4px}
.cm-d{position:relative;aspect-ratio:1;border:0;background:none;border-radius:10px;font:500 .84rem var(--f-body);cursor:pointer;color:var(--ink);display:grid;place-items:center;transition:background .15s}
.cm-d:hover{background:var(--surface-2)}.cm-d.pass{color:var(--muted)}
.cm-d.hoje{color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.cm-d.sel{background:var(--brand);color:#fff}
.cm-d i{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.cm-d i b{width:4px;height:4px;border-radius:50%;background:var(--brand)}.cm-d.sel i b{background:#fff}
.cm-l{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:grid;gap:6px}
.cm-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;background:var(--surface-2);text-decoration:none;color:inherit;font-size:.86rem}
.cm-i:hover{background:var(--accent-soft)}.cm-i .trunc{flex:1}.cm-i.feito{opacity:.6}.cm-i .ic{color:var(--ok);width:16px}
.fin-r .fin{margin:6px 0 10px}
.fin-m{display:grid;gap:8px;margin:14px 0 8px;font-size:.84rem;color:var(--muted)}
.fin-m span{display:flex;align-items:center;gap:8px}.fin-m b{margin-left:auto;color:var(--ink)}.fin-m .ic{width:16px}
.ac{border-top:1px solid var(--line)}.ac:first-of-type{border-top:0}
.ac summary{display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer;list-style:none}
.ac summary::-webkit-details-marker{display:none}
.ac summary .grow{display:grid;gap:5px}.ac summary>.ic{color:var(--muted);transition:transform .2s}
.ac[open] summary>.ic{transform:rotate(180deg)}
.ac-b{padding:0 4px 14px 48px;display:grid;gap:12px;animation:surge .18s var(--ease)}
.ac-s{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ac-s div{background:var(--surface-2);border-radius:10px;padding:8px 10px}.ac-s small{display:block;color:var(--muted)}.ac-s b{font-size:.86rem}
.atv{display:grid}
.atv-i{display:flex;align-items:center;gap:12px;padding:10px 4px;text-decoration:none;color:inherit;border-radius:10px;position:relative}
.atv-i:hover{background:var(--surface-2)}
.atv-i .grow{display:grid}.atv-i small{color:var(--muted)}
.atv-i:not(:last-child)::after{content:"";position:absolute;left:19px;top:44px;bottom:-8px;width:2px;background:var(--line)}
/* Gráficos interativos */
.pt-i,.br-i{cursor:pointer;transition:r .15s,opacity .15s}
.pt-i:hover{r:7}
.br-i:hover{opacity:.8}
.se{transition:opacity .2s}.se.oculta{opacity:0;pointer-events:none}
.leg-b{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--ink);cursor:pointer}
.leg-b[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
/* Ambiente de atendimento */
.at-top{position:sticky;top:var(--tb-h);z-index:10;margin:-8px -36px 18px;padding:12px 36px 0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.at-top .at-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.at-id{display:grid;min-width:160px}.at-id small{color:var(--muted)}
.at-al{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.at-m{display:flex;align-items:center;gap:12px;margin-left:auto}
.at-pr .anel{width:46px;height:46px}
.autosave{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);padding:5px 10px;border-radius:999px;background:var(--surface-2);transition:background .2s,color .2s}
.autosave .ic{width:14px;height:14px}
.autosave.on{color:var(--warn);background:var(--warn-soft)}.autosave.ok{color:var(--ok);background:var(--ok-soft)}
.gira{animation:gira .8s linear infinite}
.at-top .steps{margin:12px 0 0;padding-bottom:8px}
.steps a{transition:background .15s,color .15s}
.steps a::after{top:19px}
.steps a{position:relative}
.steps .sr{width:38px;height:38px;grid-area:1/1;justify-self:center}
.steps .sn{grid-area:1/1;justify-self:center;align-self:center;width:28px;height:28px;border:0;background:var(--surface);font-size:.8rem}
.steps a .sl{grid-area:2/1}
.sr-b{fill:none;stroke:var(--line-2);stroke-width:3}
.sr-f{fill:none;stroke:var(--brand);stroke-width:3;stroke-linecap:round;transition:stroke-dasharray .3s var(--ease)}
.steps a.ok .sn{background:var(--accent-soft);color:var(--accent)}
.steps a.on .sn{background:var(--accent);color:#fff;box-shadow:none}
.steps a.on .sr-b{stroke:var(--accent-line)}
.steps a.parcial .sn{color:var(--accent)}
.et-h .btn{margin-left:auto}
.cmp3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.cmp3>div{border-radius:12px;background:var(--surface-2);padding:12px;text-align:center}
.cmp3 b{display:block;font-size:1.5rem;font-weight:650}.cmp3 small{color:var(--muted)}
.cmp3 .ok{background:var(--ok-soft)}.cmp3 .ok b{color:var(--ok)}.cmp3 .warn{background:var(--warn-soft)}.cmp3 .warn b{color:var(--warn)}
/* Movimento */
#view.entra>*{animation:surge .32s var(--ease) both}
#view.entra>*:nth-child(2){animation-delay:.03s}#view.entra>*:nth-child(3){animation-delay:.06s}#view.entra>*:nth-child(4){animation-delay:.09s}#view.entra>*:nth-child(n+5){animation-delay:.12s}
.card,.tile,.pc,.bc{transition:box-shadow .2s,border-color .2s,transform .2s var(--ease)}
.pc:hover,.bc:hover{transform:translateY(-1px)}
@keyframes surge{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes brilho{to{background-position:-200% 0}}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:1180px){ .dash-b{grid-template-columns:1fr 1fr} .dash-b>.fin-r{grid-column:1/-1} }
@media (max-width:1100px){ .dash-a,.dash-c{grid-template-columns:minmax(0,1fr)} .busca-g kbd{display:none} }
@media (max-width:820px){
  :root{--tb-h:58px}
  .topbar{padding:0 12px;gap:8px}
  .topbar .menu-btn,.tb-logo{display:flex}.tb-logo{align-items:center;gap:8px;text-decoration:none;color:inherit}
  .so-cel{display:grid}
  .topbar .migalha,.busca-g,.pf-n,.perfil-b>.ic,[data-a="atalhos"].ib{display:none}
  .tb-r{margin-left:auto}
  .dash-b{grid-template-columns:minmax(0,1fr)}
  .acoes{grid-template-columns:1fr 1fr}
  .at-top{margin:-8px -16px 16px;padding:10px 16px 0}
  .at-m{margin-left:0;width:100%;justify-content:space-between}
  .ac-b{padding-left:4px}.ac-s{grid-template-columns:1fr 1fr}
  .sk-g{grid-template-columns:1fr 1fr}.sk-g2{grid-template-columns:1fr}
  .dd-p{position:fixed;left:12px;right:12px;top:calc(var(--tb-h) + 6px);width:auto}
}
/* correções da revisão: elementos com hidden não aparecem; selo do menu com largura do número */
.toast[hidden],.tip[hidden]{display:none!important}
.nav a .nb{flex:none;width:auto}
.steps a.on .sn,.steps a.on.parcial .sn{background:var(--accent);color:#fff}

/* ---------- Sistema (etapa 2A): ajustes das telas reais ---------- */
/* Itens clicáveis que são botões (abrem o prontuário) com a mesma aparência dos links da proposta. */
button.tl-c,button.al-c,button.cm-i,button.atv-i,button.pc,.cm-i{font:inherit;text-align:left;cursor:pointer;width:100%}
button.cm-i{border:0}
button.atv-i{border:0;background:none}
button.al-c{width:auto}
.tl-c .grow,.atv-i .grow,.pc-h .grow{text-align:left}
.migalha a[data-act]{cursor:pointer}
/* Abas do prontuário com ícone */
.tabs button{display:inline-flex;align-items:center;gap:7px}
.tabs button .ic{width:16px;height:16px}
.qc .chart .ax{display:block}
.card>.qc+.chart,.qc .chart{margin-top:8px}
.lgpd{display:flex;gap:8px;align-items:flex-start;font-size:.84rem;color:var(--muted)}
.lgpd input{margin-top:3px}
#plist .empty{grid-column:1/-1}
.ac-r{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line)}
.ac-r .grow{display:grid;min-width:0}
.notice{display:flex;gap:10px;align-items:flex-start}
.notice>.ic{margin-top:2px;flex:none}
/* Módulos planejados e Administração */
.soon-card{display:grid;gap:18px}
.soon-top{display:flex;gap:14px;align-items:center}.soon-top>div{display:grid;gap:2px}
.soon-list div{display:flex;gap:10px;align-items:center;border-style:solid;background:var(--surface-2)}
.soon-list .ic{color:var(--brand);width:16px;height:16px}
.adm{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.adm-c{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;color:inherit;text-decoration:none;box-shadow:var(--shadow)}
.adm-c:hover{border-color:var(--accent-line);box-shadow:var(--shadow-up)}
.adm-c .grow{display:grid;gap:4px}.adm-c small{color:var(--muted);line-height:1.4}
/* Rodapé do menu: restaurar exemplos com o mesmo formato do botão de recolher */
@media (max-width:820px){ .nav .toggle.reset{display:flex} }
/* Biblioteca: cartões de ponto sem vazamento de nomes longos e cautelas */
.pcards{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.pcard{min-width:0;overflow-wrap:anywhere}
.pcard>div:first-child{flex-wrap:wrap}
.pcard .pill{white-space:normal;line-height:1.35;max-width:100%}
/* Registro de sessão: técnicas como chips com caixa de seleção na linha e controle de intensidade na cor da marca */
label.chip{display:inline-flex;align-items:center;gap:6px}
label.chip input[type=checkbox]{width:auto;display:inline-block;margin:0;padding:0;accent-color:var(--brand)}
input[type=range]{accent-color:var(--brand)}
input[type=checkbox]{accent-color:var(--brand)}

/* Sistema (etapa 2C): cadastro, queixas e prontuário em linha do tempo */
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nq{display:flex;gap:8px;margin-top:14px}
.nq input{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:7px 11px}
.nq input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-soft)}
.qc.res{opacity:.72}
.qc-h{display:flex;align-items:center;gap:6px;min-width:0}
.qc-h b.grow{min-width:0;overflow-wrap:anywhere}
.qc-h .btn{flex:none}
.lt{display:grid;gap:0}
.lt-i{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.lt-i:first-child{border-top:0;padding-top:4px}
.lt-i>.grow{display:grid;gap:8px;min-width:0}
.lt-i.av .hi-n{background:var(--surface-2);color:var(--muted)}
.lt-i.av .hi-n .ic{width:16px;height:16px}
.lt-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sess{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;font-size:.9rem}
.sess p{overflow-wrap:anywhere}
.corr-g b{overflow-wrap:anywhere}
@media (max-width:820px){ .sess{grid-template-columns:1fr;gap:6px} .lt-i{gap:10px} .nq{flex-wrap:wrap} }

/* Sistema (etapa 2D): ambiente de atendimento */
.rasc{display:flex;align-items:center;gap:14px;border-color:var(--accent-line);background:var(--accent-soft)}
.rasc .grow{display:grid;min-width:0}
.lt-a{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lt-a .mais{flex:1;min-width:0}
.hist-alt{display:grid;gap:6px;font-size:.84rem;margin-top:8px}
.hist-alt>div{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px}
.vasos{display:grid;gap:8px}
.vaso{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;align-items:center}
.vaso .chip{justify-content:flex-start}
.vaso-n{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:7px 11px;min-width:0;width:100%}
.docc.off{opacity:.6;cursor:default}
@media (max-width:820px){ .vaso{grid-template-columns:1fr;gap:6px} .hist-alt>div{grid-template-columns:1fr;gap:0} }

/* Etapa 3A: avaliação em abas, achados com situação e origem, pulsologia bilateral (proposta aprovada) */
.ab-bar{display:flex;flex-wrap:wrap;gap:6px;padding:2px 2px 10px;margin-bottom:12px;max-width:100%}
.ab{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 7px;font-size:.84rem;font-weight:500;color:var(--muted);cursor:pointer;flex:0 0 auto}
.ab:hover{border-color:var(--accent-line);color:var(--ink)}
.ab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ab-n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font-size:.74rem;color:var(--muted)}
.ab.on .ab-n{background:color-mix(in srgb,#fff 22%,transparent);color:#fff}
.ab-c{font-size:.7rem;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px}
.ab.on .ab-c{background:#fff;color:var(--accent)}
.ab-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mini-sel{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:.8rem;max-width:100%;min-width:0}
.mini-sel:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-soft)}
.chip.achado{display:inline-flex;align-items:center;gap:5px}
.chip.achado .ic{width:13px;height:13px}
.chip.achado.s-pos{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.achado.s-neg{background:var(--surface-2);border-color:var(--line-2);color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.achados{display:grid;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.ach-r{display:flex;align-items:center;gap:8px;font-size:.86rem;flex-wrap:wrap}
.ach-r .grow{min-width:140px}
.pulso-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pulso-l{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2);min-width:0;display:grid;gap:8px;align-content:start}
.pulso-l h4{font-size:.95rem;margin:0}
.pulso-l .chips{gap:6px}
.pulso-l .chip{font-size:.8rem;padding:5px 10px}
.pulso-l .form{grid-template-columns:1fr}
.pulso-l .field input,.pulso-l .field textarea{background:var(--surface)}
.pos-d{margin-top:4px}
.pos-g{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:10px}
.pos-g .field{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:start;gap:8px}
.pos-g .lbl{padding-top:9px;font-weight:600}
.pos-g textarea{min-height:44px}
@media (max-width:820px){
  .ab-bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .pulso-g{grid-template-columns:minmax(0,1fr)}
  .ab-nav .btn{flex:1 1 auto;justify-content:center}
}

/* Etapa 3B: achados livres por categoria e encaminhamento para a Síntese e o Plano (só por escolha) */
.levar{display:flex;gap:6px;flex-wrap:wrap}
.levar .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;font-size:.78rem}
.levar .chip .ic{width:13px;height:13px}
.livres{display:grid;gap:8px;margin-bottom:14px}
.livre{display:flex;align-items:center;gap:12px;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.livre-t{display:grid;gap:6px;min-width:0;flex:1 1 220px}
.livre-t b{overflow-wrap:anywhere}
.livre-m{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.livre-f{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:14px;border-top:1px dashed var(--line)}
.livre-f .full{grid-column:1/-1}
.sx-i{display:flex;align-items:center;gap:10px;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
.card-h+.sx-i{border-top:0;padding-top:0}
.sx-i .grow{display:grid;gap:2px;min-width:0;flex:1 1 200px}
.sx-i b{overflow-wrap:anywhere}
@media (max-width:820px){ .livre-f{grid-template-columns:minmax(0,1fr)} }

/* Etapa 3C: vasos com pares, camadas do pentagrama, versões da avaliação e basal bloqueada */
.vt{display:grid;gap:8px}
.vt-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px);gap:8px 10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.vt-r.tem{border-color:var(--accent-line);background:var(--accent-soft)}
.vt-r>.vt-a,.vt-r>.levar,.vt-r>span.muted{grid-column:1/-1}
.vt-n{display:grid;gap:2px;min-width:0}
.vt-n small{color:var(--muted);font-size:.74rem}
.vt-a{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:.84rem;min-width:0;width:100%}
.vt-a:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-soft)}
.ly{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.ly .ic{width:12px;height:12px}
.ly-obs{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.ly-hip{background:var(--warn-soft);color:var(--warn);border-style:dashed;border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.ly-conf{background:var(--ok-soft);color:var(--ok)}
.pe{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:6px}
.card-h+.pe{border-top:0;padding-top:0}
.pe-h{display:flex;align-items:center;gap:8px}
.pe-l{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:.84rem}
.pe-l>span:last-child{padding-top:2px}
.vers{display:grid;gap:10px;margin-top:12px}
.ver{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.ver.basal{border-color:var(--accent-line);background:var(--accent-soft)}
.ver-h{display:flex;align-items:center;gap:10px}
.ver-h .grow{display:grid;gap:2px;min-width:0}
.ver-m{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.ver-m span{display:inline-flex;align-items:center;gap:5px}
.ver-m .ic{width:13px;height:13px}
.reav-f{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;border:1px dashed var(--accent-line);border-radius:12px;padding:12px;background:var(--surface)}
.trava-f{border:0;margin:0;padding:0;min-width:0}
.trava-f:disabled .card{opacity:.85}
@media (max-width:820px){ .vt-r{grid-template-columns:minmax(0,1fr)} .reav-f{grid-template-columns:minmax(0,1fr)} }
.dica-est{display:grid;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dica-est b{display:inline-flex;align-items:center;gap:6px}
.dicas .vt-n{grid-template-columns:auto 1fr;align-items:baseline;gap:8px}
.dica-v{margin-top:12px}

/* Etapa 4A: mapa corporal com seis vistas e marcações */
.mp-g{margin-top:14px}
.vbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.vb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.84rem;font-weight:500;color:var(--muted);cursor:pointer}
.vb:hover{border-color:var(--accent-line);color:var(--ink)}
.vb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vface{margin-bottom:10px}
.ferr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ferr .lbl{margin-right:4px}
.chip.fr{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;font-size:.82rem}
.chip.fr .ic{width:14px;height:14px}
.chip.fr.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip:disabled{opacity:.45;cursor:not-allowed}
.mp-dica{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.84rem;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 10px}
.mp-dica .ic{width:15px;height:15px;color:var(--accent);flex:none}
.mp-ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.zoom{display:inline-flex;align-items:center;gap:6px}
.zoom .btn{min-width:34px;justify-content:center;font-size:1rem;line-height:1}
.zoom .ic{width:14px;height:14px}
.zoom-v{font:500 .82rem var(--f-mono);min-width:42px;text-align:center}
.mp-cmp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mp-cmp .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-size:.8rem}
.mp-cmp .chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.mp-at{cursor:default}
.hist-l{display:inline-flex;align-items:center;gap:4px}
.mp-zoom{overflow:auto;max-height:74vh;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px;-webkit-overflow-scrolling:touch}
.mapa4{overflow:visible;display:block;margin:0 auto;height:auto;touch-action:manipulation;user-select:none}
.mapa4.marcando .corpo{cursor:crosshair}
.mapa4 .corpo *{fill:var(--beige);stroke:var(--line-2);stroke-width:1.2}
.mapa4 .corpo .b2{fill:color-mix(in srgb,var(--beige) 85%,var(--ink) 6%)}
.mapa4 .det{fill:none;stroke:var(--line-2);stroke-width:1;pointer-events:none}
.mapa4 .lado-t{font:700 11px var(--f-body);fill:var(--accent);pointer-events:none}
.mk{--c:var(--metal);cursor:pointer}
.mk>circle,.mk>path:not(.rad),.mk>rect,.mk .esp *{fill:var(--c);stroke:var(--surface);stroke-width:1.5}
.mk .rad{fill:none;stroke:var(--c);stroke-width:2.6;stroke-linecap:round}
.mk .seta{fill:var(--c);stroke:none}
.mk .esp *{fill-opacity:.25;stroke:var(--c);stroke-dasharray:2 2}
.mk .mk-sel{fill:none!important;stroke:var(--accent)!important;stroke-width:2!important;stroke-dasharray:3 2}
.mk-n{font:700 10px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none}
.mk.e-ant{opacity:.7}
.mk.e-ant .mk-n,.mk.e-hist .mk-n{fill:var(--muted)}
.mk.e-hist>circle,.mk.e-hist>path:not(.rad),.mk.e-hist>rect{fill:none;stroke:var(--metal);stroke-width:1.4;stroke-dasharray:2 2}
.mk.e-hist .rad{stroke-dasharray:3 3;stroke-width:1.6;opacity:.7}
.mk.e-hist .seta{opacity:.6}
.ptp{cursor:pointer}
.ptp circle{fill:var(--surface);stroke:var(--accent);stroke-width:1.8}
.ptp .pt-h{fill:transparent;stroke:none}
.ptp text{font:600 8.5px var(--f-mono);fill:var(--accent);paint-order:stroke;stroke:var(--surface);stroke-width:2.5px;pointer-events:none}
.ptp.plano circle:not(.pt-h){fill:var(--brand);stroke:var(--surface)}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);margin-top:10px;align-items:center}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.lg-sep{width:1px;height:14px;background:var(--line-2)}
.lg-i{width:16px;height:16px;flex:none;overflow:visible}
.ed-t{display:inline-flex;align-items:center;gap:8px}
.ed-t .lg-i{width:18px;height:18px}
.ed-meta{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.ed-meta .ic{width:13px;height:13px;flex:none}
.ed-f{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.ed-f .full{grid-column:1/-1}
.ed-f select,.ed-f input,.ed-f textarea{min-width:0;width:100%}
.ed-f textarea{min-height:64px}
.int-r{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.int-b{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 0;font:600 .8rem var(--f-body);color:var(--muted);cursor:pointer;min-width:0}
.int-b:hover{border-color:var(--accent-line);color:var(--ink)}
.int-b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rad-s{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.84rem}
.rad-s .ic{width:15px;height:15px;color:var(--accent)}
.ed-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ed-a .ic{width:14px;height:14px}
.rm-c{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--crit-soft);border-radius:10px;padding:8px 10px;font-size:.86rem;width:100%}
.btn.crit{background:var(--crit);border-color:var(--crit);color:#fff}
.ed-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:10px 0;font-size:.86rem}
.ed-dl dt{color:var(--muted);font-weight:500}
.ed-dl dd{margin:0;min-width:0}
.mk-l{display:grid;gap:6px}
.mk-li{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit}
.mk-li:hover{border-color:var(--accent-line)}
.mk-li.on{border-color:var(--accent);background:var(--accent-soft)}
.mk-li .grow{display:grid;gap:2px;min-width:0}
.mk-li b{font-size:.86rem;font-weight:600}
.mk-li small{font-size:.76rem;color:var(--muted)}
.pp{display:grid;gap:6px;margin-bottom:10px}
.pp-c{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-weight:600}
.pp-c small{font-family:var(--f-body);font-weight:400;color:var(--muted)}
.tbl-w{overflow-x:auto;max-width:100%;margin-bottom:6px}
.ev-t{width:100%;border-collapse:collapse;font-size:.82rem}
.ev-t th{font-weight:600;text-align:center;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.ev-t th small{display:block;font-weight:400;color:var(--muted);font-size:.7rem}
.ev-t th:first-child,.ev-t td:first-child{text-align:left}
.ev-t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
.ev-t td.at{background:var(--accent-soft)}
.ev-n{display:flex;align-items:center;gap:7px}
.ev-n>span{display:grid;line-height:1.25}
.ev-n small{color:var(--muted);font-size:.74rem}
.pr-mk{display:grid;gap:8px;margin-top:8px}
.pr-m{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:8px}
.pr-m:first-child{border-top:0;padding-top:0}
.pr-m .lg-i{margin-top:2px}
.pr-m .grow{display:grid;gap:2px;min-width:0}
.pr-m small{color:var(--muted);font-size:.78rem}
.pr-m p{margin:2px 0 0;font-size:.84rem}
@media (max-width:820px){
  .ed-f{grid-template-columns:minmax(0,1fr)}
  .int-r{grid-template-columns:repeat(6,minmax(0,1fr))}
  .mp-zoom{max-height:64vh;padding:6px}
}
/* Etapa 4A · ajustes: indicar pontos no mapa */
.ptp.disp circle:not(.pt-h){fill:var(--surface);stroke:var(--line-2,#b8bfb0);stroke-width:1.4}




.mp-seg{margin-top:12px;display:grid;gap:8px}
.mp-seg .lbl{display:flex;align-items:center;gap:6px}
.mp-seg .notice{margin:0}
.ptp.disp text{display:none}
.mp-dica>span{flex:1 1 200px;min-width:0}
.mapa4.ampliado .ptp.disp text{display:inline;fill:var(--muted);font-weight:500}
.ptp.pt-on circle:not(.pt-h){stroke:var(--ink);stroke-width:2.4}
.ptp.pt-on .pt-h{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.mapa4 .ptp.disp.pt-on text{display:inline;fill:var(--ink);font-weight:600}
.fp-dl dd{white-space:normal}
#ficha-pt .ed-a{display:flex;align-items:center;gap:8px;margin:12px 0 6px}
#ficha-pt .notice{margin-top:8px}
/* Pontos próximos da marcação */
.px{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:10px}
.px-i{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--surface)}
.px-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.px-a{margin:0;font-size:.86rem}
.px-b{display:flex;flex-wrap:wrap;gap:6px}
.px-i .pill{justify-self:start}
.px-n{margin:0}
.mapa4 .ptp.prox text{display:inline;fill:var(--ink);font-weight:600}
#ed-mk .px{margin:12px 0 14px;padding:12px 0 14px;border-bottom:1px solid var(--line)}
/* Pontos indicados pelo livro para a região da marcação */
#ed-mk .px.ind + .px{margin-top:0;padding-top:0;border-top:0}
.ind-g{display:grid;gap:8px}
.ind-l{display:flex;flex-wrap:wrap;gap:6px}
.ind-b{display:inline-flex;align-items:baseline;gap:5px;min-height:34px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.84rem;cursor:pointer}
.ind-b small{color:var(--muted);font-size:.72rem}
.ind-b:hover{border-color:var(--brand)}
.ind-b.pend{border-style:dashed}
.ind-b.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ind-b.on small{color:rgba(255,255,255,.85)}
.ind-r{display:flex;flex-wrap:wrap;gap:4px}
.ind-f{display:block;margin-top:6px}
.ptp.ind circle:not(.pt-h){stroke:var(--brand);stroke-width:2}
/* ---------- Etapa 4B · Biblioteca clínica: Central, Particular e Atlas ---------- */
:root{--vaso:#7b5ea7}
:root[data-theme="dark"]{--vaso:#b49ae0}
.bib-t{margin-bottom:16px}
.bib-t button{display:inline-flex;align-items:center;gap:6px}
.bib-t .ic{width:16px;height:16px}
