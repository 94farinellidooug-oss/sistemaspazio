// do que já é registrado (agenda, financeiro e atendimentos); nada é gravado e nada muda na exportação v1.
//
// Atendimento do mês = horário atendido na agenda, mais o atendimento finalizado no prontuário em um dia
// sem horário atendido daquele paciente (para contar também o que foi registrado sem agenda).
// As dicas são de gestão, nunca clínicas.

const MESES_REL = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesRel = d => d.slice(0, 7);
const somarMes = (m, n) => { const [a, b] = m.split('-').map(Number), t = a * 12 + (b - 1) + n; return `${Math.floor(t / 12)}-${String(t % 12 + 1).padStart(2, '0')}`; };
const faixa = (fim, n) => Array.from({ length: n }, (_, i) => somarMes(fim, i - n + 1));
const nomeMesRel = m => MESES_REL[Number(m.slice(5, 7)) - 1];

// [chave, rótulo]
const PERIODOS_REL = [['mes', 'Este mês'], ['passado', 'Mês passado'], ['tri', 'Últimos 3 meses'], ['ano', 'Este ano']];
// Meses do período, meses do período anterior (para comparar) e como chamar cada um.
function periodoRel(k, hoje){
  const m = mesRel(hoje), r = PERIODOS_REL.find(p => p[0] === k) || PERIODOS_REL[1];
  if (r[0] === 'mes') return { k: 'mes', rotulo: r[1], meses: [m], ant: [somarMes(m, -1)], em: `em ${nomeMesRel(m)} (até hoje)`, antA: `a ${nomeMesRel(somarMes(m, -1))}`, antEm: `em ${nomeMesRel(somarMes(m, -1))}` };
  if (r[0] === 'tri') return { k: 'tri', rotulo: r[1], meses: faixa(m, 3), ant: faixa(somarMes(m, -3), 3), em: 'nos últimos 3 meses', antA: 'aos 3 meses antes', antEm: 'nos 3 meses antes' };
  if (r[0] === 'ano') return { k: 'ano', rotulo: r[1], meses: faixa(m, Number(m.slice(5, 7))), ant: [], em: `em ${m.slice(0, 4)}`, antA: '', antEm: '' };
  const p = somarMes(m, -1);
  return { k: 'passado', rotulo: r[1], meses: [p], ant: [somarMes(p, -1)], em: `em ${nomeMesRel(p)}`, antA: `a ${nomeMesRel(somarMes(p, -1))}`, antEm: `em ${nomeMesRel(somarMes(p, -1))}` };
}

// Atendimentos até hoje: [{pid, date, tipo|null, valor}]
function atendidosRel(db, hoje){
  const L = db.appts.filter(a => a.done && ativo(a) && a.date <= hoje).map(a => ({ pid: a.pid, date: a.date, tipo: a.tipo, valor: a.valor || 0 }));
  const tem = new Set(L.map(a => a.pid + a.date));
  db.patients.forEach(p => p.sessions.forEach(s => { if (s.date <= hoje && !tem.has(p.id + s.date)) { L.push({ pid: p.id, date: s.date, tipo: null, valor: 0 }); tem.add(p.id + s.date); } }));
  return L;
}
const faltasRel = (db, hoje) => db.appts.filter(a => a.st === 'faltou' && a.date <= hoje);
const recebidoRel = (db, M) => { const F = db.financeiro; if (!F) return 0;
  return F.recebimentos.filter(r => M.includes(mesRel(r.data))).reduce((n, r) => n + r.valor, 0) + F.pacotes.filter(k => M.includes(mesRel(k.em))).reduce((n, k) => n + k.valor, 0); };
// Primeiro atendimento de cada paciente.
const primeiros = L => L.reduce((o, a) => { if (!o[a.pid] || a.date < o[a.pid]) o[a.pid] = a.date; return o; }, {});

// Números de um conjunto de meses.
function numerosRel(db, hoje, M, L, F, P1){
  const at = L.filter(a => M.includes(mesRel(a.date))).length, falt = F.filter(a => M.includes(mesRel(a.date))).length;
  return { at, falt, pf: at + falt ? Math.round(falt / (at + falt) * 100) : 0, rec: Math.round(recebidoRel(db, M) * 100) / 100, novos: Object.values(P1).filter(d => M.includes(mesRel(d))).length };
}

function relatorio(db, hoje, k){
  const P = periodoRel(k, hoje), L = atendidosRel(db, hoje), F = faltasRel(db, hoje), P1 = primeiros(L), dentro = a => P.meses.includes(mesRel(a.date));
  const num = numerosRel(db, hoje, P.meses, L, F, P1), ant = P.ant.length ? numerosRel(db, hoje, P.ant, L, F, P1) : null;
  // Atendimentos por mês: o ano até agora, ou os últimos 6 meses.
  const meses = (P.k === 'ano' ? P.meses : faixa(mesRel(hoje), 6)).map(m => ({ m, at: L.filter(a => mesRel(a.date) === m).length, falt: F.filter(a => mesRel(a.date) === m).length, rec: recebidoRel(db, [m]), on: P.meses.includes(m) }));
  const porServ = {}; L.filter(dentro).forEach(a => { const s = a.tipo || 'Registrado sem agenda'; (porServ[s] ||= { s, q: 0, v: 0 }).q++; porServ[s].v += a.valor; });
  const servicos = Object.values(porServ).sort((a, b) => b.q - a.q || a.s.localeCompare(b.s));
  const formas = {}; (db.financeiro?.recebimentos || []).filter(r => P.meses.includes(mesRel(r.data))).forEach(r => { formas[r.forma] = (formas[r.forma] || 0) + r.valor; });
  const pac = (db.financeiro?.pacotes || []).filter(k => P.meses.includes(mesRel(k.em))).reduce((n, k) => n + k.valor, 0);
  const porForma = Object.entries(formas).map(([f, v]) => ({ f, v })).sort((a, b) => b.v - a.v).concat(pac ? [{ f: 'Pacotes', v: pac }] : []);
  // Evolução: pacientes atendidos no período com a queixa principal registrada em pelo menos 2 atendimentos.
  const ev = { melhorou: 0, igual: 0, piorou: 0, total: 0 };
  db.patients.forEach(p => { const S = p.sessions.filter(s => s.date <= hoje && s.eva != null);
    if (S.length < 2 || !S.some(s => P.meses.includes(mesRel(s.date)))) return;
    const d = S.at(-1).eva - S[0].eva; ev.total++; ev[d < 0 ? 'melhorou' : d > 0 ? 'piorou' : 'igual']++; });
  return { P, num, ant, meses, servicos, porForma, ev, dicas: dicasRel(db, hoje, num, ant, P) };
}

// Dicas de gestão do que dá para fazer agora; só entram as que têm o que fazer.
function dicasRel(db, hoje, num, ant, P){
  const D = [], nome = id => db.patients.find(p => p.id === id)?.name || '';
  const ret = paraRetomar(db, hoje).filter(x => !x.oculto).length;
  if (ret) D.push({ k: 'retomar', ic: 'tel', t: `${ret} paciente${ret > 1 ? 's' : ''} sem vir há mais de 21 dias`, d: 'Sem nada agendado. Um contato pelo WhatsApp costuma trazer de volta.', b: 'Ver em Relacionamento', ir: 'crm' });
  const cob = coberturaPacotes(db), pend = aReceber(db, hoje), v = pend.reduce((n, a) => n + faltaDe(db, a, cob), 0);
  if (v > 0) D.push({ k: 'receber', ic: 'dinheiro', t: `${v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })} em atendimentos ainda não pagos`, d: `${pend.length} atendimento${pend.length > 1 ? 's' : ''} feito${pend.length > 1 ? 's' : ''} esperando o recebimento.`, b: 'Abrir Financeiro', ir: 'financeiro' });
  if (ant && num.falt > ant.falt) D.push({ k: 'faltas', ic: 'alerta', t: `As faltas subiram: ${num.falt} ${P.em}`, d: 'Mandar o lembrete do dia seguinte pelo WhatsApp ajuda a reduzir as faltas.', b: 'Ver lembretes de amanhã', ir: 'agenda' });
  const fim = (db.financeiro?.pacotes || []).map(k => ({ k, r: k.total - usosPacote(db, k, cob) })).filter(x => x.r >= 1 && x.r <= 2);
  if (fim.length) D.push({ k: 'pacotes', ic: 'camadas', t: `${fim.length} pacote${fim.length > 1 ? 's' : ''} perto do fim`, d: `${fim.slice(0, 3).map(x => `${nome(x.k.pid)} (falta${x.r > 1 ? 'm' : ''} ${x.r})`).join(', ')}. Bom momento para oferecer a renovação.`, b: 'Ver pacotes', ir: 'financeiro' });
  // Horários livres de uma hora nos próximos 7 dias, de segunda a sexta (o horário da clínica entra na etapa 10).
  let liv = 0; for (let i = 0; i < 7; i++) { const d = addDays(i, hoje), w = new Date(d + 'T12:00').getDay(); if (w > 0 && w < 6) liv += horariosLivres(db.appts, d, 'Acupuntura').length; }
  if (liv) D.push({ k: 'livres', ic: 'cal', t: `${liv} horários livres nos próximos 7 dias`, d: 'De segunda a sexta. Dá para oferecer a quem está para retomar ou a quem procurou e ainda não é paciente.', b: 'Abrir Agenda', ir: 'agenda' });
  return D;
}
// recebido por forma, evolução das queixas e, no final, o que dá para fazer agora. Imprimir ou salvar em PDF.

const n0 = v => v.toLocaleString('pt-BR');
function comparaRel(v, ant, P, inverso){
  if (ant == null) return '<small class="muted">sem período anterior para comparar</small>';
  if (!ant) return v ? `<small class="muted">nada ${P.antEm} para comparar</small>` : `<small class="muted">igual ${P.antA}</small>`;
  const d = Math.round((v - ant) / ant * 100), bom = inverso ? d <= 0 : d >= 0;
  return d === 0 ? `<small class="muted">igual ${P.antA}</small>` : `<small class="cmp ${bom ? 'bom' : 'ruim'}">${ic(d > 0 ? 'sobe' : 'desce')}${Math.abs(d)}% em relação ${P.antA}</small>`;
}
const barraRel = (nome, v, max, txt, tip) => `<div class="rel-b" data-tip="${esc(tip)}"><span class="rel-n">${esc(nome)}</span><span class="rel-t"><span style="width:${max ? Math.max(2, Math.round(v / max * 100)) : 0}%"></span></span><b class="rel-v">${txt}</b></div>`;

      <div class="rel-c" role="img" aria-label="Atendimentos por mês">${R.meses.map(m => `<div class="rel-col ${m.on ? 'on' : ''}" data-tip="${mesTxt(m)}: ${m.at} atendimento${m.at === 1 ? '' : 's'}, ${m.falt} falta${m.falt === 1 ? '' : 's'}"><div class="rel-cb"><b>${m.at}</b><span style="height:calc((100% - 20px) * ${(m.at / mx).toFixed(3)})"></span></div><small>${nomeMesRel(m.m).slice(0, 3)}</small></div>`).join('')}</div>

function pentagram(state, sel, o={}){

    const cls = sel ? (rel(e,SHENG[e])?'hi':'dim') : '';

  });

    const [x1,y1]=pos(e),[x2,y2]=pos(KE[e]), L=Math.hypot(x2-x1,y2-y1), ux=(x2-x1)/L, uy=(y2-y1)/L, k=r+8;

      <text x="${x}" y="${y-2}" text-anchor="middle" style="fill:${E.cor};font-size:28px;font-weight:600">${E.han}</text>
      <text x="${x}" y="${y+20}" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:600">${E.nome}</text>
      ${(()=>{ const c=Math.cos(rad(E.ang)); let lx=x, ly=y+r+17, an='middle';
        if(e==='fogo') ly=y-r-26; else if(c<-.5){lx=x-r-10;ly=y+4;an='end'} else if(c>.5&&e==='terra'){lx=x+r+10;ly=y+4;an='start'}
        return `<text x="${lx}" y="${ly}" text-anchor="${an}" style="fill:var(--muted);font-size:11.5px">${E.zang.split(' · ')[0]} · ${E.emocao.split(' ')[0]}</text>`+

    </g>`;

function evaluate(signs){
  const s = new Set(signs);
  return PATTERNS.map(p=>{
    const m = p.sinais.filter(x=>s.has(x));
    return {p, m, falta:p.sinais.filter(x=>!s.has(x)), score:m.length/p.sinais.length};
  }).filter(h=>h.m.length>=2).sort((a,b)=>b.score-a.score);
}
function elemState(signs, status){
  const st = {}; ORDER.forEach(e=>st[e]={def:0,exc:0});
  evaluate(signs).forEach(h=>{ if((status||{})[h.p.id]==='descartado') return; st[h.p.el][h.p.tipo] += h.score * ((status||{})[h.p.id]==='aceito'?1:.6); });
  return st;
}
function bagang(signs){
  const s=new Set(signs), c=k=>BAGANG[k].filter(x=>s.has(x)).length;
  const t=(a,b)=>{const A=c(a),B=c(b);return A+B?(B-A)/(A+B):0};
  return {fc:t('frio','calor'), de:t('def','exc'), n:signs.length};
}

// Linhas de 0 a 10 (intensidade da queixa). series: [{vals, cor, nome}], vals pode ter null; o.mini desenha sem eixos.
function linhas(series, labels, o={}){
  const W=o.w||640, H=o.h||220, [L,R,T,B]=o.mini?[6,8,6,6]:[28,14,12,26], n=Math.max(2,...series.map(s=>s.vals.length));
  const x=i=>L+i*(W-L-R)/(n-1), y=v=>T+(1-v/10)*(H-T-B);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Gráfico de evolução')}">`;
  if(!o.mini) [0,5,10].forEach(v=>s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
  labels.forEach((l,i)=>s+=`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`);
  series.forEach((se,k)=>{ if(!se.vals.some(v=>v!=null)) return;
    // Valores ausentes (null) ficam sem ponto e interrompem a linha (queixa não medida naquele atendimento).
    const ult=se.vals.reduce((u,v,i)=>v!=null?i:u,-1);
    const d=se.vals.map((v,i)=>v==null?'':`${i&&se.vals[i-1]!=null?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    s+=`<g class="se" data-s="${k}"><path d="${d}" fill="none" stroke="${se.cor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    s+=se.vals.map((v,i)=>{ if(v==null) return ''; const tip=o.mini?'':(o.tips?.[i]||`${se.nome?se.nome+' · ':''}${labels[i]||''}: ${String(v).replace('.',',')}`);
      return `<circle class="${tip?'pt-i':''}" cx="${x(i)}" cy="${y(v)}" r="${i===ult?5:3.5}" fill="${i===ult?se.cor:'var(--surface)'}" stroke="${se.cor}" stroke-width="2" ${tip?`data-tip="${esc(tip)}"`:''}/>`; }).join('')+'</g>';
  });
  return s+'</svg>';
}
// Barras verticais; a última fica destacada (período atual).
function barrasV(vals, labels, o={}){
  const W=o.w||560, H=o.h||190, B=24, T=18, max=Math.max(1,...vals), bw=W/vals.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'')}">`;
  [0,.5,1].forEach(f=>s+=`<line class="gl" x1="0" x2="${W}" y1="${H-B-f*(H-B-T)}" y2="${H-B-f*(H-B-T)}"/>`);
  vals.forEach((v,i)=>{ const h=v/max*(H-B-T), x=i*bw+bw*.22, w=bw*.56, ult=i===vals.length-1;
    s+=`<rect class="br-i" x="${x}" y="${H-B-h}" width="${w}" height="${Math.max(h,2)}" rx="6" fill="${ult?'var(--brand)':'var(--sage)'}" data-tip="${esc(o.tips?o.tips[i]:`${labels[i]}: ${v}`)}"/><text class="ax" x="${x+w/2}" y="${H-B-h-6}" text-anchor="middle">${v}</text><text class="ax" x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`; });
  return s+'</svg>';
}

// Barras dos cinco elementos a partir do estado calculado pela avaliação (elemState), sem recalcular nada.
// base: estado da avaliação basal, mostrado como marca vertical.
const ORDEM_EL = ['madeira','fogo','terra','metal','agua'];
const tipoEl = s => s.exc>s.def&&s.exc>0?'exc':s.def>0?'def':'';
function barrasEl(st, base){
  const pct = s => Math.min(100,Math.round(Math.max(s.def,s.exc)/1.6*100));
  return `<div class="elbars">${ORDEM_EL.map(e=>{ const s=st[e], k=tipoEl(s), E=EL[e], b=base?pct(base[e]):null;
    return `<div class="elb"><span class="han" style="color:${E.cor}">${E.han}</span><span class="nm">${E.nome}</span>
      <div class="trk">${b!==null?`<i class="base" style="left:${b}%" title="Basal"></i>`:''}<i class="fill ${k}" style="width:${Math.max(k?6:0,pct(s))}%;background:${E.cor}"></i></div>
      <span class="st ${k}">${k==='exc'?'Excesso':k==='def'?'Deficiência':'Equilíbrio'}</span></div>`;}).join('')}</div>`;
}
// Variação entre dois valores de intensidade (queda é melhora).
const delta = (a,b) => { if(a==null||b==null) return ''; const d=b-a; return `<span class="delta ${d<0?'bom':d>0?'ruim':''}">${d<0?'▼':d>0?'▲':'='} ${Math.abs(d)}</span>`; };

const semAcentoReg = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function regioesDoTexto(t){
  const pal = new Set(semAcentoReg(t).split(/[^a-z]+/).filter(Boolean));

/* ---------- Posições aproximadas dos pontos (os 28 que já têm ficha) ----------
   Unidades do desenho de cada vista. Pontos bilaterais são espelhados; VC e VG ficam na linha média. */
const POS = {

const meio = c => /^V[CG]\d/.test(c);
function posicoes(c, v, f){
  if (v === 'anterior' || v === 'posterior') { const p = POS[v][c]; return !p ? [] : meio(c) ? [p] : [p, [200 - p[0], p[1]]]; }
  if (v === 'lat_d' || v === 'lat_e') { const p = POS.lat[c]; return p ? [[v === 'lat_e' ? 200 - p[0] : p[0], p[1]]] : []; }
  const p = POS[v + ':' + f]?.[c]; return p ? [p, [280 - p[0], p[1]]] : [];
}
const NOME_POS = { anterior:'Anterior', posterior:'Posterior', lat:'Laterais', 'maos:palmar':'Mãos (palmar)', 'maos:dorsal':'Mãos (dorsal)', 'pes:dorsal':'Pés (dorsal)', 'pes:plantar':'Pés (plantar)' };
const vistasDoPonto = c => Object.keys(POS).filter(k => POS[k][c]).map(k => NOME_POS[k]);
const temPosicao = c => vistasDoPonto(c).length > 0;
const PONTOS_NO_MAPA = [...new Set(Object.values(POS).flatMap(o => Object.keys(o)))];
// Pontos com posição perto de uma marcação, na mesma vista. Só distância no desenho: não é indicação clínica.
const RAIO_PROXIMO = v => FACES[v] ? 45 : 35;
function pontosProximos(m){
  const [w, h] = TAM[m.vista], R = RAIO_PROXIMO(m.vista), alvos = [[m.x * w, m.y * h], ...(m.x2 != null ? [[m.x2 * w, m.y2 * h]] : [])];
  return PONTOS_NO_MAPA.map(c => [c, Math.min(Infinity, ...posicoes(c, m.vista, m.face || '').flatMap(([x, y]) => alvos.map(([a, b]) => Math.hypot(x - a, y - b))))])
    .filter(([, d]) => d <= R).sort((a, b) => a[1] - b[1]).map(([c]) => c);
}

// Região sugerida pelo local tocado (faixas aproximadas do desenho). Só preenche o campo "Região",
// que continua editável. x e y em unidades do desenho da vista.
function regiaoDoToque(v, f, x, y, braco){
  if (v === 'maos') return 'Punho e mão';
  if (v === 'pes') return 'Tornozelo e pé';
  const lat = v === 'lat_d' || v === 'lat_e', fx = v === 'lat_e' ? 200 - x : x, dx = Math.abs(x - 100), post = v === 'posterior';
  if (lat) {
    if (y < 56) return fx >= 106 ? 'Face e dentes' : 'Cabeça';
    if (y < 70) return 'Pescoço e nuca';
    if (y < 96) return 'Ombro';
    if (braco && y < 230) return y < 210 ? 'Braço e cotovelo' : 'Punho e mão';
  } else {
    if (y < (post ? 50 : 22)) return 'Cabeça';
    if (!post && y < 52) return 'Face e dentes';
    if (y >= 63 && y < 98 && dx >= 18) return 'Ombro';
    if (y < 70) return 'Pescoço e nuca';
    if (y >= 98 && y < 266 && dx >= (y < 190 ? 41 : 51)) return y < 214 ? 'Braço e cotovelo' : 'Punho e mão';
  }
  const costas = post || (lat && fx < 100);
  if (y < 150) return costas ? 'Costas' : 'Tórax';
  if (y < 215) return costas ? 'Lombar e sacro' : 'Abdome';
  if (y < 250) return 'Quadril e nádega';
  if (y < 300) return 'Coxa';
  if (y < 330) return 'Joelho';
  if (y < 392) return 'Perna';
  return 'Tornozelo e pé';
}

/* ---------- Marcações ---------- */
const COR_MARCA = { dor:'var(--crit)', sintoma:'var(--warn)', irradiacao:'var(--water)', limitacao:'var(--earth)', procedimento:'var(--brand)' };

  if (t === 'dor') return `<circle cx="${x}" cy="${y}" r="${r}"/>`;

  if (t === 'procedimento') return `<path d="M${x} ${y - r}L${x + r} ${y + r * .8}L${x - r} ${y + r * .8}Z"/>`;
  return `<circle cx="${x}" cy="${y}" r="${r - 2}"/>`;
}
// Ícone da legenda e das listas. est: 'at' (atual), 'ant' (anterior, cinza) ou 'hist' (histórico, tracejado).
const iconeMarca = (t, est = 'at') => `<svg viewBox="0 0 20 20" class="lg-i mk e-${est}" ${est === 'at' ? `style="--c:${COR_MARCA[t]}"` : ''} aria-hidden="true">${t === 'irradiacao' ? '<path class="rad" d="M4 15L15 5"/><path class="seta" d="M17 3L10.5 5.5L14.5 9.5Z"/>' : ''}${formaMarca(t, t === 'irradiacao' ? 5 : 10, t === 'irradiacao' ? 14 : 10, 6)}</svg>`;
function marcaSvg(m, est, sel){
  const [w, h] = TAM[m.vista], x = +(m.x * w).toFixed(1), y = +(m.y * h).toFixed(1), r = 7;
  let s = '';
  if (m.tipo === 'irradiacao' && m.x2 != null) {
    const x2 = +(m.x2 * w).toFixed(1), y2 = +(m.y2 * h).toFixed(1), a = Math.atan2(y2 - y, x2 - x), L = 9;
    const p = d => `${(x2 - L * Math.cos(a + d)).toFixed(1)} ${(y2 - L * Math.sin(a + d)).toFixed(1)}`;
    s += `<path class="rad" d="M${x} ${y}L${x2} ${y2}"/><path class="seta" d="M${x2} ${y2}L${p(.45)}L${p(-.45)}Z"/>`;
  }
  if (m.lado === 'bil' && eixo(m.vista)) s += `<g class="esp">${formaMarca(m.tipo, +(2 * eixo(m.vista) - x).toFixed(1), y, r)}</g>`;
  if (sel) s += `<circle class="mk-sel" cx="${x}" cy="${y}" r="${r + 5}"/>`;
  s += formaMarca(m.tipo, x, y, r);
  if (marcaComIntensidade(m.tipo) && m.intensidade != null) s += `<text class="mk-n" x="${x + 9}" y="${y - 6}">${m.intensidade}</text>`;
  return `<g class="mk t-${m.tipo} e-${est}${sel ? ' sel' : ''}" data-id="${esc(m.id)}" data-x="${m.x}" data-y="${m.y}" data-lado="${m.lado}"${m.x2 != null ? ` data-x2="${m.x2}" data-y2="${m.y2}"` : ''} ${est === 'at' ? `style="--c:${COR_MARCA[m.tipo]}"` : ''}><title>${esc(nomeTipoMarca(m.tipo))} · ${esc(m.regiao || 'sem região')} · ${fmt(m.data)}</title>${s}</g>`;
}
// Pontos sobre o desenho, com o código ao lado (para fora do corpo).

  })).join('');
}

const corTrajeto = k => VASOS_ATLAS.includes(k) ? 'var(--vaso)' : COR_ELEMENTO[MER[k][1]];
const chaveTrajeto = v => v === 'anterior' ? 'ant' : v === 'posterior' ? 'post' : v === 'lat_d' || v === 'lat_e' ? 'lat' : null;
const temTrajetoNaVista = (k, v) => !!TRAJETOS[k][chaveTrajeto(v)];
const NOME_TRAJ = { ant:'anterior', post:'posterior', lat:'laterais' };

// Trajeto a que o ponto pertence: VC segue Ren Mai e VG segue Du Mai.
const trajetoDoPonto = c => ({ VC:'Ren Mai', VG:'Du Mai' })[c.replace(/\d+$/, '')] || c.replace(/\d+$/, '');
function trajetoSvg(k, v, on){
  const ch = chaveTrajeto(v), T = TRAJETOS[k];
  if (!ch || !T[ch]) return '';
  const base = T[ch].map(([x, y]) => [v === 'lat_e' ? 200 - x : x, y]);
  const linhas = [base]; if (!T.meio && ch !== 'lat') linhas.push(base.map(([x, y]) => [200 - x, y]));

}
// db.biblioteca = { particular:[{ id, titulo, ponto, texto, em }], notas:{ [codigo]:texto },
//   revisoes:{ [codigo]:{ ok, por, em, hist:[{ acao, por, em }] } } }  (etapa 4C: revisão da posição no mapa)
// O campo só é criado quando a clínica grava algo: quem não usa a Particular continua com os dados iguais.
// Nada aqui altera as fichas Central nem a exportação no formato v1.
const vazia = () => ({ particular:[], notas:{}, revisoes:{} });
const bibliotecaDe = d => d?.biblioteca && typeof d.biblioteca === 'object' ? { ...vazia(), ...d.biblioteca } : vazia();
function garantir(d){
  if (!d.biblioteca || typeof d.biblioteca !== 'object') d.biblioteca = vazia();
  if (!Array.isArray(d.biblioteca.particular)) d.biblioteca.particular = [];
  if (!d.biblioteca.notas || typeof d.biblioteca.notas !== 'object') d.biblioteca.notas = {};
  if (!d.biblioteca.revisoes || typeof d.biblioteca.revisoes !== 'object') d.biblioteca.revisoes = {};
  return d.biblioteca;
}
function adicionarFichaParticular(d, { titulo, ponto, texto }, em, id){
  const t = String(titulo || '').trim(), x = String(texto || '').trim();
  if (!t || !x) return null;
  const f = { id, titulo:t, ponto:String(ponto || '').trim().toUpperCase(), texto:x, em };
  garantir(d).particular.unshift(f); return f;
}
function removerFichaParticular(d, id){
  const B = garantir(d), i = B.particular.findIndex(f => f.id === id);
  if (i < 0) return false; B.particular.splice(i, 1); return true;
}
// Anotação particular num ponto. Texto vazio apaga a anotação.
function definirNotaPonto(d, codigo, texto){
  const B = garantir(d), t = String(texto || '');
  if (t.trim()) B.notas[codigo] = t; else delete B.notas[codigo];
}
// Etapa 4C: a profissional confere a posição aproximada do ponto no mapa e registra quem e quando.
// Retirar a revisão também fica no histórico. Não muda a posição nem o conteúdo da ficha.
const revisaoDe = (d, c) => bibliotecaDe(d).revisoes[c] || null;
function revisarPosicao(d, c, ok, por, em){
  const R = garantir(d).revisoes, r = R[c] ||= { ok:false, hist:[] };
  if (!!r.ok === !!ok) return null;
  Object.assign(r, { ok:!!ok, por, em });
  r.hist.unshift({ acao: ok ? 'Posição marcada como revisada' : 'Revisão retirada', por, em });
  return r;
}

// CPF: vazio é aceito (campo opcional); preenchido, precisa ter 11 dígitos e dígitos verificadores corretos.
function cpfValido(v){
  const d = String(v||'').replace(/\D/g,'');
  if(!d) return true;
  if(d.length!==11 || /^(\d)\1{10}$/.test(d)) return false;
  const dv = n => { let s=0; for(let i=0;i<n;i++) s+=Number(d[i])*(n+1-i); const r=s*10%11; return r===10?0:r; };
  return dv(9)===Number(d[9]) && dv(10)===Number(d[10]);
}
const cpfFormatado = v => { const d=String(v||'').replace(/\D/g,'').slice(0,11); return d.length===11?`${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`:v; };

function painelTrajeto(k){
  const vaso = VASOS_ATLAS.includes(k);
  const cab = `<div class="fx-h"><span class="fx-c tj-c" style="--c:${corTrajeto(k)}">${esc(vaso ? SIGLA_VASO[k] : k)}</span><div class="grow"><b>${esc(vaso ? k : MER[k][0])}</b><small>${vaso ? 'Vaso extraordinário' : 'Meridiano principal · ' + elTag(MER[k][1])}</small></div><button class="btn ghost sm fx-x" data-act="atl-fx-x" aria-label="Fechar">${ic('x')}</button></div>
    <p class="muted sm">Trajeto aproximado · vistas ${vistasDoTrajeto(k).join(', ')}.</p>`;
  if (vaso) {
    const [, ab, ac] = PARES_VASOS.find(p => p[0] === k), par = PARES_VASOS.find(p => p[1] === ac)?.[0];
    return `${cab}<div class="vs-p"><div><span class="lbl">Ponto de abertura</span>${botaoPonto(ab, 'atl-pt')}</div><div><span class="lbl">Ponto acoplado</span>${botaoPonto(ac, 'atl-pt')}</div></div>
      ${par ? `<p class="sm">Par: <b>${esc(par)}</b>. Os mesmos pares do Plano terapêutico.</p>` : ''}
      <p class="muted sm">A indicação de vasos no tratamento continua como dica no Plano e aguarda os seus critérios.</p>`;
  }
  const L = CODIGOS.filter(c => meridianoDe(c) === k), n = L.filter(c => PT[c]).length;
  return `${cab}<p class="sm">${L.length} pontos · <b>${n}</b> com ficha · ${L.length - n} pendentes</p><div class="pc-g">${L.map(c => botaoPonto(c, 'atl-pt')).join('')}</div>`;

function vAtlas(){
  const A = ui.atlas, v = A.vista, f = FACES[v] ? A.face[v] : '', [w, h] = TAM[v], ativos = A.ativos.filter(k => MERIDIANOS.includes(k) || VASOS_ATLAS.includes(k));
  const abre = new Set(PARES_VASOS.filter(p => ativos.includes(p[0])).flatMap(p => [p[1], p[2]]));

  if(rasc&&M.rad){ if(!sobre){ toast('Toque sobre o corpo para marcar o destino','info'); return; }
    const m=editarMarca(A,M.rad,'destino',[q.x/w,q.y/h]); M.rad=null; if(m){ M.sel=m.id; mudou('mapa corporal: trajeto da irradiação'); toast('Trajeto da irradiação marcado'); } else render(true); return; }
  const ptp=ev.target.closest('.ptp');
  if(ptp&&(!rasc||M.ferr==='sel')){ M.pt=ptp.dataset.pt; M.rm=false; render(true); return; }
  if(!rasc||M.ferr==='sel'){ if(mk){ M.sel=mk.dataset.id; M.pt=null; M.rm=false; render(true); } return; }
  // Com um tipo ativo, tocar numa marcação deste atendimento apaga a marcação.
  if(mk&&marcasDe(A).some(y=>y.id===mk.dataset.id)){ const x=marcasDe(A).find(y=>y.id===mk.dataset.id); removerMarca(A,x.id); if(M.sel===x.id){ M.sel=null; M.rm=false; } M.pt=null;
    toast(`${nomeTipo(x.tipo)} apagada`,'info'); mudou(`mapa corporal: marcação removida (${nomeTipo(x.tipo).toLowerCase()}${x.regiao?', '+x.regiao:''})`); return; }
  if(!sobre){ toast('Toque sobre o corpo para marcar','info'); return; }
  const tipo=M.ferr, m=adicionarMarca(A,{id:uid(),tipo,vista:v,face:f,x:q.x/w,y:q.y/h,lado:ladoDe(v,f,q.x)},new Date().toISOString()); if(!m) return;
  const rg=regiaoDoToque(v,f,q.x,q.y,!!ev.target.closest('.b2')); if(rg) editarMarca(A,m.id,'regiao',rg);
  M.sel=m.id; M.pt=null; M.rm=false;
  if(tipo==='irradiacao'){ M.rad=m.id; toast('Origem marcada. Agora toque no destino','info'); }
  else toast(`${nomeTipo(tipo)} marcada · ${m.regiao?m.regiao.toLowerCase()+' · ':''}${nomeLadoMarca(m.lado).toLowerCase()}`);
  mudou(`mapa corporal: marcação de ${nomeTipo(tipo).toLowerCase()} adicionada`);
}

// Baixa um texto como arquivo (cópia de segurança).
function baixar(texto, nome){ const u=URL.createObjectURL(new Blob([texto],{type:'application/json'})), l=document.createElement('a'); l.href=u; l.download=nome; document.body.append(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); }

  if(t.dataset.atsit||t.dataset.atorig){ const x=atendimentoAberto(), av=x&&avaliacaoEditavel(x.p,x.a); if(av&&!travada(x.p,x.a,av)){ definirAchado(av,t.dataset.atsit||t.dataset.atorig,t.dataset.atsit?'sit':'orig',t.value); mudou('avaliação energética: '+(t.dataset.atsit?'situação':'origem')+' dos achados'); } return; }
  if(t.dataset.vaso){ const x=atendimentoAberto(); if(x){ const v=(x.a.vasos||={})[t.dataset.vaso]||={considerar:false,nota:''}; v.considerar=t.checked; mudou('avaliação energética: vasos extraordinários'); } return; }
  if(t.id==='pr-patient'){ ui.pid=t.value; render(true); }
  else if(t.id==='as-patient'){ ui.pid=t.value; ui.assess={pid:t.value,signs:[],status:{},nota:''}; render(true); }
  else if(t.id==='pt-patient'){ ui.pid=t.value; render(true); }
  else if(t.id==='cb-sheng'){ ui.sheng=t.checked; render(true); }
  else if(t.id==='cb-ke'){ ui.ke=t.checked; render(true); }

document.addEventListener('submit',ev=>{
  ev.preventDefault(); const f=ev.target, v=id=>document.getElementById(id).value;
  if(f.id==='f-rx-corr'){ const x=atendimentoAberto(), C=ui.rxCorr; if(!x||!C) return; if(!C.motivo.trim()){ toast('Escreva o motivo da correção','info'); return; }
    const em=new Date().toISOString(), mud=corrigirPonto(x.a,C.c,C,C.motivo,PROF.nome,em); if(!mud){ toast('Nada mudou neste ponto','info'); return; }
    ui.rxCorr=null; mudou(`plano terapêutico: correção de ${C.c} (${mud.map(([k,a,b])=>`${k.toLowerCase()}: ${a} → ${b}`).join('; ')}). Motivo: ${C.motivo.trim()}`); toast('Correção registrada'); return; }
  if(f.matches('.f-msg')){ const k=f.dataset.k, tx=f.querySelector('textarea').value; if(!tx.trim()){ toast('Escreva o texto da mensagem','info'); return; }
    salvarMensagemWa(db,k,tx,new Date().toISOString(),PROF.nome); save(); render(true); toast('Mensagem salva'); return; }
  if(f.id==='f-mod'){ const E=ui.docEd; if(!E) return; if(!E.nome.trim()||!E.texto.trim()){ toast('Dê um nome e escreva o texto do modelo','info'); return; }
    const k=salvarModelo(db,E.novo?null:ui.docMod,E,new Date().toISOString(),PROF.nome,'mod-'+uid()); if(!k) return;
    ui.docMod=k; ui.docEd=null; save(); render(true); toast(E.novo?'Modelo criado':'Modelo salvo'); return; }
  if(f.matches('.fin-rec')){ const r=receber(db,f.dataset.ap,{id:uid(),valor:lerValor(v('rec-v')),forma:ui.finRec?.forma,data:TODAY,por:PROF.nome});
    if(typeof r==='string'){ toast(r,'info'); return; } const x=db.appts.find(z=>z.id===f.dataset.ap), falta=faltaDe(db,x);
    ui.finRec=null; save(); render(true); toast(falta>0?`${brl(r.valor)} recebido; ficou faltando ${brl(falta)}`:`${brl(r.valor)} recebido de ${patient(x.pid)?.name.split(' ')[0]||''}`); return; }
  if(f.id==='f-novo-pac'){ const pid=v('np-p'), k=novoPacote(db,{id:uid(),pid,serv:servicoPacote(pid),total:v('np-s'),valor:lerValor(v('np-v')),em:TODAY,por:PROF.nome});
    if(!k){ toast('Informe as sessões e o valor','info'); return; } ui.finPac=null; save(); render(true); toast('Pacote criado'); return; }
  if(f.id==='f-nova-desp'){ const d=novaDespesa(db,{id:uid(),desc:v('nd-d'),cat:v('nd-c'),valor:lerValor(v('nd-v')),data:TODAY,repete:document.getElementById('nd-r').checked,por:PROF.nome});
    if(!d){ toast('Informe a despesa e o valor','info'); return; } save(); render(true); toast('Despesa lançada'); return; }
  if(f.id==='f-int'){ if(novoInteressado(db,{id:uid(),nome:v('int-nome'),tel:v('int-tel'),origem:v('int-origem'),em:new Date().toISOString(),por:PROF.nome})){ ui.novoInt=null; save(); render(true); toast('Interessado incluído'); } return; }
  if(f.id==='f-part'){ const d=Object.fromEntries(new FormData(f)); if(adicionarFichaParticular(db,d,new Date().toISOString(),uid())){ save(); render(true); toast('Ficha adicionada à Particular'); } return; }
  if(f.id==='f-patient'){
    const cpf=document.getElementById('np-cpf');
    if(!cpfValido(cpf.value)){ cpf.setCustomValidity('CPF inválido: confira os 11 números.'); cpf.reportValidity(); return; }
    const em=new Date().toISOString(), lgpd=document.getElementById('np-lgpd');
    const cadastro={cpf:cpf.value.trim()?cpfFormatado(cpf.value.trim()):'',email:v('np-email').trim(),endereco:v('np-end').trim(),cidade:v('np-cid').trim(),hemisferio:v('np-hem'),contatoEmergencia:v('np-emerg').trim()};
    const alerts=Object.fromEntries(['gestante','anticoagulante','marcapasso'].map(k=>[k,document.getElementById('np-al-'+k).checked]));
    if(ui.editPid){ const p=patient(ui.editPid);
      p.name=v('np-name').trim(); p.birth=v('np-birth'); p.phone=v('np-phone'); p.queixas.find(q=>q.id==='q1').descricao=v('np-q').trim();
      Object.assign(p.alerts,alerts); p.cadastro={...p.cadastro,...cadastro,atualizadoEm:em};
      if(lgpd?.checked) p.consentimento=TODAY;
      save(); ui.pid=p.id; ui.editPid=null; ui.tab='resumo'; toast('Cadastro atualizado'); location.hash='prontuario'; return; }
    const p=hidratarPaciente(novoPaciente({id:uid(),name:v('np-name').trim(),birth:v('np-birth'),phone:v('np-phone'),queixa:v('np-q'),consentimento:TODAY,em}));

    db.patients.push(p); const ni=ui.cadPrevio?.intId&&(db.interessados||[]).find(x=>x.id===ui.cadPrevio.intId); if(ni) virouPaciente(ni,p.id); ui.cadPrevio=null; save(); ui.pid=p.id; ui.tab='anamnese'; toast('Paciente cadastrado'); location.hash='prontuario';

  } else if(f.classList.contains('livre-f')){
    const x=atendimentoAberto(), av=x&&avaliacaoEditavel(x.p,x.a); if(!av||travada(x.p,x.a,av)) return; const c=f.dataset.cat, texto=v('lv-'+c).trim(); if(!texto) return;

    if(f.id==='f-at-queixa'){ const d=v('atq-desc').trim(); if(!d) return; const q=adicionarQueixa(x.p,{id:uid(),descricao:d},new Date().toISOString()); x.a.evolucao.intensidades[q.id]=5; mudou('queixa adicionada'); toast('Queixa adicionada'); }
    else { const L=v('at-pt-c').split(',').map(s=>s.trim().toUpperCase()).filter(Boolean).filter(c=>!x.a.plano.pontos.includes(c)); if(!L.length) return; x.a.plano.pontos.push(...L); mudou('plano terapêutico: pontos'); }

    save(); ui.bookPid=null; ui.remarcar=null; ui.agForm=null; ui.agDia=date; render(true);
  }
});
