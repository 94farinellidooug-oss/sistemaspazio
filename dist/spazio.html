.ptp.abre circle:not(.pt-h){fill:var(--vaso);stroke:var(--surface)}
.ptp.abre text{fill:var(--vaso)}
.tj{cursor:pointer}
.tj-h{fill:none;stroke:transparent;stroke-width:12}
.tj-l{fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.tj.vaso .tj-l{stroke-dasharray:5 3;stroke-width:2.2}
.tj.on .tj-l,.tj:hover .tj-l{stroke-width:3.4;opacity:1}
.tj-t{font:700 8px var(--f-body);fill:var(--c);paint-order:stroke;stroke:var(--surface-2);stroke-width:2.5px;pointer-events:none}
.lg-w{width:24px;height:10px}
.lg-m{stroke:var(--wood);stroke-width:2.2;fill:none}
.lg-v{stroke:var(--vaso);stroke-width:2.2;stroke-dasharray:5 3;fill:none}
.fx-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:10px 0;font-size:.86rem}
.fx-dl dt{color:var(--muted);font-weight:500}
.fx-dl dd{margin:0;min-width:0}
.tj-gr{display:grid;gap:8px;margin-bottom:12px}
.tj-gh{display:flex;align-items:center;gap:2px}
.tj-gh .btn{padding:3px 7px;white-space:nowrap}
.tj-gh .lbl{margin-right:auto}
.chip.tjc{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-size:.8rem}
.chip.tjc i{width:10px;height:10px;border-radius:50%;border:2px solid var(--c);flex:none}
.chip.tjc.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--ink);font-weight:600}
.chip.tjc.on i{background:var(--c)}
.at-cols{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:start}
.at-ctl,.at-map{min-width:0}
.at-map .zoom{margin:8px 0 10px}
.tp-l{display:flex;align-items:center;gap:8px;font-size:.84rem;margin:0 0 8px}
.fx-panel{min-width:0;align-self:start;position:sticky;top:12px}
.fx-vazio{display:grid;justify-items:center;text-align:center;gap:6px;padding:26px 10px;color:var(--muted)}
.fx-vazio .ic{width:28px;height:28px}
.fx-vazio b{color:var(--ink)}
.fx-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fx-h .grow{display:grid;gap:3px;min-width:0}
.fx-h small{color:var(--muted);font-size:.8rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fx-c{display:inline-grid;place-items:center;min-width:46px;height:46px;padding:0 6px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font:700 .9rem var(--f-mono);flex:none}
.fx-c.tj-c{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);font-size:.8rem}
.fx-x{margin-left:auto;padding:4px}
.fx-fonte,.fx-pos,.fx-part{display:grid;gap:6px;border-top:1px solid var(--line);padding:10px 0;font-size:.86rem;justify-items:start}
.fx-part{padding-bottom:0}
.fx-part textarea{width:100%;min-height:60px}
.fx-part small{display:inline-flex;align-items:center;gap:5px}
.fx-part small .ic{width:13px;height:13px}
.fx-pend{margin:4px 0 10px}
.pc-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
.pc{display:grid;gap:1px;text-align:left;border:1px dashed var(--line-2);background:var(--surface);border-radius:9px;padding:6px 8px;cursor:pointer;color:var(--muted);font:inherit;min-width:0}
.pc b{font:600 .8rem var(--f-mono);color:var(--ink)}
.pc small{font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.tem{border-style:solid;border-color:var(--accent-line);background:var(--accent-soft)}
.pc.tem small{color:var(--accent)}
.pc.on{outline:2px solid var(--accent);outline-offset:1px}
.pc:hover{border-color:var(--accent)}
.vs-p{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.vs-p>div{display:grid;gap:6px}
#c-todos-card .notice{margin-bottom:12px}
.cg{margin-bottom:14px}
.cg h4{font-size:.9rem;margin:0 0 8px}
.pa-l{display:grid;gap:10px}
.pa{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line);padding-top:10px}
.pa:first-child{border-top:0;padding-top:0}
.pa .grow{display:grid;gap:4px;justify-items:start;flex:1;min-width:0}
.pa p{margin:0;font-size:.86rem;white-space:pre-wrap;overflow-wrap:anywhere}
.pa .pill{cursor:pointer;font-family:var(--f-mono);border:0}
.pa-f{display:grid;gap:12px}
.pa-f textarea{min-height:80px}
@media (max-width:760px){.at-cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1100px){
  .fx-panel{position:static}
  .fx-panel.aberta{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:66vh;overflow:auto;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px));background:transparent}
  .fx-panel.aberta>.card{box-shadow:0 -6px 28px rgba(30,30,20,.22);border-radius:16px 16px 12px 12px}
  .vs-p{grid-template-columns:minmax(0,1fr)}
}
/* ---------- Etapa 5 · Plano e evolução (proposta aprovada em 05/11) ---------- */
.rx-res{display:flex;flex-wrap:wrap;gap:6px}
.rx-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted);margin:0 0 8px}
.rx-leg span{display:inline-flex;align-items:center;gap:4px}
.rx-leg .ic{width:13px;height:13px}
.rx-l{display:grid;gap:6px}
.rx{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:8px;padding:6px 6px 6px 10px;border:1px solid var(--line);border-left:4px solid var(--line-2);border-radius:10px;background:var(--surface);min-width:0}
.rx.real{border-left-color:var(--ok)}
.rx.nao{border-left-color:var(--crit)}
.rx-p{display:flex;align-items:center;gap:8px;min-width:0}
.rx-c{min-width:44px;font-size:.9rem;color:var(--accent)}
.rx-nm{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rx-w{display:inline-flex;color:var(--warn)}
.rx-w .ic{width:15px;height:15px}
.rx-med,.rx-ro{font-size:.78rem;color:var(--muted);padding:0 8px;white-space:nowrap}
.rx-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.rx-seg button{display:inline-flex;align-items:center;gap:5px;border:0;border-right:1px solid var(--line-2);background:var(--surface);color:var(--muted);font:inherit;font-size:.8rem;font-weight:500;padding:6px 10px;min-height:32px;cursor:pointer}
.rx-seg button:last-child{border-right:0}
.rx-seg button .ic{width:14px;height:14px}
.rx-seg button.on{background:var(--accent-soft);color:var(--accent)}
.rx-seg.st button.on.plan{background:var(--surface-2);color:var(--ink)}
.rx-seg.st button.on.real{background:var(--ok);color:#fff}
.rx-seg.st button.on.nao{background:var(--crit);color:#fff}
.rx-x{padding:4px 6px}
.rx-mot,.rx-mt{grid-column:1/-1}
.rx-mot{font:inherit;font-size:.84rem;padding:6px 9px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.rx-a{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}
.rx-a .nq{flex:1 1 220px;min-width:0}
.rx.corr{grid-template-columns:minmax(0,1fr);gap:10px;padding:12px;border-left-color:var(--accent);background:var(--accent-soft)}
.rx-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rx-f{display:grid;gap:4px;min-width:0}
.rx-f.full{grid-column:1/-1}
.rx-f select,.rx-f input{width:100%;min-width:0;font:inherit;font-size:.88rem;padding:7px 9px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink)}
.rx-ba{display:flex;flex-wrap:wrap;gap:8px}
.ret-l{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px;font-size:.86rem}
.ret-l li{display:grid;gap:3px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
.ret-l s{color:var(--muted)}
.qx-l{display:grid;gap:10px}
.qx{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.qx-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.qx-v{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;font-size:.88rem}
.qx-d{font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2)}
.qx-d.cai{color:var(--ok);background:var(--ok-soft)}
.qx-d.sobe{color:var(--crit);background:var(--crit-soft)}
.qx-s{display:flex;flex-wrap:wrap;gap:6px}
.qx-s .chip{padding:5px 11px;font-size:.84rem}
.ev-l{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.88rem}
.ev-l li{display:flex;gap:8px;align-items:flex-start;overflow-wrap:anywhere}
.ev-l .ic{width:15px;height:15px;color:var(--ok);flex:none;margin-top:2px}
.ev-l.nao .ic{color:var(--crit)}
#ev-plan{margin-top:12px}
#ev-plan .btn{padding:0 4px;vertical-align:baseline}
@media (max-width:560px){
  .rx{display:flex;flex-wrap:wrap;row-gap:6px}
  .rx-p{flex:1 1 calc(100% - 52px)}
  .rx-x{order:1}
  .rx-seg,.rx-med,.rx-ro{order:2}
  .rx-mot,.rx-mt{order:3;flex:1 1 100%}
  .rx.corr{display:grid}
}
/* Folha impressa para o paciente */
#imp{display:none}
@media print{
  body > :not(#imp){display:none !important}
  #imp{display:block;color:#000;font-size:12pt;padding:10mm}
  .imp-h{display:flex;gap:12px;align-items:center;border-bottom:1px solid #999;padding-bottom:8px;margin-bottom:16px}
  .imp-h svg{width:32px;height:32px}
  .imp-h small{display:block;color:#444}
  .imp-t{line-height:1.6}
  .imp-a{margin-top:28px;color:#444}
}

/* Etapa 6A · Agenda */
.ag-sem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:16px}
.ag-sem button{display:grid;justify-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;font:inherit;color:var(--ink);cursor:pointer;min-width:0}
.ag-sem button span{font-size:.72rem;color:var(--muted);text-transform:capitalize}
.ag-sem button b{font-size:1.05rem}
.ag-sem button small{font-size:.68rem;color:var(--muted);white-space:nowrap}
.ag-sem button.hoje{border-color:var(--accent-line)}
.ag-sem button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ag-sem button.on span,.ag-sem button.on small{color:inherit;opacity:.85}
.ag-cols{align-items:start}
#ag-dia .card-h h2::first-letter{text-transform:uppercase}
.hor-l{display:grid;gap:6px}
.hor{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:8px 8px 8px 10px;border:1px solid var(--line);border-left:4px solid var(--line-2);border-radius:10px;background:var(--surface);min-width:0}
.hor.confirmado{border-left-color:var(--accent)}
.hor.atendido{border-left-color:var(--ok)}
.hor.faltou{border-left-color:var(--crit)}
.hor.desmarcado{opacity:.6;border-left-style:dashed}
.hor-h{display:grid;line-height:1.15}
.hor-h small{font-size:.72rem;color:var(--muted)}
.hor-p{display:grid;min-width:0;justify-items:start}
.hor-p .lk{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hor-p .lk:hover{color:var(--accent);text-decoration:underline}
.hor-p small{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.hor-hi{color:var(--warn)}
.hor-a{display:flex;gap:4px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.hor-a .btn.ghost{padding:4px 7px}
.rx-seg.st button.on.agendado{background:var(--surface-2);color:var(--ink)}
.rx-seg.st button.on.confirmado{background:var(--accent);color:var(--accent-ink)}
.rx-seg.st button.on.atendido{background:var(--ok);color:#fff}
.rx-seg.st button.on.faltou{background:var(--crit);color:#fff}
.ag-fora{margin-top:10px}
.ag-fora summary{cursor:pointer;font-size:.84rem;color:var(--muted);margin-bottom:6px}
.ag-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ag-f .full{grid-column:1/-1}
#ag-livres .chip{font-family:var(--f-mono);font-size:.8rem;padding:5px 10px}
@media (max-width:560px){
  .hor{display:flex;flex-wrap:wrap;row-gap:6px}
  .hor-p{flex:1 1 calc(100% - 70px)}
  .hor .rx-seg{order:1}
  .hor-a{margin-left:auto;order:2}
  .ag-sem{gap:3px}
  .ag-sem button{padding:6px 0}
  .ag-sem button small{font-size:.6rem}
}

/* Etapa 6B · Documentos */
.doc-m{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:14px 0}
.doc-m button{display:grid;justify-items:center;gap:6px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;font:inherit;font-size:.8rem;color:var(--ink);cursor:pointer;min-width:0}
.doc-m button .ic{width:20px;height:20px;color:var(--accent)}
.doc-m button.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
#doc-novo > .notice{margin-bottom:10px}
.doc-pv{border:1px solid var(--line-2);border-radius:8px;background:#fff;color:#1d1d1b;padding:22px 24px;margin-bottom:8px;box-shadow:var(--shadow)}
.dp-h{display:flex;gap:10px;align-items:center;border-bottom:1px solid #ccc;padding-bottom:10px;margin-bottom:14px}
.dp-h svg{width:28px;height:28px}
.dp-h small{display:block;color:#666;font-size:.78rem}
.dp-t{line-height:1.6;font-size:.92rem;outline:0;border-radius:6px;overflow-wrap:anywhere;min-height:60px}
.dp-t p,.imp-t p{margin:0 0 10px}
.dp-p{margin-top:18px;color:#555;font-size:.86rem}
.dp-as{margin-top:30px;display:grid;justify-items:center;gap:4px}
.dp-as span{width:min(260px,80%);border-bottom:1px solid #555;height:20px}
.dp-as small{color:#555}
.lk-s{border:0;background:none;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
.doc-l{display:grid;gap:4px}
.doc-li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem;flex-wrap:wrap}
.doc-li .grow{display:grid;min-width:0;flex:1 1 140px}
.doc-li small{color:var(--muted);font-size:.78rem}
.doc-li .btn.ghost{padding:4px 7px}
@media (max-width:560px){
  .doc-m{grid-template-columns:repeat(2,minmax(0,1fr))}
  .doc-pv{padding:16px}
}
@media print{#imp .dp-as span{border-color:#000}}

/* Modelos de documento editados na página (proposta/modelos) */
.doc-m button{position:relative}
.doc-m button i.pill{position:absolute;top:6px;right:6px;font-style:normal;font-size:.66rem;padding:1px 6px}
.doc-m button.novo{border-style:dashed;color:var(--muted)}
.doc-m button.novo .ic{color:var(--muted)}
.rx-f textarea{width:100%;min-width:0;font:inherit;font-size:.9rem;line-height:1.55;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical;min-height:180px}
.rx-f textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cps{display:flex;flex-wrap:wrap;gap:6px}
.cps .chip{font-size:.78rem;padding:4px 9px}
.cps .chip .ic{width:13px;height:13px}
.cp{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:0 6px;font-size:.84em;font-weight:500}
.mod-raw{line-height:1.6;font-size:.88rem;border:1px dashed var(--line-2);border-radius:8px;padding:12px 14px;overflow-wrap:anywhere}
.mod-raw p{margin:0 0 8px}
.mod-l{margin-top:10px}
.mod-l li{align-items:center}
.mod-l .ic{color:var(--accent);margin-top:0}
.ck{display:flex;gap:8px;align-items:center;font-size:.88rem;cursor:pointer}
.ck input{width:17px;height:17px;accent-color:var(--accent)}
#f-mod .dica{display:block;margin-top:6px;font-size:.78rem}

/* Etapa 6C · Relacionamento */
.ctt-l{display:grid;gap:8px}
.ctt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;border:1px solid var(--line);border-radius:10px}
.ctt .grow{display:grid;min-width:0;flex:1 1 160px;justify-items:start}
.ctt small{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.ctt .lk{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.ctt .lk:hover{color:var(--accent);text-decoration:underline}
.ctt .ctt-c{display:inline-flex;align-items:center;gap:4px;color:var(--ok)}
.ctt .ctt-c .ic{width:13px;height:13px}
.ctt.oc,.ctt.int.nao{opacity:.6}

// Funções puras, sem acesso ao navegador: podem ser testadas direto no Node.
//
// Formato v2:
// { versao:2, origem:'spazio-v1'|'exemplos'|'importacao', migradoEm, appts:[...mesmo formato do v1],
//   patients:[{ id, name, birth, phone, exemplo, consentimento?, anam, alerts,
//     cadastro:{cpf, email, endereco, cidade, hemisferio:'Sul'|'Norte', contatoEmergencia},
//     queixas:[{id, descricao, ativa}],
//     atendimentos:[{ id, data, status:'finalizado'|'rascunho', origem:'v1'|'sistema',
//       plano:{pontos, tec}, evolucao:{intensidades:{[idQueixa]:0..10}, nota}, avaliacaoId,
//       historico:[{em, acao}] }],
//     avaliacoes:[{ id, date, signs, status, nota, atendimentoId, historico:[{em, acao}] }] }] }
//
// As telas continuam lendo p.sessions, p.assess e p.queixa: são calculados a partir do v2
// (propriedades não gravadas), no mesmo formato e na mesma ordem do v1. Assim o comportamento
// não muda e paraV1() devolve exatamente os dados do v1.

const VERSAO = 2;
const QP = 'q1'; // identificador da queixa principal
// Campos do paciente no v1. Qualquer outro campo é guardado como está e devolvido por paraV1().
const CONHECIDOS = ['id','name','birth','phone','exemplo','queixa','consentimento','anam','alerts','sessions','assess'];

const lista = x => Array.isArray(x) ? x : [];
const obj = x => x && typeof x === 'object' && !Array.isArray(x) ? x : {};
const txt = x => typeof x === 'string' ? x : x == null ? '' : String(x);
const evaN = x => { const n = Number(x); return Number.isFinite(n) ? n : 0; };

// Sessão do v1 → atendimento finalizado do v2 (mesmo id).
function atendimentoDeSessao(s, em){
  return { id: txt(s.id), data: txt(s.date), status: 'finalizado', origem: 'v1',
    plano: { pontos: lista(s.pontos).map(txt), tec: lista(s.tec).map(txt) },
    evolucao: { intensidades: { [QP]: evaN(s.eva) }, nota: txt(s.nota) },
    avaliacaoId: null, historico: [{ em, acao: 'migrado da sessão do v1' }] };
}

// Converte os dados do v1 (ou os exemplos) para o v2. Não altera o objeto recebido.
function migrarV1(v1, em = new Date().toISOString(), origem = 'spazio-v1'){
  const d = obj(v1);
  const patients = lista(d.patients).filter(p => p && typeof p === 'object').map(p0 => {
    const p = JSON.parse(JSON.stringify(p0));
    const atendimentos = lista(p.sessions).filter(s => s && typeof s === 'object').map(s => atendimentoDeSessao(s, em));
    const avaliacoes = lista(p.assess).filter(a => a && typeof a === 'object').map(a => {
      const at = atendimentos.find(x => x.data === a.date && !x.avaliacaoId);
      if (at) at.avaliacaoId = txt(a.id);
      return { id: txt(a.id), date: txt(a.date), signs: lista(a.signs).map(txt), status: obj(a.status), nota: txt(a.nota),
        atendimentoId: at ? at.id : null, historico: [{ em, acao: 'migrada da avaliação do v1' }] };
    });
    const n = { id: txt(p.id), name: txt(p.name), birth: txt(p.birth), phone: txt(p.phone), exemplo: !!p.exemplo };
    if ('consentimento' in p) n.consentimento = p.consentimento;
    n.anam = obj(p.anam); n.alerts = obj(p.alerts);
    n.cadastro = { cpf: '', email: '', endereco: '', cidade: '', hemisferio: 'Sul', contatoEmergencia: '' };
    n.queixas = [{ id: QP, descricao: txt(p.queixa), ativa: true }];
    n.atendimentos = atendimentos; n.avaliacoes = avaliacoes;
    // Guarda a ordem original dos campos do v1, para devolver os dados exatamente como eram.
    n.v1 = { campos: Object.keys(p) };
    const extras = Object.keys(p).filter(k => !CONHECIDOS.includes(k));
    if (extras.length) n.v1.extras = Object.fromEntries(extras.map(k => [k, p[k]]));
    return n;
  });
  return { versao: VERSAO, origem, migradoEm: em, patients, appts: lista(d.appts).filter(a => a && typeof a === 'object') };
}

// Visões no formato v1, calculadas a partir do v2.
const sessaoV1 = a => ({ id: a.id, date: a.data, eva: a.evolucao.intensidades[QP], pontos: a.plano.pontos, tec: a.plano.tec, nota: a.evolucao.nota });
const avaliacaoV1 = a => ({ id: a.id, date: a.date, signs: a.signs, status: a.status, nota: a.nota });
const sessoesDe = p => p.atendimentos.filter(a => a.status === 'finalizado').map(sessaoV1);
const avaliacoesDe = p => p.avaliacoes.map(avaliacaoV1);

function hidratar(db){
  db.patients.forEach(hidratarPaciente);

// Ícone em SVG, com o mesmo traço em todas as telas.
const ic = (k, c='') => `<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONES[k]||''}</svg>`;
// Marca do MUSUBI: dois círculos entrelaçados.
const LOGO = `<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" style="fill:var(--brand)"/><circle cx="11.2" cy="14" r="5.4" style="fill:none;stroke:#fff;stroke-width:2"/><circle cx="16.8" cy="14" r="5.4" style="fill:none;stroke:#fff;stroke-width:2;opacity:.75"/></svg>`;
// Estado vazio com ícone, título, explicação e ação opcional.
const vazio = (i, t, txt, acao='') => `<div class="empty"><span class="empty-i">${ic(i)}</span><b>${t}</b><p>${txt}</p>${acao}</div>`;
//
// O sistema monta a mensagem e abre o WhatsApp (link wa.me) com o número e o texto; quem envia é o
// profissional. Fica anotado quando a mensagem foi aberta e por quem, no próprio paciente:
//   p.relacionamento.mensagens = [{tipo, em, por, ap?}] (mais recente primeiro; ap = horário da agenda)
// Modelos de mensagens editadas pelo profissional ficam em db.mensagensWa = {lembrete:{texto, em, por}, ...}
// (criado no primeiro salvar; salvar igual ao original volta ao original). Nada disso vai para a
// exportação v1.

// [chave, nome, texto com os dados entre chaves]
const MENSAGENS_WA = [
  ['lembrete', 'Lembrete de horário', 'Olá, {primeiro}! Passando para lembrar do seu horário de {servico} {quando}, às {hora}, na {clinica}. Pode confirmar por aqui?'],
  ['retomar', 'Retomar contato', 'Olá, {primeiro}! Tudo bem? Faz um tempinho desde o seu último atendimento. Quer agendar um horário para continuarmos o tratamento?'],
  ['orientacoes', 'Orientações para casa', 'Olá, {primeiro}! Seguem as orientações do atendimento:\n\n{orientacoes}'],
  ['livre', 'Mensagem livre', 'Olá, {primeiro}! ']
];
// Dados que o sistema preenche: [campo, rótulo do botão]
const CAMPOS_WA = [['primeiro','Primeiro nome'], ['servico','Serviço'], ['quando','Dia'], ['hora','Hora'], ['clinica','Clínica'], ['profissional','Profissional'], ['orientacoes','Orientações']];

// [chave, nome, texto, 'original' | 'editada']
const mensagensWa = (M = {}) => MENSAGENS_WA.map(([k, n, t]) => M[k] ? [k, n, M[k].texto, 'editada'] : [k, n, t, 'original']);
const mensagemWa = (k, M) => mensagensWa(M).find(m => m[0] === k) || null;
function salvarMensagemWa(db, k, texto, em, por){
  const o = MENSAGENS_WA.find(m => m[0] === k), t = String(texto || '').trim();
  if (!o || !t) return null;
  const M = db.mensagensWa ||= {};
  if (t === o[2].trim()) delete M[k]; else M[k] = { texto: t, em, por };
  return k;
}
const voltarMensagemWa = (db, k) => { if (db.mensagensWa?.[k]) { delete db.mensagensWa[k]; return true; } return false; };

// Número para o link: só dígitos; com DDD e sem o 55 (10 ou 11 dígitos), o 55 entra na frente.
function numeroWa(tel){
  const d = String(tel || '').replace(/\D/g, '');
  return d.length === 10 || d.length === 11 ? '55' + d : d.length >= 12 && d.length <= 13 ? d : '';
}
const linkWa = (tel, texto) => numeroWa(tel) ? `https://wa.me/${numeroWa(tel)}?text=${encodeURIComponent(texto)}` : '';

// Valores para o paciente e, quando houver, o horário da agenda (a) e as orientações já escritas.
function valoresWa(p, a, { hoje, amanha, clinica, prof, orientacoes = '' }){
  const quando = !a ? '' : a.date === hoje ? 'hoje' : a.date === amanha ? 'amanhã' : `no dia ${fmt(a.date)}`;
  return { primeiro: (p.name || '').trim().split(/\s+/)[0] || '', servico: a ? String(a.tipo || '').toLowerCase() : '', quando, hora: a ? a.time : '',
    clinica, profissional: prof, orientacoes };
}
const preencherWa = (t, v) => t.replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);

// Anota que a mensagem foi aberta no WhatsApp.
function registrarMensagem(p, { tipo, em, por, ap }){
  if (!MENSAGENS_WA.some(m => m[0] === tipo)) return null;
  const r = p.relacionamento ||= {}, m = { tipo, em, por, ...(ap ? { ap } : {}) };
  (r.mensagens ||= []).unshift(m);
  return m;
}
// Último lembrete aberto para um horário da agenda.
const lembreteDe = (p, apId) => p?.relacionamento?.mensagens?.find(m => m.tipo === 'lembrete' && m.ap === apId) || null;
//
// Um rascunho fica em p.atendimentos com status 'rascunho'. Ele não aparece nas sessões (p.sessions)
// nem na exportação para o protótipo: só entra no prontuário quando é finalizado. Campos além do
// formato da etapa 2B:
//   inicio, atualizadoEm, etapas (índices das etapas abertas), sintese,
//   avaliacao:{signs, status, nota} (rascunho; vira um registro em p.avaliacoes ao finalizar),
//   vasos:{[vaso]:{considerar, nota}}, mapa:{nota, marcas:[]}, documentos:[] (estrutura para as etapas 3 a 6),
//   finalizadoEm.
// historico registra data e hora de cada alteração; alterações seguidas na mesma etapa, em menos
// de 5 minutos, ficam num único registro com a hora da última.

const VASOS = ['Chong Mai','Ren Mai','Du Mai','Dai Mai','Yin Qiao Mai','Yang Qiao Mai','Yin Wei Mai','Yang Wei Mai'];
const ETAPAS = [['anamnese','Anamnese','folha'],['avaliacao','Avaliação energética','yin'],['pentagrama','Pentagrama','estrela'],['sintese','Síntese clínica','camadas'],
  ['mapa','Mapa corporal','corpo'],['plano','Plano terapêutico','plano'],['evolucao','Evolução','evolucao'],['documentos','Documentos','doc']];
const JUNTAR_MS = 5 * 60 * 1000;

const rascunhoDe = p => p.atendimentos.find(a => a.status === 'rascunho') || null;
const atendimentoDe = (p, id) => p.atendimentos.find(a => a.id === id) || null;
const finalizados = p => p.atendimentos.filter(a => a.status === 'finalizado');

// Cria o rascunho. Intensidades começam no último valor de cada queixa ativa; os sinais começam
// nos da última avaliação (o profissional desmarca o que mudou). Sem histórico, tudo começa vazio.
function iniciarAtendimento(p, { id, data }, em){
  const ult = p.avaliacoes.at(-1);
  const intensidades = Object.fromEntries(p.queixas.filter(q => q.ativa).map(q => [q.id, serieQueixa(p, q.id).at(-1)?.valor ?? 5]));
  const a = { id, data, status: 'rascunho', origem: 'sistema', inicio: em, atualizadoEm: em, etapas: [0],
    plano: { pontos: [], tec: [] }, evolucao: { intensidades, nota: '' }, sintese: '',
    avaliacao: { signs: ult ? [...ult.signs] : [], status: ult ? { ...ult.status } : {}, nota: '', ...registroInicial(ult) },
    vasos: {}, mapa: { nota: '', marcas: [] }, documentos: [], avaliacaoId: null,
    historico: [{ em, acao: 'atendimento iniciado' }] };
  p.atendimentos.push(a);
  return a;
}

// Registra uma alteração no histórico (rastreabilidade).
function registrarAlteracao(a, acao, em){
  const fim = a.status === 'finalizado' ? `${acao} (após finalizar)` : acao;
  const u = a.historico.at(-1);
  if (u && u.acao === fim && Date.parse(em) - Date.parse(u.em) < JUNTAR_MS) u.em = em;
  else a.historico.push({ em, acao: fim });
  a.atualizadoEm = em;
}

// Avaliação que o ambiente edita: a do rascunho, ou o registro ligado a um atendimento finalizado.
function avaliacaoEditavel(p, a){
  if (a.status === 'rascunho') return a.avaliacao;
  return p.avaliacoes.find(x => x.id === a.avaliacaoId) || null;
}

// Finaliza: o atendimento entra no prontuário (mesma posição por data que uma sessão do v1) e a
// avaliação energética vira um registro próprio, ligado a ele, se a etapa foi aberta e tem sinais.
function finalizarAtendimento(p, a, em, idAvaliacao){
  if (a.status !== 'rascunho') return a;
  const av = a.avaliacao;
  if (a.etapas.includes(1) && av.signs.length) {
    p.avaliacoes.push({ id: idAvaliacao, date: a.data, signs: [...av.signs], status: { ...av.status }, nota: av.nota || '', ...camposRegistro(av), atendimentoId: a.id,
      historico: [{ em, acao: 'avaliação registrada no atendimento' }] });
    a.avaliacaoId = idAvaliacao;
  }
  delete a.avaliacao;
  a.status = 'finalizado'; a.finalizadoEm = em; a.atualizadoEm = em;
  a.historico.push({ em, acao: 'atendimento finalizado' });
  // Mesma regra do registro de sessão: ordem por data, estável (o mais novo fica depois no mesmo dia).
  p.atendimentos.splice(p.atendimentos.indexOf(a), 1); p.atendimentos.push(a);
  p.atendimentos.sort((x, y) => x.data.localeCompare(y.data));
  return a;
}

function descartarRascunho(p, a){
  if (a?.status !== 'rascunho') return false;
  p.atendimentos.splice(p.atendimentos.indexOf(a), 1);
  return true;
}

// Preenchimento de cada etapa (0 a 1), usado nos anéis do cabeçalho. Indica só o que foi
// registrado; não avalia o conteúdo clínico.
function preenchimento(p, a, i, H){
  const av = avaliacaoEditavel(p, a) || { signs: [], status: {} };
  const vis = a.etapas.includes(i) ? 1 : 0;
  const anam = Object.values(p.anam).filter(Boolean).length / Math.max(1, Object.keys(p.anam).length);
  const dec = H.filter(h => av.status[h.p.id]).length;
  return [Math.min(1, vis * .4 + anam * .6),
    av.signs.length ? .5 + .5 * (H.length ? dec / H.length : 1) : 0,
    vis,
    (Object.values(av.status).includes('aceito') ? .5 : 0) + (a.sintese ? .5 : 0),
    a.plano.pontos.length || a.mapa?.nota || marcasDe(a).length ? 1 : vis * .5,
    (a.plano.pontos.length ? .6 : 0) + (a.plano.tec.length ? .4 : 0),
    vis * .5 + (a.evolucao.nota ? .5 : 0),
    a.status === 'finalizado' ? 1 : vis * .5][i];
}

// Estação do ano pelo mês e hemisfério (contexto sazonal, só informativo).
function estacao(mes, hemisferio = 'Sul'){
  const sul = ['Verão','Verão','Outono','Outono','Outono','Inverno','Inverno','Inverno','Primavera','Primavera','Primavera','Verão'][mes];
  return hemisferio === 'Norte' ? { Verão:'Inverno', Inverno:'Verão', Outono:'Primavera', Primavera:'Outono' }[sul] : sul;
}
const ELEMENTO_ESTACAO = { Primavera:'madeira', Verão:'fogo', Outono:'metal', Inverno:'agua' };

/* ---------- Etapa 3A: registro da avaliação (língua e pulso) ----------
   Campos novos dentro da avaliação (rascunho ou registro em p.avaliacoes), todos opcionais:
     achados:{[sinal]:{sit:'pos'|'neg', orig:'anamnese'|'exame'|'obs'|''}}  (língua e sinais e sintomas)
     pulso:{esq:{cls[],deficiencia,orgao,obs,pos:{cun,guan,chi}}, dir:{...}, semLado:[]}
     linguaObs, bgInterp
   Camada de compatibilidade: av.signs continua sendo a única entrada do cálculo e da exportação v1.
   Entram nela os achados "Positivo" e cada classificação de pulso marcada em pelo menos um lado,
   exatamente como um sinal marcado antes. "Negativo", "Não avaliado", origem e campos escritos não
   entram no cálculo. Avaliações antigas (só signs) são lidas sem conversão: os sinais viram achados
   positivos de origem não informada e as classificações de pulso ficam "sem lado" até o profissional
   registrá-las num lado. */
const ORIGENS_ACHADO = [['anamnese','Anamnese'],['exame','Exame'],['obs','Observação profissional']];
const SITUACOES_ACHADO = [['pos','Positivo'],['neg','Negativo'],['na','Não avaliado']];
const LADOS_PULSO = [['esq','Pulso esquerdo'],['dir','Pulso direito']];
const POSICOES_PULSO = [['cun','Cun'],['guan','Guan'],['chi','Chi']];
const ehPulso = k => k.startsWith('pulso_');
const ladoVazio = () => ({ cls: [], deficiencia: '', orgao: '', obs: '', pos: { cun: '', guan: '', chi: '' } });

// Visão do registro sem alterar a avaliação (para desenhar a tela).
function registroDe(av){
  const achados = av.achados ? av.achados : Object.fromEntries(av.signs.filter(k => !ehPulso(k)).map(k => [k, { sit: 'pos', orig: '' }]));
  const pulso = av.pulso ? av.pulso : { esq: ladoVazio(), dir: ladoVazio(), semLado: av.signs.filter(ehPulso) };
  return { achados, pulso, linguaObs: av.linguaObs || '', bgInterp: av.bgInterp || '' };
}
// Materializa o registro na avaliação antes da primeira alteração.
function garantirRegistro(av){
  const r = registroDe(av);
  if (!av.achados) av.achados = JSON.parse(JSON.stringify(r.achados));
  if (!av.pulso) av.pulso = JSON.parse(JSON.stringify(r.pulso));
  av.pulso.semLado ||= [];
  return av;
}
// Mantém av.signs coerente, preservando a ordem em que os sinais foram marcados.
function sincronizar(av, k, presente){
  const i = av.signs.indexOf(k);
  if (presente && i < 0) av.signs.push(k);
  else if (!presente && i >= 0) av.signs.splice(i, 1);
}
const pulsoPresente = (av, k) => ['esq','dir'].some(l => av.pulso[l].cls.includes(k)) || av.pulso.semLado.includes(k);

// Toque no achado: não avaliado → positivo → negativo → não avaliado.
function alternarAchado(av, k, origemPadrao){
  garantirRegistro(av);
  const cur = av.achados[k], prox = { na: 'pos', pos: 'neg', neg: 'na' }[cur?.sit || 'na'];
  if (prox === 'na') delete av.achados[k]; else av.achados[k] = { sit: prox, orig: cur ? cur.orig : origemPadrao };
  sincronizar(av, k, prox === 'pos');
}
function definirAchado(av, k, campo, valor){
  garantirRegistro(av);
  if (campo === 'sit'){ if (valor === 'na') delete av.achados[k]; else (av.achados[k] ||= { sit: valor, orig: '' }).sit = valor; sincronizar(av, k, valor === 'pos'); }
  else if (av.achados[k]) av.achados[k].orig = valor;
}
// Classificação de pulso num lado (esq, dir ou semLado, este último só para retirar).
function alternarPulso(av, lado, k){
  garantirRegistro(av);
  const L = av.pulso[lado], i = L.cls ? L.cls.indexOf(k) : L.indexOf(k), lista = L.cls || L;
  if (i < 0) lista.push(k); else lista.splice(i, 1);
  sincronizar(av, k, pulsoPresente(av, k));
}
function definirPulso(av, caminho, valor){
  garantirRegistro(av);
  const k = caminho.split('.'), u = k.pop(); k.reduce((o, x) => o[x], av.pulso)[u] = valor;
}
// Cópia do registro de uma avaliação anterior para um novo atendimento: situação e origem dos
// achados e classificações de pulso; os campos escritos começam vazios.
function registroInicial(ult){
  if (!ult || !ult.achados || !ult.pulso) return {};
  const lado = l => ({ ...ladoVazio(), cls: [...ult.pulso[l].cls] });
  return { achados: JSON.parse(JSON.stringify(ult.achados)), pulso: { esq: lado('esq'), dir: lado('dir'), semLado: [...(ult.pulso.semLado || [])] } };
}
const CAMPOS_REGISTRO = ['achados','pulso','linguaObs','bgInterp','categorias','interp'];
const camposRegistro = av => Object.fromEntries(CAMPOS_REGISTRO.filter(k => av[k] !== undefined).map(k => [k, JSON.parse(JSON.stringify(av[k]))]));

/* ---------- Etapa 3B: achados livres por categoria ----------
   av.categorias:{[cat]:{nota, itens:[{id, texto, orig, sit, sintese, plano, em}]}}
   Só registro do profissional: nada entra no cálculo, nada é sugerido e nada é encaminhado sozinho.
   A Síntese e o Plano mostram só os itens marcados pelo profissional. A lista clínica de cada
   categoria será definida pela profissional; até lá, os achados são escritos livremente. */
const CATEGORIAS = [['zangfu','Zang-Fu'],['qixue','Qi e Xue'],['jinye','Jin Ye'],['jingshen','Jing e Shen'],['fatores','Fatores patogênicos']];
const catVazia = () => ({ nota: '', itens: [] });
const categoriaDe = (av, c) => av.categorias?.[c] || catVazia();
const garantirCat = (av, c) => ((av.categorias ||= {})[c] ||= catVazia());
function adicionarAchadoLivre(av, c, { id, texto, orig, sit }, em){
  const it = { id, texto, orig, sit, sintese: false, plano: false, em };
  garantirCat(av, c).itens.push(it);
  return it;
}
const itemLivre = (av, c, id) => av.categorias?.[c]?.itens.find(x => x.id === id) || null;
function definirAchadoLivre(av, c, id, campo, valor){
  const it = itemLivre(av, c, id); if (!it) return null;
  if (campo === 'sintese' || campo === 'plano') it[campo] = !!valor; else it[campo] = valor;
  return it;
}
function removerAchadoLivre(av, c, id){
  const L = av.categorias?.[c]?.itens, i = L ? L.findIndex(x => x.id === id) : -1;
  return i < 0 ? null : L.splice(i, 1)[0];
}
function notaCategoria(av, c, texto){ garantirCat(av, c).nota = texto; }
// Itens que o profissional levou para a Síntese ou para o Plano, por categoria.
const encaminhados = (av, destino) => CATEGORIAS.map(([c, nome]) => [c, nome, categoriaDe(av, c).itens.filter(x => x[destino])]).filter(x => x[2].length);

/* ---------- Etapa 3C: vasos extraordinários ----------
   Decisão de 04/11: os vasos não são achado de avaliação; são opções de tratamento, mostradas no Plano
   como dicas, com os pares de abertura e acoplado conferidos pela profissional.
   a.vasos:{[vaso]:{considerar (par incluído no plano pelo profissional), nota}}. A indicação automática
   depende dos critérios clínicos da profissional; até lá nada é sugerido. */
const PARES_VASOS = [['Du Mai','ID3','B62'],['Ren Mai','P7','R6'],['Chong Mai','BP4','CS6'],['Dai Mai','VB41','TA5'],
  ['Yin Qiao Mai','R6','P7'],['Yang Qiao Mai','B62','ID3'],['Yin Wei Mai','CS6','BP4'],['Yang Wei Mai','TA5','VB41']];
const vasoDe = (a, v) => ({ nota: '', considerar: false, ...(a.vasos?.[v] || {}) });
function definirVaso(a, v, campo, valor){
  const x = ((a.vasos ||= {})[v] ||= { considerar: false, nota: '' });
  x[campo] = campo === 'considerar' ? !!valor : valor;
  return x;
}

/* ---------- Etapa 3C: versões da avaliação ----------
   Cada registro em p.avaliacoes é uma versão; nenhuma é sobrescrita por uma nova avaliação.
   A basal (a primeira por data) fica bloqueada. Uma versão ligada a um atendimento finalizado pode
   ser corrigida: antes da primeira alteração, os valores anteriores ficam guardados no histórico. */
const versoesDe = p => p.avaliacoes.map((v, i) => [v, i]).sort((x, y) => x[0].date.localeCompare(y[0].date) || x[1] - y[1]).map(x => x[0]);
const basalDe = p => versoesDe(p)[0] || null;
const ehBasal = (p, av) => !!av && basalDe(p) === av;
const CAMPOS_VERSAO = ['signs','status','nota','achados','pulso','linguaObs','bgInterp','categorias','interp'];
const fotoVersao = av => JSON.parse(JSON.stringify(Object.fromEntries(CAMPOS_VERSAO.filter(k => av[k] !== undefined).map(k => [k, av[k]]))));
function registrarCorrecao(av, anterior, em, motivo = ''){
  (av.historico ||= []).push({ em, acao: `correção registrada${motivo ? '. Motivo: ' + motivo : ''}; valores anteriores preservados`, anterior });
}

/* ---------- Mapa corporal (etapa 4A) ----------
   Cada marcação fica no atendimento em que foi feita (a.mapa.marcas) e passa para o prontuário com ele
   ao finalizar. Depois de finalizado, as marcações não mudam mais: o atendimento seguinte só as mostra
   para comparar. x e y são frações (0 a 1) do desenho da vista; o lado é sempre o do paciente.
   Marcação: {id, tipo, vista, face, x, y, x2?, y2? (destino da irradiação), lado, intensidade (0 a 10
   ou null; não existe no procedimento), procedimento, regiao, nota, data, criadaEm}. */
const TIPOS_MARCA = [['dor','Dor'],['sintoma','Outro sintoma'],['irradiacao','Irradiação'],['limitacao','Limitação funcional'],['procedimento','Procedimento']];
const LADOS_MARCA = [['dir','Direito'],['esq','Esquerdo'],['bil','Bilateral'],['na','Não se aplica']];
const marcaComIntensidade = t => t !== 'procedimento';
const marcasDe = a => a?.mapa?.marcas || [];
const fracao = v => Math.min(1, Math.max(0, +Number(v).toFixed(4)));
const EDITAVEIS_MARCA = ['tipo','lado','intensidade','procedimento','regiao','nota'];

function adicionarMarca(a, m, em){
  if (a.status !== 'rascunho' || !TIPOS_MARCA.some(t => t[0] === m.tipo)) return null;
  const mp = a.mapa ||= { nota: '' }; mp.marcas ||= [];
  const nova = { id: m.id, tipo: m.tipo, vista: m.vista, face: m.face || '', x: fracao(m.x), y: fracao(m.y),
    lado: LADOS_MARCA.some(l => l[0] === m.lado) ? m.lado : 'na', intensidade: null, procedimento: '', regiao: '', nota: '', data: a.data, criadaEm: em };
  if (m.tipo === 'irradiacao' && m.x2 != null) { nova.x2 = fracao(m.x2); nova.y2 = fracao(m.y2); }
  mp.marcas.push(nova);
  return nova;
}
function editarMarca(a, id, campo, valor){
  const m = a.status === 'rascunho' && marcasDe(a).find(x => x.id === id);
  if (!m) return null;
  if (campo === 'destino') { if (m.tipo !== 'irradiacao') return null; m.x2 = fracao(valor[0]); m.y2 = fracao(valor[1]); return m; }
  if (!EDITAVEIS_MARCA.includes(campo)) return null;
  if (campo === 'intensidade') { if (!marcaComIntensidade(m.tipo)) return null; m.intensidade = valor == null || valor === '' ? null : Math.min(10, Math.max(0, Math.round(Number(valor)))); return m; }
  if (campo === 'tipo') {
    if (!TIPOS_MARCA.some(t => t[0] === valor)) return null;
    m.tipo = valor;
    if (!marcaComIntensidade(valor)) m.intensidade = null;
    if (valor !== 'irradiacao') { delete m.x2; delete m.y2; }
    return m;
  }
  if (campo === 'lado' && !LADOS_MARCA.some(l => l[0] === valor)) return null;
  m[campo] = String(valor ?? '');
  return m;
}
function removerMarca(a, id){
  if (a.status !== 'rascunho') return false;
  const L = marcasDe(a), i = L.findIndex(x => x.id === id);
  if (i < 0) return false;
  L.splice(i, 1);
  return true;
}
// Atendimentos finalizados antes deste, do mais antigo ao mais recente (para comparar).
function atendimentosAnteriores(p, a){
  const F = finalizados(p), i = F.indexOf(a);
  return i >= 0 ? F.slice(0, i) : F.filter(x => x.data <= a.data);
}
//
// Os pontos continuam em a.plano.pontos (lista de códigos), que é o que o cálculo, a verificação de
// segurança e a exportação v1 leem. Para cada ponto o profissional registra só:
//   lado: 'bil' (bilateral) | 'uni' (unilateral) | 'med' (linha média, VC e VG)
//   status: 'plan' (planejado) | 'real' (realizado) | 'nao' (não realizado), com motivo opcional.
// Fica em a.plano.rx = {[código]:{lado, status, motivo}}, criado só quando algo é marcado: ponto sem
// registro é bilateral (linha média para VC e VG) e planejado. a.plano.orient guarda as orientações
// para casa. a.evolucao.situacoes = {[queixa]: 'melhora'|'estavel'|'piora'|'resolvida'|'nova'} é
// escolha do profissional: nada é calculado nem sugerido a partir das intensidades.
// Depois de finalizado, mudar o lado ou a situação de um ponto é uma correção: exige motivo e fica em
// a.retificacoes com o valor anterior, o novo, quem, quando e o motivo.

const LADOS_RX = [['bil','Bilateral'],['uni','Unilateral'],['med','Linha média']];
const STATUS_RX = [['plan','Planejado'],['real','Realizado'],['nao','Não realizado']];
const SITUACOES_QUEIXA = [['melhora','Melhora'],['estavel','Estável'],['piora','Piora'],['resolvida','Resolvida'],['nova','Nova']];
const nomeRx = (L, k) => (L.find(x => x[0] === k) || ['', '—'])[1];
const linhaMedia = c => /^V[CG]\d+$/.test(c);

const linhaRx = (a, c) => ({ lado: linhaMedia(c) ? 'med' : 'bil', status: 'plan', motivo: '', ...(a.plano.rx?.[c] || {}) });
const linhasRx = a => a.plano.pontos.map(c => [c, linhaRx(a, c)]);
function gravarRx(a, c, campos){
  if (!a.plano.pontos.includes(c)) return null;
  const r = (a.plano.rx ||= {})[c] ||= {};
  Object.assign(r, campos);
  return linhaRx(a, c);
}
function definirLado(a, c, lado){
  if (linhaMedia(c) || !['bil','uni'].includes(lado)) return null;
  return gravarRx(a, c, { lado });
}
function definirStatus(a, c, status){
  if (!STATUS_RX.some(s => s[0] === status)) return null;
  return gravarRx(a, c, status === 'nao' ? { status } : { status, motivo: '' });
}
function definirMotivo(a, c, motivo){
  if (linhaRx(a, c).status !== 'nao') return null;
  return gravarRx(a, c, { motivo: String(motivo || '') });
}
// Marca como realizados só os pontos ainda planejados.
function todosRealizados(a){
  const L = a.plano.pontos.filter(c => linhaRx(a, c).status === 'plan');
  L.forEach(c => gravarRx(a, c, { status: 'real' }));
  return L;
}
// Ao tirar um ponto do plano, o registro dele sai junto.
function esquecerPonto(a, c){
  if (a.plano.rx) delete a.plano.rx[c];
}
const contagemRx = a => STATUS_RX.map(([k, n]) => [k, n, linhasRx(a).filter(([, l]) => l.status === k).length]);

function definirSituacao(a, idQueixa, sit){
  const S = a.evolucao.situacoes ||= {};
  if (!sit || S[idQueixa] === sit) delete S[idQueixa];
  else if (SITUACOES_QUEIXA.some(s => s[0] === sit)) S[idQueixa] = sit;
  return S[idQueixa] || '';
}

// Correção de um ponto num atendimento finalizado. Devolve as mudanças [campo, antes, depois] ou null.
function corrigirPonto(a, c, { lado, status }, motivo, por, em){
  const m = String(motivo || '').trim();
  if (a.status !== 'finalizado' || !m || !a.plano.pontos.includes(c)) return null;
  const antes = linhaRx(a, c), depois = { lado: linhaMedia(c) ? 'med' : lado || antes.lado, status: status || antes.status };
  if (!['bil','uni','med'].includes(depois.lado) || !STATUS_RX.some(s => s[0] === depois.status)) return null;
  const mud = [['Lado', 'lado', LADOS_RX], ['Situação', 'status', STATUS_RX]].filter(([, k]) => antes[k] !== depois[k]).map(([n, k, L]) => [n, nomeRx(L, antes[k]), nomeRx(L, depois[k])]);
  if (!mud.length) return null;
  gravarRx(a, c, depois.status === 'nao' ? depois : { ...depois, motivo: '' });
  (a.retificacoes ||= []).unshift({ em, por, ponto: c, mud, motivo: m });
  return mud;
}
//
// O profissional escolhe o paciente e o modelo; o texto vem preenchido com os dados já registrados
// conforme o modelo. Os modelos são editados na própria página (pedido do Maicon em 05/11, proposta/modelos),
// com os dados do sistema entre chaves ({paciente}, {data}...). Ao guardar, o texto vai para o prontuário:
//   p.documentos = [{id, modelo, nome, assina, texto, em, por, assinado?, assinadoEm?, assinadoPor?}] (mais recente
//   primeiro), criado só quando o primeiro documento é guardado. Não entra na exportação v1.
// Nada é concluído pelo sistema: o registro do atendimento só repete o que foi marcado.

const CLINICA = 'Spazio Stabilità';
// Modelos que vêm com o sistema: [chave, nome, ícone, pede assinatura do paciente, texto com os dados entre chaves]
const MODELOS_DOC = [
  ['termo', 'Termo de consentimento', 'assinatura', true, 'Eu, {paciente}, declaro que fui informado(a) por {profissional} sobre o tratamento com acupuntura e técnicas associadas, seus objetivos e possíveis reações, e que tive minhas dúvidas esclarecidas.\n\nInformei corretamente minhas condições de saúde e os medicamentos em uso, e sei que posso interromper o tratamento quando quiser.'],
  ['declaracao', 'Declaração de comparecimento', 'doc_id', false, 'Declaro, para os devidos fins, que {paciente} esteve em atendimento na {clinica} no dia {data}, {horario}.'],
  ['orientacoes', 'Orientações para casa', 'folha', false, '{orientacoes}'],
  ['registro', 'Registro do atendimento', 'doc', false, '{registro}']
];
// Dados que o sistema preenche no texto: [campo, rótulo do botão]
const CAMPOS_DOC = [['paciente','Paciente'], ['cpf','CPF do paciente'], ['data','Data de hoje'], ['horario','Horário de hoje'], ['profissional','Profissional'], ['clinica','Clínica'], ['orientacoes','Orientações do atendimento'], ['registro','Registro do atendimento']];

// Modelos editados ou criados pelo profissional ficam em db.modelosDoc (criado só no primeiro salvar):
//   { termo:{nome, texto, assina, em, por}, m1:{nome, texto, assina, proprio:true, em, por}, ... }
// Um modelo do sistema editado guarda só a sua versão; "voltar ao original" apaga essa versão.
// Lista de modelos: [chave, nome, ícone, assina, texto, situação] com situação 'original' | 'editado' | 'proprio'.
function modelosDoc(M = {}){
  const base = MODELOS_DOC.map(([k, n, i, a, t]) => M[k] ? [k, M[k].nome, i, M[k].assina, M[k].texto, 'editado'] : [k, n, i, a, t, 'original']);
  return base.concat(Object.entries(M).filter(([, m]) => m.proprio).map(([k, m]) => [k, m.nome, 'doc', m.assina, m.texto, 'proprio']));
}
const modeloDoc = (k, M) => modelosDoc(M).find(m => m[0] === k) || null;

// Salva o modelo como do profissional. Sem chave, cria um novo. Salvar o texto igual ao original volta ao original.
function salvarModelo(db, k, { nome, texto, assina }, em, por, novoId){
  nome = String(nome || '').trim(); texto = String(texto || '').trim();
  if (!nome || !texto) return null;
  const orig = MODELOS_DOC.find(m => m[0] === k), M = db.modelosDoc ||= {};
  if (orig && orig[1] === nome && orig[3] === !!assina && orig[4] === texto) { delete M[k]; return k; }
  if (!k) { k = novoId; M[k] = { nome, texto, assina: !!assina, proprio: true, em, por }; return k; }
  if (!orig && !M[k]?.proprio) return null;
  M[k] = { ...M[k], nome, texto, assina: !!assina, em, por };
  return k;
}
// Volta um modelo do sistema ao texto original.
const voltarOriginal = (db, k) => { if (db.modelosDoc?.[k] && !db.modelosDoc[k].proprio) { delete db.modelosDoc[k]; return true; } return false; };
// Apaga um modelo criado pelo profissional. Documentos já guardados continuam no prontuário.
const apagarModelo = (db, k) => { if (db.modelosDoc?.[k]?.proprio) { delete db.modelosDoc[k]; return true; } return false; };

// Último atendimento (rascunho ou finalizado) com orientações escritas.
const comOrientacao = p => [...p.atendimentos].reverse().find(a => (a.plano?.orient || '').trim());

function registroDoc(p){
  const a = finalizados(p).at(-1); if (!a) return '';
  // Sem situação marcada em nenhum ponto (atendimentos antigos), lista os pontos registrados sem dizer se foram feitos.
  const marcado = !!a.plano.rx && Object.keys(a.plano.rx).length > 0, desc = ([c, l]) => `${c} (${nomeRx(LADOS_RX, l.lado).toLowerCase()})`;
  const feitos = linhasRx(a).filter(([, l]) => !marcado || l.status === 'real').map(desc);
  const sit = Object.entries(a.evolucao?.situacoes || {}).map(([q, s]) => [p.queixas.find(x => x.id === q)?.descricao, s]).filter(([q]) => q).map(([q, s]) => `${q} (${nomeRx(SITUACOES_QUEIXA, s).toLowerCase()})`);
  return [`Atendimento de ${fmt(a.data)}${a.plano.tec.length ? ` · ${a.plano.tec.join(', ')}` : ''}.`,
    feitos.length ? `${marcado ? 'Pontos realizados' : 'Pontos registrados'}: ${feitos.join('; ')}.` : marcado ? 'Nenhum ponto marcado como realizado.' : '',
    sit.length ? `Queixas: ${sit.join('; ')}.` : ''].filter(Boolean).join('\n\n');
}
// Valores dos dados para o paciente.
function valoresDoc(p, { appts = [], hoje, prof }){
  const h = horariosDoDia(appts, hoje).find(a => a.pid === p.id && a.st !== 'faltou');
  return { paciente: p.name, cpf: p.cadastro?.cpf || '', data: fmt(hoje), horario: h ? `das ${h.time} às ${fimHorario(h)}` : '', profissional: prof, clinica: CLINICA,
    orientacoes: comOrientacao(p)?.plano.orient.trim() || '', registro: registroDoc(p) };
}
// Preenche o texto. Um dado sem valor some junto com a vírgula ou o espaço antes dele; chaves desconhecidas ficam como estão.
function preencherDoc(texto, v){
  return texto.replace(/(,? ?)\{(\w+)\}/g, (m, pre, k) => !(k in v) ? m : v[k] ? pre + v[k] : '').trim();
}
// Texto do modelo para o paciente, em parágrafos separados por linha em branco.
function textoModelo(k, p, ctx, M){
  const m = modeloDoc(k, M);
  return m ? preencherDoc(m[4], valoresDoc(p, ctx)) : '';
}
// Por que o modelo veio vazio (para dizer na tela).
const faltaModelo = k => ({ orientacoes:'Nenhum atendimento com orientações para casa ainda.', registro:'Nenhum atendimento finalizado ainda.' })[k] || '';

// Guarda o texto como ficou, com o nome do modelo e se pede assinatura (o modelo pode mudar ou ser apagado depois).
function guardarDocumento(p, { id, modelo, texto, em, por }, M){
  const t = String(texto || '').trim(), m = modeloDoc(modelo, M);
  if (!m || !t) return null;
  const d = { id, modelo, nome: m[1], assina: m[3], texto: t, em, por };
  (p.documentos ||= []).unshift(d);
  return d;
}
// Assinatura na tela (etapa 7B, aprovada pelo Maicon em 05/11, proposta/etapa-7): o paciente assina com o
// dedo e a imagem fica no documento guardado, com quando e quem conduziu. É uma assinatura eletrônica
// simples; o papel continua valendo (marcarAssinado).
const ASSINATURA_IMG = /^data:image\/png;base64,[A-Za-z0-9+/=]+$/;
function assinarNaTela(p, id, { img, em, por }){
  const d = (p.documentos || []).find(x => x.id === id);
  if (!d || d.assinado || !(d.assina ?? modeloDoc(d.modelo)?.[3]) || !ASSINATURA_IMG.test(String(img || ''))) return null;
  Object.assign(d, { assinado: true, assinadoEm: em, assinadoPor: por, naTela: true, assinatura: img });
  return d;
}
// Termo assinado no papel: fica registrado quem marcou e quando.
function marcarAssinado(p, id, em, por){
  const d = (p.documentos || []).find(x => x.id === id);
  if (!d || d.assinado || !(d.assina ?? modeloDoc(d.modelo)?.[3])) return null;
  Object.assign(d, { assinado: true, assinadoEm: em, assinadoPor: por });
  return d;
}

const ALERTA_NOME = {gestante:'Gestante',anticoagulante:'Anticoagulante',marcapasso:'Marcapasso'};
const alertasDe = p => Object.keys(ALERTA_NOME).filter(k=>p.alerts[k]).map(k=>ALERTA_NOME[k]);
const diasDesde = d => Math.round((new Date(TODAY+'T12:00')-new Date(d+'T12:00'))/864e5);
// Melhora da queixa principal em %, comparando a primeira e a última EVA registradas.
const melhoraPct = s => s.length>1 && s[0] ? Math.round((s[0]-s.at(-1))/s[0]*100) : null;

// Pacientes que precisam de acompanhamento, com o motivo de cada um.
// Retorno: última sessão há mais de 21 dias e nenhum agendamento futuro (mesmo critério das pendências da etapa 1B).
function acompanhamento(){
  return db.patients.map(p=>{ const m=[], l=p.sessions.at(-1), s=p.sessions.map(x=>x.eva);
    if(l && l.date<TODAY && diasDesde(l.date)>21 && !db.appts.some(a=>ativo(a)&&a.pid===p.id && a.date>=TODAY)) m.push(['retorno','warn',`sem retorno há ${diasDesde(l.date)} dias`]);
    if(!p.assess.length) m.push(['yin','acc','sem avaliação energética']);
    if(s.length>=2 && s.at(-1)>=s[0]) m.push(['queda','crit','sem melhora desde a 1ª sessão']);
    return {p,m}; }).filter(x=>x.m.length);
}
// Notificações: alertas de segurança de pacientes de hoje, agendamentos passados sem conclusão e acompanhamento.
function notificacoes(){
  const N=[], hoje=db.appts.filter(ativo).filter(a=>a.date===TODAY);
  [...new Set(hoje.map(a=>a.pid))].map(patient).filter(p=>p && alertasDe(p).length)
    .forEach(p=>N.push({k:'al-'+p.id,i:'escudo',t:'crit',titulo:`Alerta de segurança: ${p.name}`,txt:alertasDe(p).join(', ')+' · atendimento hoje',pid:p.id}));
  db.appts.filter(ativo).filter(a=>a.date<TODAY && !a.done && a.st!=='faltou').forEach(a=>N.push({k:'at-'+a.id,i:'relogio',t:'warn',titulo:'Agendamento sem conclusão',txt:`${patient(a.pid)?.name||''} · ${fmt(a.date)} ${a.time}`,href:'#agenda'}));
  acompanhamento().forEach(({p,m})=>N.push({k:'ac-'+p.id,i:m[0][0],t:m[0][1],titulo:p.name,txt:m.map(x=>x[2]).join(' · '),pid:p.id}));
  return N;
}

const NUVEM = { url:'https://lmucimqjrzjewfyhcfoh.supabase.co', chave:'sb_publishable_kRmZNwp0_Xq4jPPMgTzKKA_SyLsreZS' };
const KEY_SESSAO = 'musubi-sessao';

// Mensagens do servidor em português, para mostrar direto na tela.
const MSG_NUVEM = {
  invalid_credentials:'E-mail ou senha incorretos.',
  email_not_confirmed:'Falta confirmar o e-mail. Abra o link que mandamos para a sua caixa de entrada.',
  user_already_exists:'Já existe uma conta com esse e-mail. Use "Entrar".',
  email_exists:'Já existe uma conta com esse e-mail. Use "Entrar".',
  weak_password:'Senha fraca. Use pelo menos 8 caracteres, misturando letras e números.',
  over_email_send_rate_limit:'Muitos e-mails em pouco tempo. Espere alguns minutos e tente de novo.',
  over_request_rate_limit:'Muitas tentativas em pouco tempo. Espere um pouco e tente de novo.',
  validation_failed:'Confira o e-mail e a senha.',
  sem_acesso:'Sua conta não tem acesso a esta clínica.',
  sem_login:'Entre de novo para continuar.'
};
const ErroNuvem = class extends Error { constructor(msg, codigo, status){ super(msg); this.codigo = codigo; this.status = status; } };
const erroDe = (status, corpo) => {
  const cod = corpo?.error_code || corpo?.code || corpo?.error || '', txt = String(corpo?.message || corpo?.msg || corpo?.error_description || '');
  const chave = Object.keys(MSG_NUVEM).find(k => cod === k || txt.includes(k));
  return new ErroNuvem(chave ? MSG_NUVEM[chave] : status === 401 ? MSG_NUVEM.sem_login : 'O servidor não respondeu como esperado. Tente de novo.', chave || cod || String(status), status);
};

// f = fetch, mem = armazenamento (localStorage), agora = relógio em ms. Tudo injetável para os testes.
function criarNuvem({ url = NUVEM.url, chave = NUVEM.chave, f = (...a) => fetch(...a), mem = localStorage, agora = () => Date.now() } = {}){
  const lerSessao = () => { try { return JSON.parse(mem.getItem(KEY_SESSAO)) || null; } catch (e) { return null; } };
  const gravarSessao = s => { try { s ? mem.setItem(KEY_SESSAO, JSON.stringify(s)) : mem.removeItem(KEY_SESSAO); } catch (e) {} };
  let sessao = lerSessao();

  const chamar = async (caminho, { metodo = 'GET', corpo, token, cab = {} } = {}) => {
    let r;
    try { r = await f(url + caminho, { method:metodo, headers:{ apikey:chave, 'Content-Type':'application/json', ...(token ? { Authorization:'Bearer ' + token } : {}), ...cab }, body:corpo === undefined ? undefined : JSON.stringify(corpo) }); }
    catch (e) { throw new ErroNuvem('Sem conexão com o servidor. Confira a internet; o que você fizer fica guardado neste aparelho.', 'offline', 0); }
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
    if (!r.ok) throw erroDe(r.status, j);
    return j;
  };
  const guardar = j => {
    sessao = { access_token:j.access_token, refresh_token:j.refresh_token, expira:agora() + (Number(j.expires_in) || 3600) * 1000, user:{ id:j.user?.id, email:j.user?.email, nome:j.user?.user_metadata?.nome || '' } };
    gravarSessao(sessao); return sessao;
  };
  // Token válido, renovando um minuto antes de vencer. Sem sessão, ou renovação recusada: sai.
  const token = async () => {
    if (!sessao) throw new ErroNuvem(MSG_NUVEM.sem_login, 'sem_login', 401);
    if (sessao.expira - agora() > 60000) return sessao.access_token;
    try { return guardar(await chamar('/auth/v1/token?grant_type=refresh_token', { metodo:'POST', corpo:{ refresh_token:sessao.refresh_token } })).access_token; }
    catch (e) { if (e.codigo !== 'offline') { sessao = null; gravarSessao(null); } throw e; }
  };
  const rest = async (caminho, op = {}) => chamar('/rest/v1/' + caminho, { ...op, token:await token() });

  return {
    sessao:() => sessao,
    entrar:async (email, senha) => guardar(await chamar('/auth/v1/token?grant_type=password', { metodo:'POST', corpo:{ email:email.trim(), password:senha } })),
    // Devolve a sessão, ou {confirmar:true} quando o servidor pede para confirmar o e-mail antes.
    criarConta:async (email, senha, nome, voltarPara) => {
      const j = await chamar('/auth/v1/signup' + (voltarPara ? '?redirect_to=' + encodeURIComponent(voltarPara) : ''), { metodo:'POST', corpo:{ email:email.trim(), password:senha, data:{ nome:nome.trim() } } });
      return j?.access_token ? guardar(j) : { confirmar:true };
    },
    esqueci:async (email, voltarPara) => { await chamar('/auth/v1/recover' + (voltarPara ? '?redirect_to=' + encodeURIComponent(voltarPara) : ''), { metodo:'POST', corpo:{ email:email.trim() } }); return true; },
    // Sessão que chega no endereço depois de confirmar o e-mail ou pedir nova senha (#access_token=...).
    sessaoDoLink:hash => {
      const p = new URLSearchParams(String(hash || '').replace(/^#/, ''));
      if (!p.get('access_token')) return null;
      const s = guardar({ access_token:p.get('access_token'), refresh_token:p.get('refresh_token'), expires_in:p.get('expires_in'), user:{} });
      return { sessao:s, tipo:p.get('type') || '' };
    },
    completarUsuario:async () => { const u = await chamar('/auth/v1/user', { token:await token() }); sessao.user = { id:u.id, email:u.email, nome:u.user_metadata?.nome || '' }; gravarSessao(sessao); return sessao.user; },
    trocarSenha:async senha => { await chamar('/auth/v1/user', { metodo:'PUT', corpo:{ password:senha }, token:await token() }); return true; },
    sair:async () => { const t = sessao?.access_token; sessao = null; gravarSessao(null); if (t) { try { await chamar('/auth/v1/logout', { metodo:'POST', token:t }); } catch (e) {} } },
    minhasClinicas:async () => (await rest(`membros?select=perfil,nome,clinicas(id,nome,cidade,uf)&user_id=eq.${sessao.user.id}&ativo=is.true`) || [])
      .filter(m => m.clinicas).map(m => ({ id:m.clinicas.id, nome:m.clinicas.nome, cidade:m.clinicas.cidade, uf:m.clinicas.uf, perfil:m.perfil })),
    criarClinica:async ({ nome, cidade, uf, nomePessoa }, doc) => rest('rpc/criar_clinica', { metodo:'POST', corpo:{ p_nome:nome, p_cidade:cidade, p_uf:uf, p_nome_pessoa:nomePessoa, p_doc:doc } }),
    baixar:async clinica => { const L = await rest(`dados?select=doc,versao&clinica_id=eq.${clinica}`); return L?.[0] || null; },
    salvar:async (clinica, doc, versao) => rest('rpc/salvar_dados', { metodo:'POST', corpo:{ p_clinica:clinica, p_doc:doc, p_versao:versao } }),
    // Página de apresentação: pedido de contato sem login (a lista só o dono do MUSUBI lê).
    pedirContato:async (nome, whats) => { await chamar('/rest/v1/interessados', { metodo:'POST', corpo:{ nome:nome.trim(), whats:whats.trim() }, cab:{ Prefer:'return=minimal' } }); return true; }
  };
}

// Mantém o documento da clínica igual no aparelho e no servidor. marcar() depois de cada mudança:
// espera um pouco e envia. Se outro aparelho salvou antes, guarda uma cópia do que estava aqui,
// traz a versão do servidor e avisa. Sem internet, fica pendente e tenta de novo depois.
function criarSincronia({ nuvem, clinica, obter, aplicar, aoMudar = () => {}, mem = localStorage, espera = 1500, relogio = { definir:(fn, ms) => setTimeout(fn, ms), limpar:h => clearTimeout(h) }, agora = () => new Date().toISOString() }){
  let versao = 0, pendente = false, enviando = false, h = null, estado = 'carregando';
  const mudar = (e, extra) => { estado = e; aoMudar(e, extra); };
  const enviar = async () => {
    h = null; if (enviando) { pendente = true; return; }
    enviando = true; pendente = false; mudar('salvando');
    try {
      const v = await nuvem.salvar(clinica, obter(), versao);
      if (v > 0) { versao = v; mudar('salvo'); }
      else {
        const copia = 'musubi-v2-conflito-' + agora();
        try { mem.setItem(copia, JSON.stringify(obter())); } catch (e) {}
        const r = await nuvem.baixar(clinica); versao = r.versao; aplicar(r.doc);
        mudar('conflito', { copia });
      }
    } catch (e) { pendente = true; mudar(e.codigo === 'offline' ? 'offline' : 'erro', { msg:e.message }); }
    finally { enviando = false; if (pendente && estado !== 'offline' && estado !== 'erro') marcar(); }
  };
  const marcar = () => { pendente = true; if (h) relogio.limpar(h); h = relogio.definir(enviar, espera); };
  return {
    estado:() => estado, versao:() => versao, pendente:() => pendente,
    iniciar:async () => { const r = await nuvem.baixar(clinica); if (!r) throw new Error('Clínica sem dados no servidor.'); versao = r.versao; aplicar(r.doc); mudar('salvo'); return r; },
    marcar, agora:enviar,
    tentarDeNovo:() => { if (pendente) marcar(); }
  };
}
// primeiro acesso da clínica (levando os dados deste aparelho ou começando do zero); depois disso,
// mantém os dados iguais no aparelho e no servidor e mostra no topo se está tudo salvo.
// No computador de desenvolvimento e no arquivo aberto do disco o sistema segue sem conta, como antes,
// a não ser que o modo servidor seja escolhido (musubi-modo = nuvem).

const KEY_MODO = 'musubi-modo', KEY_CLINICA = 'musubi-clinica', KEY_CACHE_DE = 'musubi-v2-clinica';
const UFS_BR = 'AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
const lerC = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const gravarC = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const voltarAoSite = () => location.origin + location.pathname;

// Estado da conta: modo 'local' (sem conta) ou 'nuvem'; tela de acesso aberta (ou null); clínica atual.
const conta = { modo:'local', tela:null, msg:'', erro:'', ocupado:false, nuvem:null, clinica:null, clinicas:[], sinc:null, estado:'', levar:true };
let aoMudarConta = () => {};

const modoInicial = () => {
  const m = lerC(KEY_MODO); if (m === 'local' || m === 'nuvem') return m;
  return location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname) ? 'local' : 'nuvem';
};

// Chamado uma vez ao abrir o sistema. render = redesenhar o sistema.
function iniciarConta(render, nuvem){
  aoMudarConta = render; conta.modo = modoInicial();
  if (conta.modo === 'local') return;
  conta.nuvem = nuvem || criarNuvem();
  const lk = conta.nuvem.sessaoDoLink(location.hash);
  if (lk) { history.replaceState(null, '', location.pathname); if (lk.tipo === 'recovery') { abrirAcesso('nova-senha'); return; } }
  if (!conta.nuvem.sessao()) { abrirAcesso('entrar'); return; }
  conectar(!!lk);
}
function abrirAcesso(tela, msg = ''){ conta.tela = tela; conta.msg = msg; conta.erro = ''; conta.ocupado = false; desenharAcesso(); }
function fecharAcesso(){ conta.tela = null; desenharAcesso(); }

// Depois de entrar: descobre as clínicas da pessoa e abre a última usada (ou o primeiro acesso).
async function conectar(completar){
  conta.ocupado = true; desenharAcesso();
  try {
    if (completar || !conta.nuvem.sessao().user.email) await conta.nuvem.completarUsuario();
    conta.clinicas = await conta.nuvem.minhasClinicas();
    if (!conta.clinicas.length) { abrirAcesso('clinica'); return; }
    await abrirClinica(conta.clinicas.find(c => c.id === lerC(KEY_CLINICA)) || conta.clinicas[0]);
  } catch (e) {
    if (e.codigo === 'sem_login') abrirAcesso('entrar', 'Entre de novo para continuar.');
    else if (e.codigo === 'offline' && lerC(KEY_CACHE_DE)) { conta.clinica = { id:lerC(KEY_CACHE_DE), nome:'' }; ligarSincronia(); conta.estado = 'offline'; fecharAcesso(); aoMudarConta(); }
    else { conta.erro = e.message; conta.ocupado = false; conta.tela = conta.tela || 'entrar'; desenharAcesso(); }
  }

function ligarSincronia(){

async function enviarAcesso(f){

    : t === 'criar' ? (!v('nome').trim() ? 'Escreva o seu nome.' : !okEmail(v('email')) ? 'Confira o e-mail.' : v('senha').length < 8 ? 'A senha precisa de pelo menos 8 caracteres.' : '')

    : t === 'nova-senha' ? (v('senha').length < 8 ? 'A senha precisa de pelo menos 8 caracteres.' : '')
    : t === 'clinica' ? (!v('clinica').trim() ? 'Escreva o nome da clínica.' : !v('cidade').trim() ? 'Escreva a cidade.' : '') : '';
  if (falta) { conta.erro = falta; desenharAcesso(); return; }

  try {
    if (t === 'entrar') { await conta.nuvem.entrar(v('email'), v('senha')); await conectar(); return; }
    if (t === 'criar') { const r = await conta.nuvem.criarConta(v('email'), v('senha'), v('nome'), voltarAoSite());

      await conectar(); return; }

    if (t === 'nova-senha') { await conta.nuvem.trocarSenha(v('senha')); await conectar(true); return; }
    if (t === 'clinica') {
      const levar = !lerC(KEY_CACHE_DE) && conta.levar && (resumoDados().pacientes > 0 || resumoDados().horarios > 0);

//
// Retomar contato: pacientes com o último atendimento há mais de 21 dias e nada agendado (o mesmo
// critério do aviso "sem retorno" do Painel). A lista se monta sozinha; o profissional só registra:
//   p.relacionamento = {contatos:[{em, por}], naoRetomar?:{em, por}} (criado no primeiro registro)
// Interessados: quem procurou e ainda não é paciente.
//   db.interessados = [{id, nome, tel, origem, sit, em, por, pid?}] (criado no primeiro interessado)
// Nada disso vai para a exportação v1. Mensagens pelo WhatsApp ficam para a etapa 7.

const DIAS_RETOMAR = 21;
const ORIGENS = ['Instagram', 'Indicação', 'Google', 'Outro'];
const SITUACOES_INTERESSADO = [['novo', 'Novo'], ['agendou', 'Agendou'], ['paciente', 'Paciente'], ['nao', 'Não seguiu']];
const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);

// [{p, ult, dias, contato, oculto}] do mais antigo para o mais recente.
function paraRetomar(db, hoje){
  return db.patients.map(p => {
    const l = p.sessions.at(-1);
    if (!l || l.date >= hoje || diasEntre(l.date, hoje) <= DIAS_RETOMAR) return null;
    if (db.appts.some(a => a.pid === p.id && a.date >= hoje && ativo(a) && !a.done && a.st !== 'faltou')) return null;
    const r = p.relacionamento || {};
    return { p, ult: l.date, dias: diasEntre(l.date, hoje), contato: r.contatos?.[0] || null, oculto: !!r.naoRetomar };
  }).filter(Boolean).sort((a, b) => b.dias - a.dias);
}
function registrarContato(p, em, por){
  const r = p.relacionamento ||= {};
  (r.contatos ||= []).unshift({ em, por });
  return r.contatos[0];
}
// Tira (ou devolve) o paciente da lista de retomar contato, sem apagar nada.
function naoRetomar(p, sim, em, por){
  const r = p.relacionamento ||= {};
  if (sim) r.naoRetomar = { em, por }; else delete r.naoRetomar;
  return !!r.naoRetomar;
}

function novoInteressado(db, { id, nome, tel, origem, em, por }){

  const i = { id, nome: n, tel: String(tel || '').trim(), origem: ORIGENS.includes(origem) ? origem : 'Outro', sit: 'novo', em, por };
  (db.interessados ||= []).unshift(i);
  return i;
}
function situacaoInteressado(i, sit){
  if (!SITUACOES_INTERESSADO.some(s => s[0] === sit) || (sit === 'paciente' && !i.pid)) return null;
  i.sit = sit;
  return sit;
}
// Ao cadastrar o interessado como paciente, os dois ficam ligados.
function virouPaciente(i, pid){ i.sit = 'paciente'; i.pid = pid; return i; }

//
// O valor combinado continua no horário da agenda (a.valor); o que entrou de fato fica à parte, em
// db.financeiro, para o horário e a exportação v1 não mudarem:
//   db.financeiro = {
//     inicio: 'aaaa-mm-dd'   (primeiro dia do mês em que o financeiro foi aberto; atendimentos antes disso
//                              não entram em A receber, para não cobrar o histórico antigo)
//     recebimentos: [{id, ap, valor, forma, data, por}]   (ap = horário da agenda; parcial é permitido)
//     pacotes: [{id, pid, serv, total, valor, em, por}]   (pago na compra; cada atendido do serviço desconta uma)
//     despesas: [{id, desc, cat, valor, data, repete, ate?, por}]   (repete = entra todo mês; ate = último mês)
//   }
// A nota fiscal (NFS-e) automática fica para a etapa 10; aqui só os dados prontos para a nota.

const FORMAS = ['Pix', 'Dinheiro', 'Débito', 'Crédito'];
const CATEGORIAS_DESP = ['Aluguel', 'Material', 'Contas', 'Outros'];
const mesDe = d => String(d).slice(0, 7);
const somaFin = (L, f = x => x.valor) => L.reduce((n, x) => n + f(x), 0);
const centavos = v => Math.round(v * 100) / 100;

// Lê um valor digitado ("1.150,50", "90", "R$ 40,00") como número.
const lerValor = s => { const t = String(s ?? '').replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'); return t ? Number(t) : NaN; };

// Estrutura do financeiro, criada na primeira vez (devolve se acabou de criar, para gravar).
function financeiroDe(db, hoje){
  if (db.financeiro) return [db.financeiro, false];
  db.financeiro = { inicio: mesDe(hoje) + '-01', recebimentos: [], pacotes: [], despesas: [] };
  return [db.financeiro, true];
}
const F = db => db.financeiro || { inicio: '9999-12-31', recebimentos: [], pacotes: [], despesas: [] };

const recebidoDe = (db, apId) => somaFin(F(db).recebimentos.filter(r => r.ap === apId));
// Horários atendidos cobertos por pacote: Map(horário → pacote). Cada pacote cobre, em ordem, os
// atendidos do mesmo paciente e serviço a partir da compra, sem recebimento avulso, até o total.
function coberturaPacotes(db){
  const M = new Map(), uso = {};
  const at = db.appts.filter(a => a.done && ativo(a) && !F(db).recebimentos.some(r => r.ap === a.id)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const P = F(db).pacotes.slice().sort((a, b) => a.em.localeCompare(b.em));
  for (const a of at) { const k = P.find(k => k.pid === a.pid && k.serv === a.tipo && k.em <= a.date && (uso[k.id] || 0) < k.total);
    if (k) { M.set(a.id, k); uso[k.id] = (uso[k.id] || 0) + 1; } }
  return M;
}
const usosPacote = (db, k, cob = coberturaPacotes(db)) => [...cob.values()].filter(x => x.id === k.id).length;
const faltaDe = (db, a, cob = coberturaPacotes(db)) => cob.has(a.id) ? 0 : Math.max(0, centavos((a.valor || 0) - recebidoDe(db, a.id)));

// Atendimentos feitos (até hoje, desde o início do financeiro) com algo ainda a receber.
function aReceber(db, hoje){
  const cob = coberturaPacotes(db), ini = F(db).inicio;
  return db.appts.filter(a => a.done && ativo(a) && a.date >= ini && a.date <= hoje && faltaDe(db, a, cob) > 0)
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}

// Recebe um valor (até o que falta). Devolve o recebimento, ou um texto com o motivo de não aceitar.
function receber(db, apId, { id, valor, forma, data, por }){
  const a = db.appts.find(x => x.id === apId), f = a ? faltaDe(db, a) : 0, v = centavos(Number(valor));
  if (!a) return 'Atendimento não encontrado';
  if (!(v > 0)) return 'Informe o valor recebido';
  if (v > f + 0.001) return `O valor passa do que falta (${brl(f)})`;
  if (!FORMAS.includes(forma)) return 'Escolha a forma de pagamento';
  const r = { id, ap: apId, valor: v, forma, data, por };
  F(db).recebimentos.push(r);
  return r;
}
function desfazerRecebimento(db, id){
  const L = F(db).recebimentos, i = L.findIndex(r => r.id === id);
  if (i < 0) return false; L.splice(i, 1); return true;
}

function novoPacote(db, { id, pid, serv, total, valor, em, por }){
  const t = Math.round(Number(total)), v = centavos(Number(valor));
  if (!pid || !serv || !(t > 0) || !(v > 0)) return null;
  const k = { id, pid, serv, total: t, valor: v, em, por };
  F(db).pacotes.push(k);
  return k;
}

function novaDespesa(db, { id, desc, cat, valor, data, repete, por }){
  const d = String(desc || '').trim(), v = centavos(Number(valor));
  if (!d || !(v > 0)) return null;
  const x = { id, desc: d, cat: CATEGORIAS_DESP.includes(cat) ? cat : 'Outros', valor: v, data, repete: !!repete, por };
  F(db).despesas.push(x);
  return x;
}
const mesAnterior = m => { const [a, b] = m.split('-').map(Number); return b === 1 ? `${a - 1}-12` : `${a}-${String(b - 1).padStart(2, '0')}`; };
// Tira a despesa do mês. A que repete e veio de um mês anterior para de repetir a partir deste mês
// (os meses anteriores continuam com ela); a lançada neste mês sai de vez.
function removerDespesa(db, id, mes){
  const L = F(db).despesas, d = L.find(x => x.id === id);
  if (!d) return false;
  if (d.repete && mesDe(d.data) < mes) d.ate = mesAnterior(mes); else L.splice(L.indexOf(d), 1);
  return true;
}
// Despesas do mês: as lançadas nele e as que repetem (no mesmo dia, até o dia 28).
function despesasDoMes(db, mes){
  return F(db).despesas.flatMap(d => mesDe(d.data) === mes ? [d]
    : d.repete && mesDe(d.data) < mes && (!d.ate || d.ate >= mes) ? [{ ...d, data: `${mes}-${String(Math.min(28, Number(d.data.slice(8)))).padStart(2, '0')}`, repetida: true }] : [])
    .sort((a, b) => a.data.localeCompare(b.data));
}
const recebimentosDoMes = (db, mes) => F(db).recebimentos.filter(r => mesDe(r.data) === mes).slice().reverse();

// Resumo do mês: recebido (avulsos + pacotes vendidos no mês), a receber, despesas e saldo.
function resumoMes(db, mes, hoje){

}

    <div class="card" id="f-arec"><div class="card-h"><h2>A receber<small>atendimentos feitos que ainda não foram pagos (ou só em parte)</small></h2><span class="pill ${pend.length ? 'warn' : 'ok'}">${pend.length}</span></div>

          <label class="rx-f fin-val"><span class="lbl">Valor recebido</span><input id="rec-v" inputmode="decimal" value="${esc(Rx.valor)}" autocomplete="off"></label><div class="chips"><button class="btn sm pri">${ic('check')}Confirmar</button><button type="button" class="btn sm ghost" data-act="fin-rec-x">Cancelar</button></div></form>`
