name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Equivalência com o protótipo v1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Cálculos idênticos à referência (51 casos)
        run: npm test

      - name: dist/spazio.html está atualizado
        run: |
          npm run build
          git diff --exit-code -- dist/spazio.html || { echo "dist/spazio.html está desatualizado. Rode npm run build e envie o arquivo."; exit 1; }

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Telas, dados e abertura sem servidor
        run: npm run test:navegador
