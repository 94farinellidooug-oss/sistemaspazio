name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Equivalência com o protótipo v1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Cálculos idênticos à referência (51 casos)
        run: npm test

      - name: dist/spazio.html está atualizado
        run: |
          npm run build
          git diff --exit-code -- dist/spazio.html || { echo "dist/spazio.html está desatualizado. Rode npm run build e envie o arquivo."; exit 1; }

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Telas, dados e abertura sem servidor
        run: npm run test:navegador

      - name: Proposta navegável da etapa 3
        run: node tests/proposta-etapa3.mjs

      - name: Proposta navegável da etapa 4
        run: node tests/proposta-etapa4.mjs

      - name: Proposta navegável da etapa 5
        run: node tests/proposta-etapa5.mjs

      - name: Proposta navegável da etapa 6
        run: node tests/proposta-etapa6.mjs
      - name: Proposta dos modelos de documento
        run: node tests/proposta-modelos.mjs
      - name: Proposta navegável da etapa 7
        run: node tests/proposta-etapa7.mjs
      - name: Proposta navegável da etapa 8
        run: node tests/proposta-etapa8.mjs
      - name: Proposta navegável da etapa 9
        run: node tests/proposta-etapa9.mjs
      - name: Prévia da página de apresentação (etapa 10)
        run: node tests/proposta-etapa10.mjs
      - name: Proposta de contas, equipe e configurações (etapa 10)
        run: node tests/proposta-etapa10-contas.mjs

  banco:
    name: Regras do banco (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: teste
    steps:
      - uses: actions/checkout@v4
      - name: Estrutura e regras de acesso do banco
        run: bash tests/banco.sh
